  /* Las tres baldosas de «Presupuesto contra real» abrían un modal vacío: los
     nombres existían en los botones pero no acá. */
  else if(cual==="planIng"){ titulo="Ingreso presupuestado &middot; "+S.ui.per+" "+S.ui.anio;
    lineas=[]; total=planIngresos(k);
    permsActivos(k).forEach(function(f){
      if((f.tipo||"Egreso")!=="Ingreso" || !cts(f.monto)) return;
      lineas.push({t:f.desc||f.cat||"(sin nombre)",
        n:(f.cat||"sin rubro")+(movDePerm(k,f.id)?" · ya registrado":" · todavía sin registrar"),
        v:red(+f.monto||0)});
    });
    formula="Suma de los <b>ingresos permanentes activos</b> de la ventana, estén marcados o no. "+
      "Es el plan, no lo que entró: lo que entró de verdad son los movimientos de tipo Ingreso."; }
  else if(cual==="presupuestado"){ titulo="Gasto presupuestado &middot; "+S.ui.per+" "+S.ui.anio;
    lineas=[]; total=totPresupuestado(k);
    var pB=presuDe(k);
    Object.keys(pB).forEach(function(c){
      if(pB[c]==null||pB[c]==="") return;
      var rr=rubroDe(k,c);
      lineas.push({t:c, n:rr? ("real "+fmt(rr.gastado)+(rr.notas?" · notas "+fmt(rr.notas):"")) : "",
                   v:red(+pB[c]||0)});
    });
    lineas.sort(function(a,b){ return b.v-a.v; });
    formula="Suma del importe asignado a cada rubro en esta ventana. Es un límite que vos ponés, "+
      "no plata: no entra en el saldo real."; }
  else if(cual==="planRes"){ titulo="Saldo presupuestado &middot; "+S.ui.per+" "+S.ui.anio;
    var piR=planIngresos(k), pgR=totPresupuestado(k);
    lineas=[{t:"Ingreso presupuestado", n:"permanentes de ingreso activos", v:piR},
            {t:"Gasto presupuestado", n:"suma de los rubros con importe asignado", v:red(-pgR)}];
    total=red(piR-pgR);
    formula="<code>ingreso presupuestado − gasto presupuestado</code><br><code>"+
      fmt(piR)+" − "+fmt(pgR)+" = "+fmt(red(piR-pgR),true)+"</code><br>"+
      "Es el margen que todavía no está asignado a ningún rubro. No es dinero."; }
  else if(cual==="rubro"){ titulo="Gasto real &middot; "+extra;
    lista=movsDe(k).filter(function(m){ return m.tipo!=="Ingreso" && (m.cat||"Sin categoría")===extra; });
    lista.forEach(function(m){ total+=cts(m.monto); }); total/=100;
    formula="Suma de los "+lista.length+" movimientos de la ventana en este rubro."; }

  var cuerpo;
  if(lineas){
    cuerpo=lineas.length? '<div class="tabla-cont"><table><thead><tr>'+
      '<th class="plano">Concepto</th><th class="plano">Detalle</th><th class="plano" style="text-align:right">Monto</th>'+
      '</tr></thead><tbody>'+lineas.map(function(x){
        return '<tr><td style="padding:5px 8px">'+esc(x.t)+'</td>'+
          '<td style="padding:5px 8px" class="sub">'+(x.n||"")+'</td>'+
          '<td style="padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums">'+fmt(x.v)+'</td></tr>';
      }).join("")+'</tbody></table></div>' : '';
    abreModal('<div class="mh"><h3>'+esc(titulo)+'</h3><div class="sp"></div><button class="icb" data-acc="cerrar">×</button></div>'+
      '<div class="mb" data-t="modalDesglose"><div class="desg-tot">'+fmt(total,cual==="libre"||cual==="planRes")+'</div>'+
      '<div class="desg-frm">'+formula+'</div>'+cuerpo+'</div>'+
      '<div class="mf"><button class="btn gh" data-acc="cerrar">Cerrar</button></div>', true);
    return;
  }
  lista=lista.slice().sort(function(a,b){ return String(a.fecha)<String(b.fecha)?-1:1; });
  var filas=lista.map(function(m){
    return '<tr><td style="padding:5px 8px;white-space:nowrap">'+esc(fmtF(m.fecha))+'</td>'+
      '<td style="padding:5px 8px">'+esc(m.desc||"(sin descripción)")+
        (m.motivo?' <span class="sub">· '+esc(m.motivo)+'</span>':'')+
        (m.permId?' <span class="chip ok">permanente</span>':'')+'</td>'+
      '<td style="padding:5px 8px" class="sub">'+esc(m.cat||"")+'</td>'+
      '<td style="padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums'+(cts(m.monto)<0?";color:var(--mal)":"")+'">'+
        (m.tipo==="Ingreso"?"+":"")+fmt(m.monto)+'</td></tr>';
  }).join("");

  abreModal('<div class="mh"><h3>'+esc(titulo)+'</h3><div class="sp"></div><button class="icb" data-acc="cerrar">×</button></div>'+
    '<div class="mb" data-t="modalDesglose">'+
      '<div class="desg-tot">'+fmt(total,cual==="queda")+'</div>'+
      '<div class="desg-frm">'+formula+'</div>'+
      (lista.length?'<div class="tabla-cont"><table><thead><tr>'+
        '<th class="plano">Fecha</th><th class="plano">Descripción</th><th class="plano">Categoría</th><th class="plano" style="text-align:right">Monto</th>'+
      '</tr></thead><tbody>'+filas+'</tbody></table></div>':'<p class="sub">No hay movimientos que compongan este número.</p>')+
    '</div>'+
    '<div class="mf"><button class="btn gh" data-acc="cerrar">Cerrar</button></div>', true);
}

/* Redibuja la libreta de tarjetas sin perder el scroll del modal. Mismo patrón
   que reListas: el modal se rehace entero, así que hay que devolver el scroll. */
function reTarjetas(alFinal){
  var vp=document.querySelector('[data-t="modalAjustes"]');
  var y=vp?vp.scrollTop:0;
  abreAjustes("tarjetas");
  var v2=document.querySelector('[data-t="modalAjustes"]');
  if(!v2) return;
  if(alFinal){
    v2.scrollTop=v2.scrollHeight;
    var fs=v2.querySelectorAll("tr[data-tj]");
    var ul=fs[fs.length-1], inp=ul&&ul.querySelector('[data-tc="nombre"]');
    if(inp) inp.focus();
  } else v2.scrollTop=y;
}
function reListas(){                        /* redibuja la sección sin perder el scroll */
  var vp=document.querySelector('[data-t="modalAjustes"]');
  var y=vp?vp.scrollTop:0;
  abreAjustes("listas");
  var v2=document.querySelector('[data-t="modalAjustes"]');
  if(v2) v2.scrollTop=y;
}
function mueveLista(campo,de,a){
  var L=S[campo];
  if(!L||de<0||de>=L.length) return false;
  if(a<0) a=0; if(a>L.length-1) a=L.length-1;
  if(a===de) return false;
  L.splice(a,0,L.splice(de,1)[0]);
  guardar(); render(); reListas();
  return true;
}
var arrLista=null;                          /* {campo, de} mientras se arrastra */
function arrLimpia(){
  var m=document.querySelectorAll(".lista-cfg .it.sobre,.lista-cfg .it.sobre-ab,.lista-cfg .it.arr");
  for(var i=0;i<m.length;i++) m[i].classList.remove("sobre","sobre-ab","arr");
}
function arrFin(){ arrLista=null; arrLimpia(); }
function arrFila(ev){                       /* fila de la MISMA lista que se arrastra */
  var t=ev.target, it=t&&t.closest?t.closest(".it"):null;
  if(!it) return null;
  var cl=it.closest("[data-lista]");
  if(!cl||!arrLista||cl.getAttribute("data-lista")!==arrLista.campo) return null;
  return it;
}
document.addEventListener("dragstart", function(ev){
  var t=ev.target;
  if(!t||!t.classList||!t.classList.contains("asa")) return;
  var it=t.closest(".it"), cl=it&&it.closest("[data-lista]");
  if(!it||!cl) return;
  arrLista={campo:cl.getAttribute("data-lista"), de:+it.getAttribute("data-i")};
  it.classList.add("arr");
  try{ ev.dataTransfer.effectAllowed="move"; ev.dataTransfer.setData("text/plain","lista"); }catch(e){}
});
document.addEventListener("dragover", function(ev){
  var it=arrFila(ev); if(!it) return;
  ev.preventDefault();
  try{ ev.dataTransfer.dropEffect="move"; }catch(e){}
  var r=it.getBoundingClientRect(), abajo=(ev.clientY-r.top)>r.height/2;
  var m=document.querySelectorAll(".lista-cfg .it.sobre,.lista-cfg .it.sobre-ab");
  for(var i=0;i<m.length;i++) m[i].classList.remove("sobre","sobre-ab");
  if(+it.getAttribute("data-i")!==arrLista.de) it.classList.add(abajo?"sobre-ab":"sobre");
});
document.addEventListener("drop", function(ev){
  var it=arrFila(ev);
  if(!it){ arrFin(); return; }
  ev.preventDefault();
  var r=it.getBoundingClientRect(), abajo=(ev.clientY-r.top)>r.height/2;
  var sobre=+it.getAttribute("data-i"), de=arrLista.de, campo=arrLista.campo;
  var a=abajo?sobre+1:sobre;   /* punto de inserción contando la fila arrastrada */
  if(de<a) a--;                /* al sacarla, todo lo de abajo sube un lugar */
  arrLista=null; arrLimpia();
  mueveLista(campo,de,a);
});
document.addEventListener("dragend", function(){ arrFin(); });

function importarJSON(txt){
  var d;
  try{ d=JSON.parse(txt); }catch(e){ toast("No se pudo leer el archivo: no es un JSON válido."); return; }
  /* Un respaldo lleva anotada la cuenta de la que salió. Si no es la abierta,
     se avisa: importarlo lo subiría al documento de ESTA cuenta. */
  if(d && d.cuenta && String(d.cuenta)!==CUENTA &&
     !confirm("Este respaldo es de la cuenta «"+d.cuenta+"» y ahora está abierta «"+CUENTA+"».\n\n"+
              "Importarlo reemplaza los datos de «"+CUENTA+"» y los sube a su documento en la nube.\n\n"+
              "¿Importar de todas formas?")) return;
  if(!d||typeof d!=="object"){ toast("El archivo no tiene la forma esperada."); return; }
  var esRespaldo=!!(d.v&&Array.isArray(d.ventanas)&&Array.isArray(d.movimientos));
  if(!esRespaldo&&!Array.isArray(d.movimientos)&&!Array.isArray(d.permanentes)){
    toast("El archivo no trae movimientos ni permanentes."); return; }
  /* Importar REEMPLAZA todo. Nunca en silencio. */
  if(S.movimientos.length||S.ventanas.length){
    if(!confirm("Importar reemplaza TODO lo que hay ahora:\n\n"+
      "  · "+S.movimientos.length+" movimiento(s)\n"+
      "  · "+S.ventanas.length+" ventana(s)\n"+
      "  · "+Object.keys(S.perms).reduce(function(a,x){return a+S.perms[x].length;},0)+" permanente(s) y los presupuestos\n\n"+
      "La operación no se puede deshacer. Para conservarlo: cancelar y usar Ajustes → Descargar respaldo.\n\n¿Continuar?")) return;
  }

  /* respaldo de esta misma app */
  if(d.v && Array.isArray(d.ventanas) && Array.isArray(d.movimientos)){
    S=d; cargarNormaliza(); guardar(); cierraModal(); render();
    toast("Respaldo restaurado: "+S.movimientos.length+" movimientos en "+S.ventanas.length+" ventana(s)."); return;
  }
  /* semilla */
  var anio=(d.ventana&&d.ventana.anio)||new Date().getFullYear();
  var per=(d.ventana&&d.ventana.per)||"Ene-Feb";
  var k=K(anio,per);

  S=estadoVacio();
  S.formas=(d.formas||[]).slice();
  S.catE=(d.catE||[]).slice();
  S.catI=(d.catI||[]).slice();
  S.catIcons=d.catIcons||{};
  S.tarjetas=(d.tarjetas||[]).slice();
  var permsSemilla=(d.permanentes||[]).map(function(f,i){
    var o=JSON.parse(JSON.stringify(f));
    o.id=o.id||("p"+i+"_"+Math.random().toString(36).slice(2,7));
    o.tipo=o.tipo||"Egreso"; o.monto=+o.monto||0;
    if(o.activo!==false) o.activo=true;
    delete o.alias; delete o.desde;
    return o;
  });
  S.movimientos=(d.movimientos||[]).map(function(m,i){
    return {id:m.id||("s"+i), k:k, fecha:m.fecha||"", tipo:m.tipo||"Egreso",
            desc:m.desc||"", monto:red(+m.monto||0), cat:m.cat||"", pago:m.pago||"",
            nota:m.nota||"", motivo:"", fx:"", permId:null, origen:"semilla"};
  });
  S.ventanas=[{anio:anio, per:per}];
  S.perms[k]=permsSemilla;
  S.ui.anio=anio; S.ui.per=per; S.ui.tab="hoy";

  cargarNormaliza(); guardar(); cierraModal(); render();
  var t=totales(k);
  toast(S.movimientos.length+" movimientos &middot; "+permsK(k).length+" permanentes &middot; "+
        per+" "+anio+" queda "+fmt(t.queda,true), 6000);
}
function cargarNormaliza(){
  var vac=estadoVacio();
  for(var kk in vac) if(!(kk in S)) S[kk]=vac[kk];
  for(var u in vac.ui) if(!(u in S.ui)) S.ui[u]=vac.ui[u];
  S.ui.busca="";                               /* la búsqueda no sobrevive a la recarga */
  if(S.ui.tab==="rub") S.ui.tab="hoy";         /* la pestaña Presupuesto se fusionó con Hoy */
  normalizaTarjetas();
  /* La descripción del banco se conserva intacta (de ella dependen la detección de
     repetidas y la sugerencia de categoría). "motivo" es el texto de Victor y "fx"
     el sello de conversión que pone la app. Migración de la vieja columna "nota". */
  S.movimientos.forEach(function(m){
    if("nota" in m){
      if(m.nota){
        if(/@/.test(m.nota) && /USD|CAD|EUR/i.test(m.nota)) m.fx=m.fx||m.nota;
        else m.motivo=m.motivo||m.nota;
      }
      delete m.nota;                           /* el campo viejo desaparece del todo */
    }
    if(m.motivo==null) m.motivo="";
    if(m.fx==null) m.fx="";
    /* El monto SIEMPRE número. Un respaldo editado a mano puede traer
       "1,234.56", y cts() lo lee como 0: plata que desaparece en silencio. */
    if(typeof m.monto!=="number" || !isFinite(m.monto)) m.monto=red(parseMonto(m.monto));
    if(m.k!=null) m.k=String(m.k);
  });
  /* Presupuestos y permanentes de ventanas que ya no existen: los caminos de
     lectura crean la clave vacía al pasar, y esas claves fantasma se subían a la
     nube. Se limpian solo si están vacías; nunca se borra nada con contenido. */
  (function(){
    var vivas={};
    (S.ventanas||[]).forEach(function(v){ vivas[v.anio+"|"+v.per]=1; });
    Object.keys(S.presu||{}).forEach(function(kk){
      if(!vivas[kk] && !Object.keys(S.presu[kk]||{}).length) delete S.presu[kk]; });
    Object.keys(S.perms||{}).forEach(function(kk){
      if(!vivas[kk] && !(S.perms[kk]||[]).length) delete S.perms[kk]; });
  })();
  /* Vínculos de reembolso que apuntan a un movimiento borrado (revertir un
     bloque, borrar una ventana, respaldo editado a mano): se sueltan. */
  var vivos={};
  S.movimientos.forEach(function(m){ vivos[m.id]=1; });
  S.movimientos.forEach(function(m){ if(m.reembDe && !vivos[m.reembDe]) delete m.reembDe; });
  if(!S.catE.length) S.catE=CAT_E_BASE.slice();
  if(!S.catI.length) S.catI=CAT_I_BASE.slice();
  if(!Array.isArray(S.prestamos)) S.prestamos=[];
  if(!Array.isArray(S.bitacora)) S.bitacora=[];
  if(!S.prestamos.length && !S.prefs.sinPrestamoBase) S.prestamos=JSON.parse(JSON.stringify(PRESTAMO_BASE));
  /* Nunca dejar plata invisible: si un movimiento apunta a una ventana que no existe
     (respaldo editado a mano, archivo truncado), se crea la ventana para que aparezca. */
  var huerfanos={};
  S.movimientos.forEach(function(m){
    if(!m.k) return;
    if(!S.ventanas.some(function(v){ return K(v.anio,v.per)===m.k; })) huerfanos[m.k]=(huerfanos[m.k]||0)+1;
  });
  var nh=Object.keys(huerfanos);
  if(nh.length){
    nh.forEach(function(k){
      var p=k.split("|"), a=parseInt(p[0],10);
      S.ventanas.push({anio:isNaN(a)?0:a, per:p[1]||"?"});
    });
    setTimeout(function(){
      toast("Se crearon "+nh.length+" ventana(s) para movimientos huérfanos: "+nh.map(nomVentana).join(", "),8000);
    },400);
  }
  ordenaVentanas();
  if(!S.ventanas.length){ S.ui.anio=null; S.ui.per=null; return; }
  var hay=S.ventanas.some(function(v){ return K(v.anio,v.per)===kAct(); });
  if(!hay){ var v=S.ventanas[S.ventanas.length-1]; S.ui.anio=v.anio; S.ui.per=v.per; }
  /* Migración desde la versión de lista global: se muda a la ventana activa. */
  if(Array.isArray(S.permanentes) && S.permanentes.length){
    var kk=kAct();
    if(kk && !(S.perms[kk]&&S.perms[kk].length)) S.perms[kk]=S.permanentes;
    S.permanentes=[];
  }
  Object.keys(S.perms).forEach(function(kk){
    S.perms[kk].forEach(function(f,i){
      if(!f.id) f.id="p"+i+"_"+Math.random().toString(36).slice(2,7);
      if(Array.isArray(f.alias)&&f.alias.length){    /* alias viejos → mapa global */
        S.alias[f.id]=Array.from(new Set(aliasDe(f.id).concat(f.alias)));
        delete f.alias;
      }
    });
  });
}
function exportar(){
  /* La cuenta va DENTRO del archivo, no solo en su nombre: al importarlo la app
     puede avisar si el respaldo es de otra cuenta. Es un campo suelto; cargar()
     lo ignora porque no forma parte del estado. */
  var txt=JSON.stringify(Object.assign({cuenta:CUENTA}, S),null,1);
  var nom="respaldo_finanzas_"+CUENTA+"_"+hoyISO()+".json";   /* con la cuenta, para no mezclar respaldos */
  try{
    var b=new Blob([txt],{type:"application/json"}), u=URL.createObjectURL(b);
    var a=document.createElement("a"); a.href=u; a.download=nom;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
    toast("Respaldo descargado");
  }catch(e){ verJSON(); }
}
function verJSON(){
  abreModal('<div class="mh"><h3>Respaldo en texto</h3><div class="sp"></div><button class="icb" data-acc="cerrar">×</button></div>'+
    '<div class="mb"><p class="sub">Si la descarga no funciona, copiá esto y pegalo en un archivo <code>.json</code>.</p>'+
    '<textarea id="jsonOut" style="width:100%;height:300px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;border:1px solid var(--linea);border-radius:8px;padding:9px" readonly>'+
    esc(JSON.stringify(S))+'</textarea></div>'+
    '<div class="mf"><button class="btn gh" data-acc="copiar-json">Copiar todo</button><button class="btn gh" data-acc="cerrar">Cerrar</button></div>',true);
}
function pedirArchivo(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){ importarJSON(String(fr.result)); };
    fr.onerror=function(){ toast("No se pudo leer el archivo."); };
    fr.readAsText(f);
  };
  inp.click();
}

/* Anotar un gasto en el momento — típicamente efectivo. Un renglón fijo arriba
   de la tabla: descripción, monto, Enter, y sigue listo para el siguiente. */
function anotarRapido(){
  var q=S.prefs.qa||(S.prefs.qa={});
  var fe=$("#qaFecha").value, de=String($("#qaDesc").value||"").trim();
  q.tipo=$("#qaTipo").value; q.fecha=fe; q.cat=$("#qaCat").value; q.pago=$("#qaPago").value;
  q.mon=($("#qaMon")||{value:"Lps"}).value||"Lps";
  var cv=montoLps($("#qaMonto").value+" "+(q.mon==="Lps"?"":q.mon));
  var falta=[];
  if(!fe) falta.push("la fecha");
  if(!de) falta.push("la descripción");
  if(!cts(cv.lps)) falta.push("el monto");
  if(falta.length){ guardar(); toast((falta.length>1?"Faltan ":"Falta ")+falta.join(", ")); return; }
  if(cv.mon!=="Lps"&&!cv.tasa){ toast("Sin tasa para "+cv.mon+" · cargarla en el tipo de cambio",5000); return; }
  /* Mismo aviso que en el pegado, ahora también en el alta de a uno: si ya hay
     un movimiento igual a pocos días, se pregunta antes de crear el segundo. */
  var gem=bRepetida({fecha:fe, desc:de, monto:String(cv.lps)});
  if(gem && !confirm("Posible duplicado.\n\nYa hay un movimiento «"+(gem.mov.desc||"")+"» por "+
      fmt(gem.mov.monto)+" del "+fmtF(gem.mov.fecha)+
      (gem.otra?" en "+nomVentana(gem.k):" en esta ventana")+
      (gem.dias?" ("+gem.dias+" día"+(gem.dias===1?"":"s")+" de diferencia)":"")+".\n\n"+
      "¿Registrar este de todas formas?")) return;
  var mvR={id:id(), k:kAct(), fecha:fe, tipo:q.tipo, desc:de, monto:cv.lps,
    cat:q.cat||"", pago:q.pago||"", motivo:"", fx:notaFX(cv), permId:null, origen:"manual"};
  S.movimientos.push(mvR);
  anota("individual","Alta rápida · "+de, [mvR], []);
  /* Con un filtro puesto, lo recién anotado quedaría escondido y parecería que
     no se guardó. La búsqueda se limpia; el filtro de tipo se respeta salvo que
     esconda justo lo que se acaba de anotar. */
  S.ui.busca="";
  if(S.ui.fTipo && S.ui.fTipo!=="todo" && S.ui.fTipo!==mvR.tipo) S.ui.fTipo="todo";
  guardar(); render();
  /* Un gasto anotado a mano también puede ser el que estaba en una nota: si
     calza, se propone soltarla. Sin esto la nota seguía viva y el mismo gasto
     se contaba dos veces — una en Real y otra en Notas. */
  CUB_PEND=cubrirPropuesta(kAct(),[mvR]); abreCubrirPendiente();
  toast("Registrado &middot; "+fmt(cv.lps)+(cv.mon!=="Lps"?" ("+notaFX(cv)+")":""));
  var d=$("#qaDesc"); if(d) d.focus();
}
function borrarMovimiento(mid){
  var m=S.movimientos.filter(function(x){return x.id===mid;})[0];
  if(!m) return;
  if(m.desc||cts(m.monto)){ if(!confirm("¿Borrar el movimiento «"+(m.desc||"(sin descripción)")+"» por "+fmt(m.monto)+"?")) return; }
  S.movimientos=S.movimientos.filter(function(x){return x.id!==mid;});
  reembOlvida(mid);                      /* no dejar vínculos colgando */
  guardar(); render();
}
/* =============================================================================
   BITÁCORA
   Cada guardado deja una fila. Sirve para una cosa concreta: si un bloque entero
   entró en la ventana equivocada, revertirlo de un golpe en vez de borrar fila
   por fila. Se anota qué movimientos creó y qué permanentes dio de alta, que es
   lo único que hay que deshacer.
============================================================================= */
function anota(tipo,detalle,movs,permsNuevos){
  var m=(movs||[]).filter(Boolean);
  var tot=0; m.forEach(function(x){ tot+=cts(x.monto); });
  S.bitacora.unshift({id:"b"+id(), ts:new Date().toISOString(), k:kAct(),
    tipo:tipo, detalle:detalle||"", n:m.length, monto:tot/100,
    movs:m.map(function(x){ return x.id; }),
    permsNuevos:(permsNuevos||[]).slice(), revertido:false});
  if(S.bitacora.length>300) S.bitacora.length=300;
}
function bitVivos(e){
  var vivos=[];
  (e.movs||[]).forEach(function(mid){
    var m=S.movimientos.filter(function(x){ return x.id===mid; })[0];
    if(m) vivos.push(m);
  });
  return vivos;
}
function revertirBit(bid){
  var e=S.bitacora.filter(function(x){ return x.id===bid; })[0];
  if(!e || e.revertido) return;
  var vivos=bitVivos(e), faltan=(e.movs||[]).length-vivos.length, tot=0;
  vivos.forEach(function(m){ tot+=cts(m.monto); });
  var pn=(e.permsNuevos||[]).filter(function(pid){
    return permsK(e.k).some(function(p){ return p.id===pid; });
  });
  if(!vivos.length && !pn.length){
    e.revertido=true; guardar(); render();
    toast("No quedaba nada que revertir: esos movimientos ya no existen"); return;
  }
  if(!confirm("¿Revertir «"+(e.detalle||e.tipo)+"» de "+nomVentana(e.k)+"?\n\n"+
      "Se eliminan "+vivos.length+" movimiento(s) por "+fmt(tot/100)+
      (pn.length?"\nY se quitan "+pn.length+" permanente(s) que ese guardado dio de alta.":"")+
      (faltan?"\n\n"+faltan+" ya no existían: se borraron o se editaron aparte.":"")+
      "\n\nEsto no se puede deshacer.")) return;
  var ids={}; vivos.forEach(function(m){ ids[m.id]=1; });
  S.movimientos=S.movimientos.filter(function(m){ return !ids[m.id]; });
  pn.forEach(function(pid){
    if(movDePerm(e.k,pid)) return;                 /* quedó ligado a otro cobro: se respeta */
    S.perms[e.k]=permsK(e.k).filter(function(p){ return p.id!==pid; });
  });
  e.revertido=true; e.revertidoTs=new Date().toISOString();
  guardar(); render(); abreAjustes("bitacora");
  toast("Revertido &middot; "+vivos.length+" movimiento(s) eliminados por "+fmt(tot/100),6000);
}

/* --- REGLA 2: esto ocurre SOLO cuando Victor toca la casilla --- */
function marcarPermanente(pid,on){
  var k=kAct(), f=permsK(k).filter(function(x){return x.id===pid;})[0];
  if(!f) return;
  var mv=movDePerm(k,pid);
  if(on){
    if(mv) return;
    /* Si en esta ventana ya hay plata registrada en ese rubro sin ligar a nadie,
       marcar la casilla la cuenta OTRA VEZ. En un préstamo eso además hace
       avanzar el plan de pagos una cuota de más. Se pregunta; no se decide. */
    var gemelos=sueltoIgual(k,f);
    if(gemelos.length && !confirm(
        "Posible doble conteo.\n\nEn "+S.ui.per+" "+S.ui.anio+" ya hay "+gemelos.length+
        " movimiento(s) del mismo rubro y con un importe que calza, sin ligar a ningún permanente:\n\n"+
        gemelos.slice(0,4).map(function(m){
          return "  · "+(m.desc||"(sin descripción)")+" · "+fmt(m.monto)+" · "+fmtF(m.fecha);
        }).join("\n")+(gemelos.length>4?"\n  · …":"")+"\n\n"+
        "Marcar esta casilla registra "+fmt(f.monto)+" ADEMÁS de eso. Si es el mismo cobro, "+
        "quedaría contado dos veces.\n\n"+
        "Si ese cargo ya entró, en vez de marcar conviene ligarlo desde su fila en Movimientos.\n\n"+
        "¿Marcar igual?")){
      var cb0=document.querySelector('.perm-fila[data-pid="'+pid+'"] input[data-c="marca"]');
      if(cb0) cb0.checked=false;
      return;
    }
    var mvP={id:id(), k:k, fecha:hoyISO(), tipo:f.tipo||"Egreso",
      desc:f.desc||f.cat||"", monto:red(+f.monto||0), cat:f.cat||"", pago:f.pago||"",
      motivo:f.motivo||"", fx:"", permId:pid, origen:"perm"};
    S.movimientos.push(mvP);
    anota("permanente","Permanente marcado · "+(f.desc||f.cat||""), [mvP], []);
    toast("Movimiento registrado &middot; "+fmt(f.monto));
    guardar(); render();
    pideCuotas(pid);                      /* si es financiamiento sin cuotas, las pide */
    return;
  } else {
    if(!mv) return;
    if(mv.origen==="perm"){
      /* Si lo editaste, ya no es la plantilla: es tu dato. No lo borro sin preguntar. */
      if(mv.editado && !confirm("El movimiento «"+(mv.desc||"")+"» por "+fmt(mv.monto)+
          " fue editado a mano después de marcarlo.\n\nDesmarcar la casilla lo elimina. ¿Eliminarlo?")){
        var cb=document.querySelector('.perm-fila[data-pid="'+pid+'"] input[type=checkbox]');
        if(cb) cb.checked=true;
        return;
      }
      S.movimientos=S.movimientos.filter(function(x){return x.id!==mv.id;});
      toast("Movimiento borrado");
    } else {
      /* Vino del banco: se desliga, NO se borra la plata real. Hay que decirlo
         fuerte — si él creía que lo borraba y vuelve a marcar, el gasto queda
         contado dos veces (y en un préstamo, el plan avanza una cuota de más). */
      mv.permId=null;
      toast("Desvinculado &middot; el movimiento de "+fmt(mv.monto)+" SIGUE REGISTRADO en gastos, "+
            "porque vino del banco &middot; para eliminarlo, borrar su fila en Movimientos", 8000);
    }
  }
  guardar(); render();
}
/* Alta de un permanente NUEVO a partir de un gasto que ya se registró.
   Sirve cuando aparece un cobro que se va a repetir y todavía no está en la lista.
   Da de alta en ESTA ventana; las anteriores no se tocan. */
function permDesdeMov(k,src){
  var p={id:"p"+id(), tipo:src.tipo||"Egreso", desc:String(src.desc||"").trim(),
         motivo:String(src.motivo||"").trim(),
         monto:red(+src.monto||0), cat:src.cat||"", pago:src.pago||"", activo:true, ultimaCuota:""};
  permsK(k).push(p);
  return p;
}
function altaPermDesdeMov(mid){
  var m=S.movimientos.filter(function(x){return x.id===mid;})[0]; if(!m) return;
  if(m.permId){
    var yp=permsK(m.k).filter(function(x){return x.id===m.permId;})[0];
    if(!confirm("Este movimiento está ligado al permanente «"+(yp?(yp.desc||yp.cat):"?")+"».\n\n"+
                "¿Quitar el vínculo? El movimiento queda registrado igual; el permanente vuelve a contar como pendiente.")) return;
    m.permId=null; guardar(); render(); toast("Desvinculado &middot; el movimiento permanece registrado");
    return;
  }
  if(!String(m.desc||"").trim() && !cts(m.monto)){ toast("Falta descripción o monto para darlo de alta."); return; }
  /* Si en la ventana ya hay permanentes de ese tipo sin cubrir, este cobro puede
     ser el de uno de ellos. Antes se daba de alta uno nuevo siempre, y el mismo
     compromiso quedaba dos veces en la lista. Ahora se elige: ligar a uno que ya
     existe, o dar de alta uno nuevo. Si no hay ninguno libre no se pregunta. */
  if(permsLibres(m.k, m.tipo).length){ abrePermMov(mid); return; }
  permAltaDirecta(mid);
}
function permAltaDirecta(mid){
  var m=S.movimientos.filter(function(x){return x.id===mid;})[0]; if(!m||m.permId) return;
  var p=permDesdeMov(m.k,{tipo:m.tipo, desc:m.desc, monto:m.monto, cat:m.cat, pago:m.pago, motivo:m.motivo});
  m.permId=p.id; aprendeDePago(p,m);
  guardar(); render();
  toast("«"+(p.desc||p.cat)+"» dado de alta como permanente &middot; ya cuenta como pagado en esta ventana",5500);
  pideCuotas(p.id, String(m.fecha||"").slice(0,7));
}
/* Permanentes de esa ventana y ese tipo que todavía no tienen su movimiento.
   Los cubiertos quedan fuera a propósito: ligar un segundo movimiento al mismo
   permanente contaría el mismo compromiso dos veces. */
function permsLibres(k,tipo){
  var t=((tipo||"Egreso")==="Ingreso")?"Ingreso":"Egreso";
  return permsK(k).filter(function(p){
    return ((p.tipo||"Egreso")===t) && !movDePerm(k,p.id);
  });
}
/* Elegir a qué permanente corresponde un movimiento ya registrado.
   Ligar NO mueve ningún número: el movimiento ya está en gastos o ingresos
   reales desde que se registró. Lo único que cambia es que ese permanente deja
   de contar como pendiente en esta ventana. */
function abrePermMov(mid){

  var k=m.k, ing=(m.tipo==="Ingreso");

  var sug=conMonto.length? buscaPerm(conMonto,m,Math.abs(+m.monto||0)) : null;
  var sid=sug? sug.perm.id : "";
  libres=libres.slice().sort(function(a,b){
    if((a.id===sid)!==(b.id===sid)) return (a.id===sid)? -1 : 1;
    return String(a.desc||a.cat||"").localeCompare(String(b.desc||b.cat||""));
  });
  var ocupados=permsK(k).filter(function(p){
    return ((p.tipo||"Egreso")===(ing?"Ingreso":"Egreso")) && movDePerm(k,p.id);
  });
  function ficha(p,acc,porque){
    return '<div class="rb-it"'+(p.id===sid?' data-t="permSug"':'')+'>'+
      '<div class="rb-d"><b>'+esc(p.desc||p.cat||"(sin nombre)")+'</b>'+
        (p.motivo?' <span class="sub">· '+esc(p.motivo)+'</span>':'')+
        '<div class="sub">'+esc(p.cat||"sin rubro")+(p.pago?' &middot; '+esc(p.pago):'')+
        (permActivo(p)?'':' &middot; <b>pausado</b>')+'</div>'+
        (porque?'<div class="sub" style="color:var(--avi-tx)">'+porque+'</div>':'')+
      '</div>'+
      '<div class="rb-m">'+fmt(p.monto)+'</div>'+(acc||"")+'</div>';
  }
  var h='<div class="mh"><h3>¿A qué permanente corresponde?</h3>'+
    '<div class="sp"></div><button class="icb" data-acc="cerrar">×</button></div>'+
    '<div class="mb">'+
    '<p class="sub" style="margin:0 0 10px">Ligar <b>no mueve ningún número</b>: este movimiento ya está '+
    'contado en '+(ing?"ingresos":"gastos")+' reales desde que se registró. Lo único que cambia es que ese '+
    'permanente deja de figurar como pendiente en esta ventana.</p>'+
    '<div class="secc"><h4>El movimiento</h4><div class="rb-it"><div class="rb-d">'+
      '<b>'+esc(m.desc||"(sin descripción)")+'</b>'+(m.motivo?' <span class="sub">· '+esc(m.motivo)+'</span>':'')+
      '<div class="sub">'+esc(fmtF(m.fecha))+' &middot; '+esc(m.cat||"sin rubro")+
      (m.pago?' &middot; '+esc(m.pago):'')+'</div></div>'+
      '<div class="rb-m">'+fmt(m.monto)+'</div></div></div>'+
    '<div class="secc"><div class="barra-h" style="margin-bottom:6px">'+
      '<h4 style="margin:0">Permanentes de esta ventana sin cubrir ('+libres.length+')</h4>'+
      '<div class="sp"></div>'+
      (libres.length>6?'<input class="pill" id="permBuscar" data-t="permBuscar" placeholder="buscar…" style="width:180px">':'')+
      '</div>'+
      '<div data-t="permLista">'+
      (libres.length? libres.map(function(p){
        return ficha(p,'<button class="btn'+(p.id===sid?"":" gh")+' peq" data-acc="permmov-ligar" data-mid="'+
          esc(m.id)+'" data-pid="'+esc(p.id)+'">Ligar</button>',
          (p.id===sid && sug)? "coincide con este movimiento: "+sug.por : "");
      }).join("") : '<div class="vacio" style="padding:18px">No hay permanentes sin cubrir en esta ventana.</div>')+
      '</div>'+
      '<div class="vacio" data-t="permSinFiltro" style="padding:14px;display:none">Ninguno coincide con la búsqueda.</div>'+
    '</div>';
  if(ocupados.length){
    h+='<details class="secc"><summary class="sub" style="cursor:pointer;margin-bottom:6px">'+
      'Ya cubiertos en esta ventana ('+ocupados.length+') — no se pueden ligar</summary>'+
      ocupados.map(function(p){
        var mv=movDePerm(k,p.id);
        return ficha(p,'','ya tiene su movimiento: «'+esc(String(mv.desc||"").slice(0,40))+'» '+fmt(mv.monto)+
          ' del '+esc(fmtF(mv.fecha))+'. Ligarle otro contaría el mismo compromiso dos veces.');
      }).join("")+'</details>';
  }
  h+='<div class="secc"><h4>Ninguno de esos</h4><div class="rb-it"><div class="rb-d">'+
    'Dar de alta un permanente nuevo con los datos de este movimiento.'+
    '<div class="sub">'+esc(m.desc||"(sin descripción)")+' &middot; '+fmt(m.monto)+
    (m.cat?' &middot; '+esc(m.cat):'')+(m.pago?' &middot; '+esc(m.pago):'')+'</div></div>'+
    '<button class="btn gh peq" data-acc="permmov-alta" data-mid="'+esc(m.id)+'">Dar de alta</button></div></div>'+
    '</div><div class="mf"><button class="btn gh" data-acc="cerrar">Cerrar</button></div>';
  abreModal(h);
}
function permMovLigar(mid,pid){
  var m=S.movimientos.filter(function(x){return x.id===mid;})[0]; if(!m||m.permId) return;
  var p=permsK(m.k).filter(function(x){return x.id===pid;})[0]; if(!p) return;
  if(movDePerm(m.k,p.id)){ toast("Ese permanente ya tiene su movimiento en esta ventana."); return; }
  m.permId=p.id;
  if(!m.motivo && p.motivo) m.motivo=p.motivo;
  aprendeDePago(p,m);
  guardar(); cierraModal(); render();
  toast("Ligado a «"+(p.desc||p.cat)+"» &middot; cuenta como pagado en esta ventana",5000);
  pideCuotas(p.id, String(m.fecha||"").slice(0,7));
}
function nuevoPermanente(tipo){
  var nid="p"+id();
  permsK(kAct()).push({id:nid, tipo:(tipo==="Ingreso"?"Ingreso":"Egreso"),
    desc:"", motivo:"", monto:0, cat:"", pago:"", activo:true, ultimaCuota:""});
  guardar(); render();
  /* Buscar por id, NUNCA por posición: la tabla va ordenada y el nuevo no
     queda al final — enfocar la última fila escribía sobre otro permanente. */

  if(fila){ fila.scrollIntoView({block:"center"}); var i=fila.querySelector('[data-c="desc"]'); if(i) i.focus(); }

function borrarPermanente(pid){
  var k=kAct(), f=permsK(k).filter(function(x){return x.id===pid;})[0]; if(!f) return;
  var mv=movDePerm(k,pid);
  if(!confirm("¿Quitar «"+(f.desc||f.cat)+"» de los permanentes de "+S.ui.per+" "+S.ui.anio+"?"+
      "\n\nSolo lo quita de esta ventana; las anteriores no se modifican."+
      (mv?"\nEl movimiento ya registrado NO se elimina: permanece en la ventana.":""))) return;
  if(mv) mv.permId=null;
  S.perms[k]=permsK(k).filter(function(x){return x.id!==pid;});
  guardar(); render();
}
/* Sembrar el presupuesto de una ventana con el piso de sus permanentes: lo que
   ya se sabe que hay que pagar queda presupuestado desde el arranque, en vez de
   empezar de cero cada período. No pisa nada: solo escribe donde no había
   presupuesto. Y no es dinero — el saldo real sigue saliendo solo de
   totales(); esto es la previsión, que es otra cosa. */
function sembrarPresupuesto(k){
  var p=presuDe(k), n=0, tot=0;
  rubrosDe(k).forEach(function(r){
    var v=costoRubro(r);                    /* al crearla no hay gasto: piso = permanentes */
    if(!(v>0) || p[r.cat]!=null) return;
    p[r.cat]=v; n++; tot+=cts(v);
  });
  return {n:n, monto:red(tot/100)};
}
function nuevaVentana(){
  /* Si el formulario de Ajustes está abierto, manda lo que él eligió ahí. Sin
     formulario —o con basura escrita— se cae en la siguiente a la última, que
     es como funcionaba antes. */
  var n=siguienteVentana();
  var elPer=document.querySelector('[data-t="nvPer"]'), elAnio=document.querySelector('[data-t="nvAnio"]');
  var enAjustes=!!(elPer && elAnio);
  if(enAjustes){
    var per=elPer.value, anio=parseInt(String(elAnio.value).replace(/[^0-9]/g,""),10);
    if(PERIODOS.indexOf(per)<0){ toast("Elegí un corte de la lista."); return; }
    if(!(anio>=2000 && anio<=2100)){ toast("El año tiene que estar entre 2000 y 2100."); return; }
    n={anio:anio, per:per};
  }
  if(S.ventanas.some(function(v){ return v.anio===n.anio && v.per===n.per; })){
    toast("La ventana "+n.per+" "+n.anio+" ya existe.",4000); return;
  }
  S.ventanas.push(n); ordenaVentanas();
  var kN=K(n.anio,n.per);
  var r=heredarPermanentes(kN);          /* la lista de permanentes se hereda; el dinero NO */
  var sp=sembrarPresupuesto(kN);         /* y el presupuesto arranca en lo que suman esos permanentes */
  S.ui.anio=n.anio; S.ui.per=n.per; S.ui.tab="hoy";
  guardar(); render();
  /* render() repinta la app, no el modal que está encima: sin esto la ventana
     recién creada no aparecía en la lista y parecía que el botón no hacía nada. */
  if(enAjustes) abreAjustes("ventanas");
  var m=n.per+" "+n.anio+" &middot; sin movimientos";
  if(r.n) m+=" &middot; heredados "+r.nI+" ingreso"+(r.nI===1?"":"s")+" y "+
             r.nE+" egreso"+(r.nE===1?"":"s")+" permanentes, ninguno marcado";
  if(sp.n) m+=" &middot; presupuesto sembrado en "+sp.n+" rubro"+(sp.n===1?"":"s")+
              " por "+fmt(sp.monto)+" (lo que suman sus permanentes)";
  if(r.vencidos.length) m+=" &middot; "+r.vencidos.length+" con última cuota vencida";
  toast(m, 9000);
}
function heredarAhora(tipo){
  var k=kAct(), r=heredarPermanentes(k,tipo);
  var q=tipo==="Ingreso"?"ingresos permanentes":(tipo?"egresos permanentes":"permanentes");
  if(!r.origen){ toast("No hay una ventana anterior de la cual heredar."); return; }
  if(!r.n){ toast("Nada nuevo que heredar en "+q+": ya están todos."); return; }
  guardar(); render();
  var m=r.n+" "+q+" heredados de "+r.origen.split("|")[1]+" "+r.origen.split("|")[0]+" &middot; ninguno marcado";
  if(r.vencidos.length) m+=" &middot; "+r.vencidos.length+" con última cuota vencida";
  toast(m, r.vencidos.length?8000:5000);
}

============================================================================= */
document.addEventListener("click", function(ev){
  var t=ev.target, b=t.closest?t.closest("[data-acc],[data-desg],[data-mos],[data-ord],[data-ordr],[data-ordp],[data-ordpi],[data-ordh],[data-tab],[data-ajt],[data-ftipo],[data-reg],[data-regcol],[data-fperm]"):null;

    guardar(); render();
    var sc=document.getElementById("sec-"+rs);
    if(sc) sc.scrollIntoView({block:"start"});
    return;
  }
  var rc=b.getAttribute("data-regcol");
  if(rc){                                  /* la flecha de la cabecera: plegar */
    if(!S.ui.regCol) S.ui.regCol={};
    S.ui.regCol[rc]=!S.ui.regCol[rc];
    guardar(); render(); return;
  }
  var fp=b.getAttribute("data-fperm");
  if(fp){ S.ui.fPerm=fp; guardar(); render(); return; }
  var oh=b.getAttribute("data-ordh");
  if(oh){ if(S.ui.ordHoy.k===oh) S.ui.ordHoy.dir*=-1; else S.ui.ordHoy={k:oh,dir:oh==="cat"?1:-1};

  var opi=b.getAttribute("data-ordpi");

    guardar(); render(); return; }
  var op=b.getAttribute("data-ordp");
  if(op){ if(S.ui.ordPerm.k===op) S.ui.ordPerm.dir*=-1; else S.ui.ordPerm={k:op,dir:op==="monto"?-1:1};
          guardar(); render(); return; }
  var or=b.getAttribute("data-ordr");
  if(or){ if(S.ui.ordRub.k===or) S.ui.ordRub.dir*=-1; else S.ui.ordRub={k:or,dir:or==="cat"?1:-1};
          guardar(); render(); return; }

  /* desglose */
  var dg=b.getAttribute("data-desg");
  if(dg){ var fila=b.closest("tr");
          desglose(dg, fila?fila.getAttribute("data-cat"):null); return; }

    /* Solo lo que NO es crédito: los créditos tienen su propio panel y traerlos
       acá los convertiría en gastos positivos. Y se conserva la moneda, que si
       no un crédito en dólares volvía como lempiras. */
    var quedan=B.fuera.filter(function(x){ return x.esCred; });
    var traer=B.fuera.filter(function(x){ return !x.esCred; }).map(function(x){
      var f=filaB(); f.fecha=x.fecha||""; f.desc=x.desc||"";
      f.monto=String(Math.abs(+x.monto||0)); f.moneda=x.moneda||"Lps";

    });

    B.fuera=quedan;
    B.filas=B.filas.filter(function(f){ return !bVacia(f); }).concat(traer);
    bRecalculaTodo(); pintaPegado();
    toast(traer.length+" línea(s) traídas &middot; revisar: se habían dejado fuera por no ser gasto",5500);

  }
  if(acc==="b-nodup" || acc==="b-sidup"){

    var todos=cs.every(function(x){ return x.tomar; });
    cs.forEach(function(x){ x.tomar=!todos; });
    bResumen(); return;
  }
  if(acc==="cred-guardar"){ credGuardar(); return; }
  if(acc==="cred-nodup" || acc==="cred-sidup"){
    if(!B) return;
    var trC=b.closest("tr[data-cr]"); if(!trC) return;
    var csN=B.fuera.filter(function(x){ return x.esCred; });
    var xN=csN[+trC.getAttribute("data-cr")]; if(!xN) return;
    if(acc==="cred-nodup"){ xN.noRepe=true; xN.repe=null; xN.repeCred=null; }
    else delete xN.noRepe;
    bResumen(); return;
  }
  if(acc==="b-perm-monto" || acc==="b-perm-pago"){
    var trp2=b.closest("tr[data-b]"); if(!trp2||!B) return;
    var iF=+trp2.getAttribute("data-b"), fF=B.filas[iF]; if(!fF) return;
    var pF=permsK(kAct()).filter(function(x){ return x.id===fF.permSel; })[0]; if(!pF) return;
    if(acc==="b-perm-monto"){
      var nm=Math.abs(parseMonto(fF.monto));
      if(!(nm>0)) return;
      var vm=pF.monto; pF.monto=red(nm);
      toast("«"+(pF.desc||pF.cat)+"»: "+fmt(vm)+" → "+fmt(pF.monto)+" &middot; solo en "+S.ui.per+" "+S.ui.anio+" y las que hereden de ella",6000);
    } else {
      if(!fF.pago) return;
      var vp=pF.pago||"(sin forma de pago)"; pF.pago=fF.pago;
      toast("«"+(pF.desc||pF.cat)+"»: "+vp+" → "+pF.pago+" &middot; solo en "+S.ui.per+" "+S.ui.anio+" y las que hereden de ella",6000);
    }
    guardar(); bRecalculaTodo(); pintaPegado();
    return;
  }
  if(acc==="b-quitar-repes"){
    var quitadas=0;
    B.filas=B.filas.filter(function(f){
      if(bVacia(f)) return true;
      var e=bEstado(f);
      if(e.repe){ quitadas++; return false; }
      return true;
    });
    if(!B.filas.length) B.filas=[filaB()];
    bRecalculaTodo(); pintaPegado();
    toast(quitadas+" fila"+(quitadas===1?"":"s")+" quitada"+(quitadas===1?"":"s")+" de la grilla &middot; nada de lo ya registrado se tocó",5000);
    return;
  }
  if(acc==="b-aplicar-pago"){
    B.filas.forEach(function(f){ if(!bVacia(f)) f.pago=B.pago; });
    bRecalculaTodo(); pintaPegado();
    toast(B.pago? ("Aplicado a todas: "+B.pago) : "Forma de pago vaciada");
    return;
  }
});

  if(t.id==="avN"){ avDesdeCobros(); return; }

  /* el simulador de préstamos también responde mientras se escribe */

    prSimDe(sp)[sm]=t.value; guardar(); repintaPrestamo(sp); return; }

  /* libreta de tarjetas: se guarda al escribir, sin redibujar (no hay número que
     dependa de esto, así que no hace falta re-render y no se pierde el foco) */
  var tc=t.getAttribute&&t.getAttribute("data-tc");

    if(tc==="nombre"){
      var antTj=tjx.nombre;
      tjx.nombre=t.value;

      if(antTj && antTj!==t.value){
        for(var kp in S.tjPago) if(S.tjPago[kp][antTj]){ S.tjPago[kp][t.value]=true; delete S.tjPago[kp][antTj]; }
        var P2=tjPref(); for(var rp in P2) if(P2[rp]===antTj) P2[rp]=t.value;
        var C2=tjColor(); if(C2[antTj]){ C2[t.value]=C2[antTj]; delete C2[antTj]; }
      }
    }
    else if(tc==="limite") tjx.limite=red(+String(t.value||"").replace(/[^\d.]/g,"")||0);
    else if(tc==="limMon") tjx.limMon=(FX_MONEDAS.indexOf(t.value)>=0)?t.value:"Lps";
    else if(tc==="tope") tjx.tope=red(+String(t.value||"").replace(/[^\d.]/g,"")||0);
    else if(tc!=="corte" && tc!=="pago") return;   /* los desplegables se guardan en "change" */
    else{
      var vtj=String(t.value||"").replace(/[^\d]/g,"");
      if(vtj===""){ tjx[tc]=null; if(t.value!=="") t.value=""; }
      else{ var ntj=Math.max(1,Math.min(31,parseInt(vtj,10)||1)); tjx[tc]=ntj;
            if(String(ntj)!==t.value) t.value=String(ntj); }

    var be=tjy.benes[+bd2.getAttribute("data-bj")]; if(!be) return;

    guardar(); return;
  }

  var bc=t.getAttribute&&t.getAttribute("data-bc");
  if(bc && B){                                  /* grilla de pegado: no se guarda nada todavía */
    var trb=t.closest("tr[data-b]"); if(!trb) return;

    if(bc==="cat"){ fb.cat=t.value; fb.catManual=true; fb.catAuto=null;
      t.classList.remove("auto"); t.title=""; }
    else fb[bc]=t.value;
    if(bc==="fecha"){ bRecalcula(fb); bRepeEnBloque(); }  /* la fecha decide si ya está registrada */
    bResumen();
    if(bc==="fecha"||bc==="pago"){ bRepintaFila(+trb.getAttribute("data-b")); bRepintaEstados(); }
    return;
  }

  var c=t.getAttribute&&t.getAttribute("data-c"); if(!c) return;

  if(c==="monEnt"){                           /* selector de moneda de captura */
    var mon=t.value, cel=t.closest(".mon-cel");
    var inp=cel&&(cel.querySelector('[data-c="monto"]')||cel.querySelector('[data-bc="monto"]'));
    t.value="Lps";                            /* lo guardado es lempiras; el selector vuelve solo */
    if(!inp||mon==="Lps") return;
    var conv=convierteCelda(inp.value,mon);
    if(!conv) return;
    var trm=t.closest("tr[data-id]"), prm=t.closest(".perm-fila"), trb=t.closest("tr[data-b]");
    if(trm){
      var mm2=S.movimientos.filter(function(x){return x.id===trm.getAttribute("data-id");})[0];
      if(!mm2) return;
      mm2.monto=conv.lps; mm2.fx=notaFX(conv);
      if(mm2.origen==="perm") mm2.editado=true;
    } else if(prm){
      var pf3=permsK(kAct()).filter(function(x){return x.id===prm.getAttribute("data-pid");})[0];
      if(!pf3) return;
      pf3.monto=conv.lps; pf3.moneda=conv.mon; pf3.montoOrig=conv.orig; pf3.fx=notaFX(conv);
    } else if(trb && B){
      var fb2=B.filas[+trb.getAttribute("data-b")];
      if(!fb2) return;
      fb2.monto=String(conv.lps); fb2.moneda="Lps";
      fb2.origMon=conv.mon; fb2.origVal=conv.orig; fb2.tasa=conv.tasa;
      guardar(); bRecalculaTodo(); pintaPegado();
      toast(conv.mon+" "+Math.abs(conv.orig).toFixed(2)+" × "+fmtTasa(conv.tasa)+" = "+fmt(conv.lps),5000);
      return;
    } else return;
    guardar(); render();
    toast(conv.mon+" "+Math.abs(conv.orig).toFixed(2)+" × "+fmtTasa(conv.tasa)+" = "+fmt(conv.lps),5000);
    return;
  }

  var tr=t.closest("tr[data-id]");
  if(tr){                                     /* movimientos */
    var m=S.movimientos.filter(function(x){return x.id===tr.getAttribute("data-id");})[0];
    if(!m) return;
    if(c==="monto"){ m.monto=parseMonto(t.value); t.classList.toggle("neg",cts(m.monto)<0); }
    else m[c]=t.value;
    if(m.origen==="perm") m.editado=true;   /* ya no es la plantilla tal cual: no se borra sin preguntar */
    guardar(); return;
  }
  var pf=t.closest(".perm-fila");
  if(pf){                                     /* permanentes: solo la plantilla, no toca plata */
    var f=permsK(kAct()).filter(function(x){return x.id===pf.getAttribute("data-pid");})[0];
    if(!f||c==="marca"||c==="activo") return;
    f[c]= c==="monto" ? parseMonto(t.value) : t.value;
    guardar();
    if(c==="cat" && esFinanciamiento(f) && movDePerm(kAct(),f.id) && faltaCuotas(f)){
      render(); pideCuotas(f.id); return;
    }
    /* el total activo de la tabla y la proyección dependen de esto */
    if(c==="monto"||c==="cat") repintaTotalPerm(f.tipo||"Egreso");
    return;
  }
  var rr=t.closest("tr[data-cat]");
  if(rr && c==="pres"){                       /* presupuesto por rubro */
    var p=presuDe(kAct()), cat=rr.getAttribute("data-cat");
    if(String(t.value).trim()==="") delete p[cat]; else p[cat]=parseMonto(t.value);
    guardar(); repintaRubro(rr); return;
  }
  if(c==="fxTasa"){                           /* tasa escrita a mano */
    var trf=t.closest("tr[data-fxm]"); if(!trf) return;
    var mm=trf.getAttribute("data-fxm"), v=parseTasa(t.value);
    if(v>0){ S.fx[mm]=v; S.fx.src="manual"; S.fx.fecha=hoyISO(); S.fx.ts=new Date().toISOString();
      guardar(); pintaFX();
      var eq=trf.children[2]; if(eq) eq.textContent="1 "+mm+" = "+fmt(v); }
    return;
  }
  if(c==="lista"){                            /* listas en ajustes: categorías y formas de pago */
    var li=t.closest(".it"), cont=t.closest("[data-lista]");
    if(!li||!cont) return;
    S[cont.getAttribute("data-lista")][+li.getAttribute("data-i")]=t.value;
    guardar(); return;
  }
  /* El año y el período NO se tocan en cada tecla: se aplican al salir de la celda
     (ver el handler de "change"). Si no, "2027" pasaría por 2, 20 y 202 remapeando
     los movimientos tres veces y dejando basura grabada en disco. */
});
document.addEventListener("change", function(ev){
  var t=ev.target, c=t.getAttribute&&t.getAttribute("data-c");

  /* fila de nota por cubrir: solo marcar y desmarcar */
  var cbc=t.getAttribute&&t.getAttribute("data-cubc");
  if(cbc==="tomar" && CUB){
    var trb=t.closest("tr[data-cub]"); if(!trb) return;
    var xb=CUB.filas[+trb.getAttribute("data-cub")]; if(!xb) return;
    xb.tomar=t.checked;
    /* Se repinta solo el botón: repintar la tabla entera perdería el foco y
       haría saltar la lista mientras se destildan varias seguidas. */
    var bt=document.querySelector('[data-t="btnCubrir"]');
    if(bt){
      var nn=CUB.filas.filter(function(x){ return x.tomar; }).length;
      bt.textContent="Dar por cubierta"+(nn===1?"":"s")+(nn?" ("+nn+")":"");
      bt.disabled=!nn; bt.style.opacity=nn?"":".5";
    }
    return;
  }

  /* fila de crédito del pegado: marcar, elegir rubro y forma de pago */
  /* una celda del panel de notas: se escribe al soltar, no en cada tecla */
  var nc=t.getAttribute&&t.getAttribute("data-nc");
  if(nc){
    var trNC=t.closest("tr[data-nid]"); if(!trNC) return;
    var nN=notaDe(trNC.getAttribute("data-nid")); if(!nN) return;
    if(nc==="cubierta"){
      nN.cubierta=!!t.checked; nN.cubiertaTs=nN.cubierta? Date.now() : 0;
    } else if(nc==="monto"){
      var vM=parseMonto(t.value);
      if(!(vM>0)){ toast("El monto de una nota tiene que ser mayor que cero."); t.value=nN.monto||""; return; }
      nN.monto=red(vM); t.value=nN.monto;
    } else if(nc==="fecha"){
      nN.fecha=String(t.value||"");
    } else nN[nc]=String(t.value||"");
    nN.ts=Date.now();
    notaEscribir(nN);
    render();                                   /* los rubros se recalculan */
    /* Solo se redibuja la tabla cuando el cambio puede sacar la fila de la
       lista —marcarla como cubierta o cambiarle el rubro con un filtro puesto—.
       Si no, se actualiza el resumen y se deja el foco donde está. */
    if(nc==="cubierta" || (nc==="cat" && NOT_F.cat)) pintaNotas();
    else notasResumen();
    return;
  }
  var crc=t.getAttribute&&t.getAttribute("data-crc");
  if(crc && B){

    xc[crc]=t.value; bResumen(); return;

  /* el color de fila de una tarjeta */
  if(t.getAttribute && t.getAttribute("data-tc")==="color"){
    var trk=t.closest("tr[data-tj]"); if(!trk) return;
    var tjk=tarjetaDe(trk.getAttribute("data-tj")); if(!tjk) return;
    if(t.value) tjColor()[tjk.nombre]=t.value; else delete tjColor()[tjk.nombre];
    guardar(); reTarjetas(); return;
  }
  /* la moneda del límite de una tarjeta (los <select> no emiten "input") */
  if(t.getAttribute && t.getAttribute("data-tc")==="limMon"){
    var trm=t.closest("tr[data-tj]"); if(!trm) return;
    var tjm=tarjetaDe(trm.getAttribute("data-tj")); if(!tjm) return;
    tjm.limMon=(FX_MONEDAS.indexOf(t.value)>=0)?t.value:"Lps";

    var trg=t.closest("tr[data-tj]"); if(!trg) return;
    var tjg=tarjetaDe(trg.getAttribute("data-tj")); if(!tjg) return;
    tjMarcaPago(kAct(), tjg.nombre, t.checked);
    reTarjetas(); return;

    var trc=t.closest("tr[data-tj]"), bdc=t.closest(".tj-b");
    if(!trc||!bdc) return;
    var tjc=tarjetaDe(trc.getAttribute("data-tj")); if(!tjc) return;
    var bec=tjc.benes[+bdc.getAttribute("data-bj")]; if(!bec) return;

    if(!t.checked) B.filas.forEach(function(f){ if(f.autoMarcada){ f.permSel=""; f.marcar=false; f.autoMarcada=false; } });
    bRecalculaTodo(); pintaPegado(); return;
  }
  if(B && t.id==="bTipo"){ B.tipo=t.value; bRecalculaTodo(); pintaPegado(); return; }
  if(B && t.id==="bPago"){ B.pago=t.value; return; }
  var bc=t.getAttribute&&t.getAttribute("data-bc");
  if(bc && B){
    var trb=t.closest("tr[data-b]"); if(!trb) return;

    if(bc==="permSel"){                         /* REGLA 2: esto lo elige él */

      fb.nuevoPerm=(fb.permSel==="__nuevo");
      fb.duplaPerm=false;
      if(fb.marcar && !fb.catManual){            /* el rubro del permanente elegido manda */
        var pe=permsK(kAct()).filter(function(x){ return x.id===fb.permSel; })[0];
        if(pe && pe.cat) { fb.cat=pe.cat; fb.catAuto={cat:pe.cat, de:"el permanente elegido"}; }

      bRepintaFila(i); bResumen(); return;

    if(bc==="desc"||bc==="monto"||bc==="fecha"||bc==="pago"){ bRecalcula(fb); bRepeEnBloque(); bRepintaFila(i); bRepintaEstados(); }

});

/* Detecta la moneda escrita junto al importe: "20 USD", "$20", "€15", "20 CAD".
   Sin marca explícita se asume lempiras. */
function detectaMoneda(txt){
  var t=String(txt||"").toUpperCase();
  if(/\bCAD\b|\bCDN\b|C\$/.test(t)) return "CAD";
  if(/\bEUR\b|€/.test(t)) return "EUR";
  if(/\bUSD\b|US\$|D[ÓO]LAR/.test(t)) return "USD";
  if(/\$/.test(t) && !/\bL\s*\$/.test(t)) return "USD";
  return "Lps";
}
/* Devuelve el importe en lempiras y, si hubo conversión, con qué tasa. */
function montoLps(txt){
  var mon=detectaMoneda(txt), val=parseMonto(txt);
  if(mon==="Lps") return {lps:val, mon:"Lps", orig:val, tasa:1};
  var tasa=fxTasa(mon);
  if(!tasa) return {lps:val, mon:mon, orig:val, tasa:null};   /* sin tasa: no se inventa */
  return {lps:red(val*tasa), mon:mon, orig:val, tasa:tasa};
}
/* SELECTOR DE MONEDA DE CAPTURA.
   Lo que se guarda SIEMPRE es lempiras: la conversión se hace al capturar y
   queda sellada con la tasa del día (ver REGLA del tipo de cambio). Este
   selector solo dice EN QUÉ MONEDA está el número que se acaba de escribir.
   Al elegir una moneda, la app convierte el importe de esa celda, lo sella y
   el selector vuelve a Lps — porque a partir de ahí el dato ya es en lempiras. */
function selMoneda(attr,tit){
  return '<select class="mon-sel" '+attr+' title="'+esc(tit||
    "Moneda del número escrito al lado. Al elegirla, el importe se convierte a lempiras con la tasa del día y queda sellado con el original. Lo guardado siempre es lempiras.")+'">'+
    ['Lps'].concat(FX_MONEDAS).map(function(x){ return '<option'+(x==="Lps"?" selected":"")+'>'+x+'</option>'; }).join("")+
    '</select>';
}
/* Convierte el texto de una celda usando la moneda elegida. Devuelve null si no
   hay tasa: nunca se inventa un número. */
function convierteCelda(txt,mon){
  if(!mon||mon==="Lps") return null;
  var c=montoLps(String(txt)+" "+mon);
  if(!c.tasa){ toast("Sin tasa para "+mon+" &middot; cargarla en el tipo de cambio",5000); return null; }
  return c;
}
function notaFX(c){
  if(c.mon==="Lps"||!c.tasa) return "";
  return c.mon+" "+Math.abs(c.orig).toFixed(2)+" @ "+fmtTasa(c.tasa);
}
function parseMonto(s){
  if(s==null) return 0;
  var c=String(s).trim(), neg=false;
  if(/^\(.*\)$/.test(c)){ neg=true; c=c.slice(1,-1); }
  c=c.replace(/[Ll]ps?\s*/gi,"").replace(/[^0-9.,\-−]/g,"").replace(/−/g,"-");
  if(/^-/.test(c)){ neg=!neg; c=c.replace(/^-+/,""); }
  if(/-$/.test(c)){ neg=!neg; c=c.replace(/-+$/,""); }
  /* Separadores. Acá la coma es de miles y el punto es decimal, pero un
     estado de cuenta puede venir al revés:
       · con los dos signos, manda el ÚLTIMO: "1.234,56" son mil doscientos.
       · solo comas → miles, como siempre: "1,000" son mil, no uno.
       · varios puntos → miles, salvo que el último grupo tenga 1 o 2 dígitos,
         que entonces es el decimal: "1.234.56".
     Sin esto "1.234,56" se leía 1.23 y el importe se perdía casi entero. */
  var uc=c.lastIndexOf(","), up=c.lastIndexOf(".");
  if(uc>=0 && up>=0){
    if(uc>up) c=c.replace(/\./g,"").replace(/,/g,".");   /* europeo */
    else c=c.replace(/,/g,"");                            /* de acá */
  } else if(uc>=0){ c=c.replace(/,/g,""); }               /* solo comas: miles */
  else if(up>=0 && c.indexOf(".")!==up){                  /* varios puntos */
    var cola=c.slice(up+1);
    c=(cola.length>0&&cola.length<3)? c.slice(0,up).replace(/\./g,"")+"."+cola
                                    : c.replace(/\./g,"");
  }
  var n=parseFloat(c);
  if(isNaN(n)) return 0;
  return red(neg?-n:n);
}

/* Repinta UNA fila mientras él escribe el presupuesto, sin reconstruir la tabla
   (si se reconstruyera, perdería el foco a media cifra).
   Ojo con los índices: la columna «Con notas» solo existe cuando hay notas, así
   que la barra de avance está en 5 o en 6 según el caso. Escribir siempre en 5
   era lo que le metía la barra dentro de la columna de notas. */
function repintaRubro(tr){
  var cat=tr.getAttribute("data-cat"), k=kAct();
  var r=rubroDe(k,cat); if(!r) return;
  var pres=r.pres, pasado=(r.quedaN!=null&&r.quedaN<0);
  var tbl=tr.closest? tr.closest("table") : null;
  var conNotas=!!(tbl && tbl.getAttribute("data-notas"));
  var tds=tr.children;
  /* 0 rubro · 1 permanentes · 2 presupuesto · 3 real · 4 disponible ·
     [5 con notas] · avance · acciones */
  /* el aviso de la columna de permanentes depende del presupuesto que acaba de
     escribir: si ya no alcanza para lo que el rubro va a costar, se marca */
  var costo=costoRubro(r), corto=(pres!=null && cts(costo)>cts(pres));
  if(corto){
    tds[1].style.color="var(--avi-tx)";
    tds[1].title="El presupuesto de este rubro está por debajo de lo que va a costar ("+fmt(costo)+
      " = "+fmt(r.gastado)+" real"+(r.permPend?" + "+fmt(r.permPend)+" por pagar":"")+
      (r.notas?" + "+fmt(r.notas)+" en notas":"")+
      "). Cuando se registre lo que falta, el rubro queda excedido.";
  } else { tds[1].style.color=""; tds[1].removeAttribute("title"); }
  tds[4].style.color = pasado?"var(--mal-tx)":(r.quedaN!=null?"var(--ok-tx)":"");
  tds[4].style.fontWeight = pasado?"640":"";
  tds[4].innerHTML = r.quedaN==null?'<span class="sub">—</span>':fmt(r.quedaN,r.quedaN>0);
  if(r.notas && r.quedaN!=null)
    tds[4].title=fmt(r.queda)+" de presupuesto sin gastar, menos "+fmt(r.notas)+" en "+r.nNotas+
      " nota"+(r.nNotas===1?"":"s")+" que todavía no se copió de la banca.";
  else tds[4].removeAttribute("title");
  /* La celda de notas NO se toca: es una cifra externa y no depende de lo que
     él acaba de escribir. Solo hay que saltearla para no pisarla con la barra,
     que era justo el error. */
  var iBarra=conNotas? 6 : 5;
  var pctR=(pres!=null&&pres>0)?Math.max(0,(r.gastado+r.notas)/pres*100):0;
  var pct=Math.min(100,pctR);
  tds[iBarra].innerHTML=(pres!=null&&pres>0)
    ? '<div class="barra'+(pasado?" x":"")+'" title="'+esc(pctR.toFixed(0)+"% del presupuesto ejecutado"+
        (r.notas?" (real + notas)":""))+'"><i style="width:'+pct.toFixed(1)+'%"></i></div>'
    : '<span class="sub">sin presupuesto</span>';
  tr.style.opacity=(pres==null && r.n===0 && !r.perm && !r.notas)? ".5" : "";
  repintaPieRubros();
}

/* =============================================================================
   INGRESO EN BLOQUE
   Parseo adaptado de ingreso_en_bloque_REFERENCIA.js (BAC, Promerica, FICOHSA).
   Lo que cambió respecto de la app vieja: la detección de permanentes ya NO
   decide nada. Sugiere, pinta el renglón y espera a que Victor marque.
============================================================================= */
var SIN_CAT="Sin categoría";
var MOV_DUP={};

/* ---------- números, fechas y descartes ---------- */
function qParseNum(s){
  if(s==null) return null;
  var c=String(s).trim(), neg=false;
  if(/^\(.+\)$/.test(c)){ neg=true; c=c.slice(1,-1).trim(); }
  if(/^[-−]/.test(c)){ neg=!neg; c=c.replace(/^[-−]\s*/,""); }
  c=c.replace(/^(LPS|HNL|USD|US\$|CAD|CDN|EUR|Lps|L|\$|€|₡)\s*/i,"");
  c=c.replace(/\s*(LPS|HNL|USD|US\$|CAD|CDN|EUR|Lps|L|\$|€|₡)$/i,"");
  c=c.replace(/,/g,"").trim();
  if(/[-−]$/.test(c)){ neg=!neg; c=c.replace(/\s*[-−]$/,"").trim(); }   /* 1,234.56− */
  if(c.charAt(0)==="+") c=c.slice(1).trim();
  if(c.charAt(0)==="-"||c.charAt(0)==="−"){ neg=!neg; c=c.slice(1).trim(); }
  if(/^\d+(\.\d+)?$/.test(c)) return neg?-(+c):+c;
  return null;
}
function qTieneDecimales(s){ return /\.\d{1,2}\s*$/.test(String(s||"").replace(/[A-Za-z$€₡\s]+$/,"")); }
/* Una referencia es un entero largo sin centavos. Nunca es un monto. */
function qEsRef(s){ return /^\d{5,}$/.test(String(s||"").replace(/[,\s]/g,"")); }
function qMoneda(s){ s=String(s||"").toUpperCase();
  if(/US\$|USD|D[ÓO]LAR/.test(s)) return "USD";
  if(/\bCAD\b|CDN/.test(s)) return "CAD";
  if(/EUR|€/.test(s)) return "EUR";
  return "Lps"; }
function qPad(n){ return String(n).padStart(2,"0"); }
/* Una fecha imposible NO es una fecha. Sin este control, 08/13/2026 pasaba como
   «2026-13-08»: la celda de fecha se veía vacía, la fila decía «lista», se
   guardaba igual y ese movimiento quedaba fuera de toda comparación de
   duplicados para siempre, porque diasEntre no puede medirla. */
function qFechaOK(y,mo,d){
  y=+y; mo=+mo; d=+d;
  if(!(y>=1900&&y<=3000) || !(mo>=1&&mo<=12) || !(d>=1)) return false;
  var dias=[31,(y%4===0&&y%100!==0)||y%400===0?29:28,31,30,31,30,31,31,30,31,30,31];
  return d<=dias[mo-1];
}
function qParseDate(s){
  s=String(s||"").trim(); var m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))
    return qFechaOK(m[1],m[2],m[3])? m[1]+"-"+qPad(m[2])+"-"+qPad(m[3]) : "";

   desaparecen y TODOS los renglones quedan pegados en una sola línea:

     000545-XXXXX 3715 05/08/2026 DUNKIN DONUTS DD24 CAJ ... HNL 0.00 HNL 174.16

   tiene una forma inconfundible: seis dígitos, unas X y cuatro dígitos. Por ahí
   se parte.

   crédito. Como las vacías no se copian, quedan DOS importes: el original
   —casi siempre 0.00— y el de verdad. Se toma el último.

   Y acá hay un límite honesto: al desaparecer la columna vacía, un cargo y un
   crédito quedan escritos IGUAL. La única pista es el texto. Se reconocen los
   pagos y los abonos por su descripción; cualquier otro crédito con un texto
