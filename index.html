/* Enter y flechas dentro de las tablas editables */
document.addEventListener("keydown", function(ev){
  if(ev.key==="Escape" && $(".velo")){ if(puedeCerrar()) cierraModal(); return; }
  if(ev.key==="Enter" && ev.target.closest && ev.target.closest("#qadd")){ ev.preventDefault(); anotarRapido(); return; }
  if(ev.key!=="Enter"&&ev.key!=="ArrowDown"&&ev.key!=="ArrowUp") return;
  var t=ev.target;
  if(!t.classList||(!t.classList.contains("cel")&&!t.closest(".perm-fila"))) return;
  if(t.tagName==="SELECT"&&ev.key!=="Enter") return;
  var attr=t.getAttribute("data-c")?"data-c":"data-bc";
  var c=t.getAttribute(attr); if(!c) return;
  var fila=t.closest("tr[data-id]")||t.closest("tr[data-b]")||t.closest(".perm-fila")||t.closest("tr[data-cat]");
  if(!fila) return;
  var dir=(ev.key==="ArrowUp")?-1:1;
  var hermanos=Array.prototype.slice.call(fila.parentNode.children);
  var i=hermanos.indexOf(fila)+dir;
  if(i>=hermanos.length && B && fila.hasAttribute("data-b")){   /* la grilla crece al llegar al final */
    bCrece(); hermanos=Array.prototype.slice.call(fila.parentNode.children);
  }
  if(i<0||i>=hermanos.length) return;
  var dest=hermanos[i].querySelector('['+attr+'="'+c+'"]');
  if(dest){ ev.preventDefault(); dest.focus(); if(dest.select) try{dest.select();}catch(e){} }
});

/* Detecta la moneda escrita junto al importe: "20 USD", "$20", "€15", "20 CAD".
   Sin marca explícita se asume lempiras. */
function detectaMoneda(txt){
  var t=String(txt||"").toUpperCase();
  if(/\bCAD\b|\bCDN\b|C\$/.test(t)) return "CAD";
  if(/\bEUR\b|€/.test(t)) return "EUR";
  if(/\bUSD\b|US\$|D[ÓO]LAR/.test(t)) return "USD";
  if(/\$/.test(t) && !/\bL\s*\$/.test(t)) return "USD";
  return "Lps";
}
/* Devuelve el importe en lempiras y, si hubo conversión, con qué tasa. */
function montoLps(txt){
  var mon=detectaMoneda(txt), val=parseMonto(txt);
  if(mon==="Lps") return {lps:val, mon:"Lps", orig:val, tasa:1};
  var tasa=fxTasa(mon);
  if(!tasa) return {lps:val, mon:mon, orig:val, tasa:null};   /* sin tasa: no se inventa */
  return {lps:red(val*tasa), mon:mon, orig:val, tasa:tasa};
}
/* SELECTOR DE MONEDA DE CAPTURA.
   Lo que se guarda SIEMPRE es lempiras: la conversión se hace al capturar y
   queda sellada con la tasa del día (ver REGLA del tipo de cambio). Este
   selector solo dice EN QUÉ MONEDA está el número que se acaba de escribir.
   Al elegir una moneda, la app convierte el importe de esa celda, lo sella y
   el selector vuelve a Lps — porque a partir de ahí el dato ya es en lempiras. */
function selMoneda(attr,tit){
  return '<select class="mon-sel" '+attr+' title="'+esc(tit||
    "Moneda del número escrito al lado. Al elegirla, el importe se convierte a lempiras con la tasa del día y queda sellado con el original. Lo guardado siempre es lempiras.")+'">'+
    ['Lps'].concat(FX_MONEDAS).map(function(x){ return '<option'+(x==="Lps"?" selected":"")+'>'+x+'</option>'; }).join("")+
    '</select>';
}
/* Convierte el texto de una celda usando la moneda elegida. Devuelve null si no
   hay tasa: nunca se inventa un número. */
function convierteCelda(txt,mon){
  if(!mon||mon==="Lps") return null;
  var c=montoLps(String(txt)+" "+mon);
  if(!c.tasa){ toast("Sin tasa para "+mon+" &middot; cargarla en el tipo de cambio",5000); return null; }
  return c;
}
function notaFX(c){
  if(c.mon==="Lps"||!c.tasa) return "";
  return c.mon+" "+Math.abs(c.orig).toFixed(2)+" @ "+fmtTasa(c.tasa);
}
function parseMonto(s){
  if(s==null) return 0;
  var c=String(s).trim(), neg=false;
  if(/^\(.*\)$/.test(c)){ neg=true; c=c.slice(1,-1); }
  c=c.replace(/[Ll]ps?\s*/gi,"").replace(/[^0-9.,\-−]/g,"").replace(/−/g,"-");
  if(/^-/.test(c)){ neg=!neg; c=c.replace(/^-+/,""); }
  if(/-$/.test(c)){ neg=!neg; c=c.replace(/-+$/,""); }
  c=c.replace(/,/g,"");
  var n=parseFloat(c);
  if(isNaN(n)) return 0;
  return red(neg?-n:n);
}

function repintaRubro(tr){
  var cat=tr.getAttribute("data-cat"), k=kAct(), p=presuDe(k);
  var g=0; movsDe(k).forEach(function(m){ if(m.tipo!=="Ingreso"&&(m.cat||"Sin categoría")===cat) g+=cts(m.monto); });
  g/=100;
  var tiene=p[cat]!=null&&p[cat]!=="";
  var pres=tiene?red(+p[cat]||0):null, queda=pres==null?null:red(pres-g), pasado=(queda!=null&&queda<0);
  /* columnas: 0 rubro · 1 fijo · 2 planeado · 3 real · 4 disponible · 5 avance */
  var tds=tr.children;
  tds[4].style.color = pasado?"var(--mal-tx)":(queda!=null?"var(--ok-tx)":"");
  tds[4].style.fontWeight = pasado?"640":"";
  tds[4].innerHTML = queda==null?'<span class="sub">—</span>':fmt(queda,queda>0);
  var pct=(pres!=null&&pres>0)?Math.min(100,Math.max(0,g/pres*100)):0;
  tds[5].innerHTML=(pres!=null&&pres>0)
    ? '<div class="barra'+(pasado?" x":"")+'" title="'+pct.toFixed(0)+'% del presupuesto ejecutado"><i style="width:'+pct.toFixed(1)+'%"></i></div>'
    : '<span class="sub">sin presupuesto</span>';
  if(pres!=null) tr.style.opacity="";          /* ya no es una fila vacía */

/* =============================================================================
   INGRESO EN BLOQUE
   Parseo adaptado de ingreso_en_bloque_REFERENCIA.js (BAC, Promerica, FICOHSA).
   Lo que cambió respecto de la app vieja: la detección de permanentes ya NO
   decide nada. Sugiere, pinta el renglón y espera a que Victor marque.
============================================================================= */
var SIN_CAT="Sin categoría";
var MOV_DUP={};

/* ---------- números, fechas y descartes ---------- */
function qParseNum(s){
  if(s==null) return null;
  var c=String(s).trim(), neg=false;
  if(/^\(.+\)$/.test(c)){ neg=true; c=c.slice(1,-1).trim(); }
  if(/^[-−]/.test(c)){ neg=!neg; c=c.replace(/^[-−]\s*/,""); }
  c=c.replace(/^(LPS|HNL|USD|US\$|CAD|CDN|EUR|Lps|L|\$|€|₡)\s*/i,"");
  c=c.replace(/\s*(LPS|HNL|USD|US\$|CAD|CDN|EUR|Lps|L|\$|€|₡)$/i,"");
  c=c.replace(/,/g,"").trim();
  if(/[-−]$/.test(c)){ neg=!neg; c=c.replace(/\s*[-−]$/,"").trim(); }   /* 1,234.56− */
  if(c.charAt(0)==="+") c=c.slice(1).trim();
  if(c.charAt(0)==="-"||c.charAt(0)==="−"){ neg=!neg; c=c.slice(1).trim(); }
  if(/^\d+(\.\d+)?$/.test(c)) return neg?-(+c):+c;
  return null;
}
function qTieneDecimales(s){ return /\.\d{1,2}\s*$/.test(String(s||"").replace(/[A-Za-z$€₡\s]+$/,"")); }
/* Una referencia es un entero largo sin centavos. Nunca es un monto. */
function qEsRef(s){ return /^\d{5,}$/.test(String(s||"").replace(/[,\s]/g,"")); }
function qMoneda(s){ s=String(s||"").toUpperCase();
  if(/US\$|USD|D[ÓO]LAR/.test(s)) return "USD";
  if(/\bCAD\b|CDN/.test(s)) return "CAD";
  if(/EUR|€/.test(s)) return "EUR";
  return "Lps"; }
function qPad(n){ return String(n).padStart(2,"0"); }
function qParseDate(s){
  s=String(s||"").trim(); var m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)) return m[1]+"-"+qPad(m[2])+"-"+qPad(m[3]);
  if(m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/)){
    var d=m[1],mo=m[2],y=m[3]; if(y.length===2) y="20"+y;
    return y+"-"+qPad(mo)+"-"+qPad(d);
  }
  return "";
}
/* Un pago de tarjeta no es un gasto nuevo: ya lo registraste compra por compra. */
function qEsPagoTarjeta(d){ return /PAGO DE TARJETA|PAGO POR INTERNET|SU PAGO|PAGO RECIBIDO|ABONO A CAPITAL/i.test(String(d||"")); }
function qLimpiaDesc(t){ return String(t||"").replace(/^\d{5,}\s+/,"").replace(/\s*Nombre de cuenta\s*$/i,"").replace(/\s{2,}/g," ").trim(); }
function qBancoLinea(l){
  var m=String(l).match(/^(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4})\s+(.*?)\s+([+\-−]?[\d,]+\.\d{2})\s+([+\-−]?[\d,]+\.\d{2})(?:\s+([+\-−]?[\d,]+\.\d{2}))?\s*$/);
  if(!m||!m[2]||!/[A-Za-zÁÉÍÓÚÑáéíóúñ]/.test(m[2])) return null;
  return [m[1],m[2],m[3],m[4]].concat(m[5]?[m[5]]:[]);
}
/* Débitos · Créditos · Balance: el balance NO es el monto, y un crédito no es gasto. */
function qBancoNums(cands,total){
  if(cands.length<2) return null;
  var sigue=function(a,b){ return b.i===a.i+1; }, cero=function(c){ return Math.abs(c.v)<0.005; };
  var t3=cands.slice(-3);
  if(t3.length===3&&t3[2].i===total-1&&sigue(t3[0],t3[1])&&sigue(t3[1],t3[2])&&
     t3.every(function(c){return c.dec;})&&(cero(t3[0])||cero(t3[1])))
    return {deb:Math.abs(t3[0].v), cred:Math.abs(t3[1].v), usa:t3};
  var t2=cands.slice(-2);
  if(t2.length===2&&t2[1].i===total-1&&sigue(t2[0],t2[1])&&
     t2.every(function(c){return c.dec;})&&(cero(t2[0])!==cero(t2[1])))
    return {deb:Math.abs(t2[0].v), cred:Math.abs(t2[1].v), usa:t2};
  return null;
}
function qPasteTabular(lines){
  var skip={pago:0,cred:0}, fuera=[], out=[];
  lines.forEach(function(line){
    if(/^saldo\s+anterior/i.test(line)||/^fecha\b/i.test(line)) return;
    if(qMarcaTarjeta(line)) return;              /* separador de tarjeta, no es fila */
    var cells=line.split(/\t/);
    if(cells.length===1) cells=qBancoLinea(line)||line.split(/ {2,}/);
    cells=cells.map(function(c){return String(c).trim();}).filter(function(c){return c!=="";});
    var fecha="", monCel="", cands=[], rest=[];
    cells.forEach(function(c,i){
      var d=qParseDate(c); if(d&&!fecha){ fecha=d; return; }
      if(/^(LPS|HNL|USD|US\$|CAD|CDN|EUR|Lps|\$|€|₡)$/i.test(c)){ if(!monCel) monCel=qMoneda(c); return; }
      var n=qParseNum(c);
      if(n!=null){ cands.push({i:i,v:n,raw:c,dec:qTieneDecimales(c),mon:qMoneda(c)}); return; }
      rest.push({i:i,t:c});
    });
    var pick=null, banco=qBancoNums(cands,cells.length), desc0="";
    if(banco){
      /* La descripción es TODO el texto de la fila, no solo el primer pedazo: si el
         banco mete una columna corta (últimos 4 de la tarjeta, nº de documento) esa
         columna no debe pisar el nombre del comercio. */
      desc0=qLimpiaDesc(rest.map(function(r){return r.t;}).join(" "));
      if(qEsPagoTarjeta(desc0)){ skip.pago++; fuera.push({fecha:fecha,desc:desc0,monto:banco.deb,motivo:"pago de tarjeta o traslado"}); return; }
      if(banco.deb<=0.005){
        if(banco.cred>0.005){ skip.cred++; fuera.push({fecha:fecha,desc:desc0,monto:banco.cred,motivo:"crédito o abono recibido",esCred:true}); }
        return;
      }
      pick=banco.usa[0]; banco.usa.forEach(function(c){ c.usada=true; });
    } else {
      var conDec=cands.filter(function(c){return c.dec;});
      if(conDec.length) pick=conDec[conDec.length-1];
      else { var noRef=cands.filter(function(c){return !qEsRef(c.raw);}); pick=(noRef.length?noRef:cands)[0]||null; }
    }
    cands.forEach(function(c){ if(c!==pick&&!c.usada&&!qEsRef(c.raw)) rest.push({i:c.i,t:c.raw}); });
    rest.sort(function(x,y){return x.i-y.i;});
    var txt=rest.map(function(r){return r.t;});
    var conLetras=txt.filter(function(s){ return /[A-Za-zÁÉÍÓÚÑáéíóúñ]/.test(s); });
    var desc=banco? desc0 : qLimpiaDesc(conLetras[0]||txt[0]||"");
    if(!banco && qEsPagoTarjeta(desc)){
      skip.pago++; fuera.push({fecha:fecha,desc:desc,monto:pick?Math.abs(pick.v):0,motivo:"pago de tarjeta o traslado"}); return; }
    var mon=(pick&&pick.mon&&pick.mon!=="Lps")?pick.mon:(monCel||"Lps");
    var r={fecha:fecha, desc:desc, monto:pick?String(pick.v):"", moneda:mon,
           cat:banco?"":(conLetras[1]||""), pago:banco?"":(conLetras[2]||"")};
    if(r.desc||r.monto||r.fecha) out.push(r);
  });
  return {rows:out, skipped:skip, fuera:fuera};
}
/* El separador de tarjeta del estado de cuenta de Promerica: "XXXXXX4098", a
   veces con tabuladores de relleno. Marca dónde empieza otro plástico. */
var Q_TARJETA=/^X{3,}\s*(\d{0,6})\s*$/i;
function qMarcaTarjeta(l){
  var m=String(l||"").replace(/\t/g," ").trim().match(Q_TARJETA);
  return m? (m[1]||"—") : null;
}
function qPasteVertical(lines){
  var recs=[], skip={pago:0,cred:0}, fuera=[], cur=null, tarjetas=[], tAct="";
  var dateRe=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/;
  var isRef=function(s){ return /^\d{7,}$/.test(s.replace(/[,\s]/g,"")); };
  var numOf=function(s){ var n=qParseNum(s); return n==null?null:Math.abs(n); };
  var add=function(d,v){ recs.push({fecha:cur.fecha, desc:d, monto:String(v), moneda:cur.moneda,
                                    cat:"", pago:"", tarjeta:cur.tarjeta||""}); };
  var fin=function(){
    if(cur&&cur.fecha){
      /* Promerica a veces manda la fila sin comercio y solo con la referencia.
         Antes esa fila se perdía en silencio; ahora entra con la referencia por
         nombre, para que él la vea y le escriba el comercio. */
      var desc=cur.desc || (cur.ref? "Ref. "+cur.ref : "");
      var ns=cur.nums, conDec=ns.filter(function(n){return n.dec;});
      if(conDec.length) ns=conDec;
      else if(ns.length>1){ var noRef=ns.filter(function(n){return !qEsRef(n.raw);}); if(noRef.length) ns=noRef; }
      var vs=ns.map(function(n){return n.v;});
      if(!desc||!vs.length){ cur=null; return; }       /* fecha suelta: no es una fila */
      if(cur.tipoHint==="Ingreso"||qEsPagoTarjeta(desc)){
        if(vs.some(function(v){return v>0.005;})){
          var esP=qEsPagoTarjeta(desc);
          if(esP) skip.pago++; else skip.cred++;
          fuera.push({fecha:cur.fecha,desc:desc,monto:vs.filter(function(v){return v>0.005;})[0],
                      motivo:esP?"pago de tarjeta o traslado":"crédito o abono recibido", esCred:!esP});
        }
      } else if(vs.length>=2){
        /* Débito y Crédito, en ese orden. Un débito de 0.00 con crédito no es gasto. */
        if(vs[0]>0.005) add(desc,vs[0]);
        else if(vs[1]>0.005){ skip.cred++; fuera.push({fecha:cur.fecha,desc:desc,monto:vs[1],motivo:"crédito o abono recibido",esCred:true}); }
      } else if(vs.length===1&&vs[0]>0.005) add(desc,vs[0]);
    }
    cur=null;
  };
  lines.forEach(function(l){
    if(!l) return;
    var dm=l.match(dateRe);
    if(dm){ fin(); var y=dm[3]; if(y.length===2) y="20"+y;
      cur={fecha:y+"-"+qPad(dm[2])+"-"+qPad(dm[1]), desc:"", ref:"", nums:[],
           moneda:"Lps", tipoHint:null, tarjeta:tAct}; return; }
    var mt=qMarcaTarjeta(l);
    if(mt){ fin(); tAct=(mt==="—"?"":mt); if(tarjetas.indexOf(tAct)<0) tarjetas.push(tAct); return; }
    if(/^total\b/i.test(l)){ fin(); return; }
    if(!cur) return;
    if(/^(LPS|HNL)$/i.test(l)) return;
    if(/^(USD|US\$)$/i.test(l)){ cur.moneda="USD"; return; }
    if(/^CAD$/i.test(l)){ cur.moneda="CAD"; return; }
    if(/^(EUR|€)$/i.test(l)){ cur.moneda="EUR"; return; }
    if(/^d[ée]bito$/i.test(l)){ cur.tipoHint="Egreso"; return; }
    if(/^cr[ée]dito$/i.test(l)){ cur.tipoHint="Ingreso"; return; }
    if(isRef(l)){ if(!cur.ref) cur.ref=l.replace(/[,\s]/g,""); return; }
    var nv=numOf(l);
    if(nv!=null){ var mo=qMoneda(l); if(mo!=="Lps") cur.moneda=mo; cur.nums.push({v:nv,raw:l,dec:qTieneDecimales(l)}); return; }
    if(!cur.desc&&/[A-Za-zÁÉÍÓÚÑáéíóúñ]/.test(l)) cur.desc=l.replace(/\s{2,}/g," ").trim();
  });
  fin();
  return {rows:recs, skipped:skip, fuera:fuera, tarjetas:tarjetas.filter(Boolean)};
}
/* ¿Vertical (un dato por línea) u horizontal (la fila entera en una línea)?
   Lo decide DÓNDE ESTÁ LA FECHA, no la presencia de tabuladores: el estado de
   cuenta de Promerica es vertical y aun así trae tabuladores en sus líneas de
   "Total en lempiras" y en los separadores de tarjeta. Confiar en el tabulador
   partía ese estado de cuenta en una fila por dato — todo desordenado. */
function qParsePaste(text){
  var lines=String(text||"").split(/\r?\n/).map(function(l){return l.trim();}).filter(function(l){return l!=="";});
  if(!lines.length) return {rows:[], skipped:{pago:0,cred:0}, fuera:[], tarjetas:[]};
  var sola=0, enLinea=0;
  lines.forEach(function(l){
    if(qParseDate(l)){ sola++; return; }                       /* la línea ES una fecha */
    var p=l.split(/\t| {2,}/);
    if(p.length>1 && p.some(function(c){ return qParseDate(String(c).trim()); })) enLinea++;
  });
  return (sola>enLinea) ? qPasteVertical(lines) : qPasteTabular(lines);
}

/* ---------- comparación de textos (solo para SUGERIR) ---------- */
var Q_RUIDO={};
"LOS LAS DEL COM WWW USA HND CAN CDN USD LPS HNL EUR INC LLC SRL TGU SPS CEIBA MEMBER MEMBERSHIP INTERNET VANCOUVER MOUNTAIN VIE SEATTLE GATOS CENTRO PROCERES SAUCE FRANCISCO MORAZAN TEGUCIGALPA SUC SUCURSAL EXT MCUOTA CUOTA COMPRA PAGO TARJETA ONLINE WEB STORE PURCHASE HTTP HTTPS"
  .split(" ").forEach(function(w){ Q_RUIDO[w]=1; });
function qNorm(s){ return String(s==null?"":s).toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^A-Z0-9]+/g," ").replace(/\s+/g," ").trim(); }
function qTokens(s){ return qNorm(s).split(" ").filter(function(t){ return t.length>=3&&!Q_RUIDO[t]&&!/^\d+$/.test(t); }); }
/* La raíz del cobro: el mismo texto sin los números largos que cambian mes a mes. */
function qDescCore(s){ return qNorm(s).replace(/\b\d{4,}\b/g," ").replace(/\s+/g," ").trim(); }
/* Contenida de verdad: palabra completa, para que "SUPER" no se cuele en "PAGO SUPER RECARGAS". */
function qDentroDe(largo,corto){
  if(!corto||corto.length<8) return false;
  var i=largo.indexOf(corto); if(i<0) return false;
  return (i===0||largo.charAt(i-1)===" ")&&(i+corto.length===largo.length||largo.charAt(i+corto.length)===" ");
}
function qDescScore(nd,md){
  if(!nd||!md) return 0;
  if(nd===md) return 3;
  if(qDentroDe(md,nd)||qDentroDe(nd,md)) return 2;
  return 0;
}
/* ---------- SUGERENCIA de permanente: por MONTO primero, texto después ----------
   El texto del banco cambia; el monto no. Y si no está segura, se calla. */
function sugerirPermanente(f){
  var monto=Math.abs(parseMonto(f.monto)); if(!(monto>0)) return null;
  var k=kAct();
  /* Los pausados entran: pausar dice "de acá en adelante no lo espero", no
     "esto no existe". Si el cobro igual llega, hay que poder verlo y ligarlo.
     Eso sí, un pausado nunca se elige solo. */
  var todos=permsK(k).filter(function(p){
    return (p.tipo||"Egreso")===B.tipo && (+p.monto||0)>0;
  });
  /* 1º entre los que todavía no se marcaron */
  var r=buscaPerm(todos.filter(function(p){ return !movDePerm(k,p.id); }), f, monto);
  if(r) return r;
  /* 2º entre los marcados a mano que solo tienen el movimiento de la plantilla:
     este es justo el caso en que el mismo cobro terminaría contado dos veces. */
  var conPlantilla=todos.filter(function(p){
    var m=movDePerm(k,p.id); return m && m.origen==="perm";
  });
  var r2=buscaPerm(conPlantilla, f, monto);
  if(r2){ r2.yaMarcado=true; return r2; }   /* la ficha ya dice que está cubierto */
  /* 3º entre los que YA están cubiertos por un cobro real: no hay nada que marcar,
     pero avisar evita que el mismo gasto quede registrado dos veces. */
  var cubiertos=todos.filter(function(p){
    var m=movDePerm(k,p.id); return m && m.origen!=="perm";
  });
  var r3=buscaPerm(cubiertos, f, monto);
  if(r3) r3.yaCubierto=true;                /* la ficha ya dice por qué y con qué */
  return r3;
}
/* ¿Esta fila ya está registrada? Pegar dos veces el mismo estado de cuenta es lo más
   fácil del mundo. Solo se avisa: quitar la fila o guardarla igual es decisión del usuario. */
/* ── REPETIDAS ────────────────────────────────────────────────────────────
   Se busca en la ventana ACTUAL y en la ANTERIOR, porque hay bancas en línea
   que no dicen a qué corte pertenece un cargo: el mismo gasto puede volver a
   pegarse en la ventana siguiente. Se comparan monto, raíz de la descripción y
   fecha con margen — la fecha de compra y la de registro no siempre coinciden.
   Entra todo lo ya registrado: gastos sueltos y movimientos ligados a un
   permanente. Un cobro que se repite cada mes queda fuera del margen de días,
   así que un permanente normal no se señala.
   La app solo avisa; quitar la fila o guardarla igual lo decide él.          */
var DIAS_REPE=6;
function diasEntre(a,b){
  var x=new Date(String(a)+"T00:00:00"), y=new Date(String(b)+"T00:00:00");
  if(isNaN(x.getTime())||isNaN(y.getTime())) return 9999;
  return Math.round(Math.abs(x-y)/86400000);
}
/* ═══════════ ¿SON EL MISMO GASTO? ═══════════════════════════════════════
   El mismo cargo llega distinto según de dónde se copie. El estado de cuenta
   escribe "EL TITAN CITY MALL TGU , Tegucigalpa HN"; los movimientos recientes,
   "EL TITAN CITY MALL TGU". Y la fecha tampoco coincide: el banco muestra la de
   compra en un lado y la de aplicación en el otro. Exigir texto idéntico dejaba
   pasar el duplicado.

   Dos niveles, y el segundo es más estricto en todo lo demás justamente porque
   afloja el texto:

   EXACTA    · mismo importe al centavo + misma descripción + hasta 6 días.
   PARECIDA  · importe con hasta L 10 de diferencia + texto parecido +
               la MISMA forma de pago + hasta 2 días.

   Ninguno de los dos borra nada: se señala y él decide.
========================================================================= */
var DIAS_REPE_CASI=2;      /* días admitidos cuando el texto no es idéntico */
var TOL_REPE=10;           /* lempiras de diferencia admitidos en ese caso */
var SIM_REPE=0.6;          /* cuánto parecido de texto hace falta */
/* Parecido entre dos descripciones de banco. La raíz les quita cuotas,
   referencias y números sueltos; los tokens, las palabras de relleno (ciudad,
   país, "COMPRA", "SUC"). Que una contenga a la otra pesa mucho: es justo lo
   que pasa cuando un origen agrega la ciudad y el otro no. */
function simRepe(a,b){
  var ra=qRaiz(a), rb=qRaiz(b);
  if(!ra||!rb) return 0;
  if(ra===rb) return 1;
  if(qDentroDe(ra,rb)||qDentroDe(rb,ra)) return 0.9;
  return simTexto(a,b);
}
/* Compara una fila (o movimiento) contra un movimiento ya registrado.
   Devuelve null, o el detalle de por qué se parecen. */
function repeCompara(f,m){
  var v0=cts(parseMonto(f.monto)), v1=cts(m.monto);
  if(!v0||!v1) return null;
  var c0=qDescCore(f.desc), c1=qDescCore(m.desc);
  if(!c0||!c1) return null;
  var d=diasEntre(m.fecha,f.fecha);
  if(v0===v1 && c0===c1) return (d<=DIAS_REPE)? {tipo:"exacta", dias:d, sim:1, dif:0} : null;
  if(d>DIAS_REPE_CASI) return null;
  if(Math.abs(v0-v1)>cts(TOL_REPE)) return null;
  /* la tarjeta tiene que calzar: el mismo gasto no se paga con dos plásticos.
     Si alguno de los dos no la tiene puesta, no cuenta ni a favor ni en contra. */
  if(pagoCoincide({pago:m.pago},{pago:f.pago})===-1) return null;
  var sim=simRepe(f.desc,m.desc);
  if(sim<SIM_REPE) return null;
  return {tipo:"parecida", dias:d, sim:sim, dif:red((v0-v1)/100)};
}
function repeMejor(a,b){          /* exacta gana; después, menos días */
  if(!a) return true;
  if(a.tipo!==b.tipo) return b.tipo==="exacta";
  return b.dias<a.dias;
}
function bRepetida(f){
  if(!f.fecha||!cts(parseMonto(f.monto))) return null;
  var kA=kAct(), kP=ventanaPrevia(kA), mejor=null;
  [kA,kP].forEach(function(k){
    if(!k) return;
    movsDe(k).forEach(function(m){
      var r=repeCompara(f,m);
      if(!r) return;
      if(repeMejor(mejor,r)) mejor={mov:m, k:k, dias:r.dias, tipo:r.tipo, sim:r.sim, dif:r.dif,
                                    otra:(k!==kA), perm:!!m.permId};
    });
  });
  return mejor;
}
/* Y la otra fuente de duplicados: el propio pegado. Dos estados de cuenta que
   se traslapan traen la misma línea dos veces — y cada uno la escribe a su
   manera, así que también se compara con el criterio flexible. */
function bRepeEnBloque(){
  var vivas=[];
  B.filas.forEach(function(f,i){
    f.repeFila=null;
    if(bVacia(f)||!f.fecha||!cts(parseMonto(f.monto))||!qDescCore(f.desc)) return;
    for(var j=0;j<vivas.length;j++){
      if(repeCompara(f,vivas[j].f)){ f.repeFila=vivas[j].i+1; return; }  /* fila 1-based */
    }
    vivas.push({f:f,i:i});
  });
}
/* ═══════════ EMPAREJAR UN COBRO ENTRANTE CON UN PERMANENTE ═══════════
   Tres señales, con pesos distintos según el tipo de gasto:

   MONTO · la rigidez la fija el rubro, porque no todos se comportan igual:
     · Financiamiento, Prestamo, Abono a Capital, Alquiler, Escuela → la cuota
       no cambia de un mes a otro: se exige exacto (±L1 por redondeo).
     · Suscripciones → el precio lo mueve la plataforma, y si el cobro viene
       convertido de dólares lo mueve el tipo de cambio: ±15 % (o ±L5).
     · el resto → ±3 % (o ±L2).

   TEXTO · se compara por la RAÍZ: el mismo nombre sin números de cuota ni
     referencias, así "JETSTEREO ... CUOTA 1/12" y "... CUOTA 2/12" son el mismo
     cobro. Un alias ya confirmado vale como coincidencia plena.

   DÍA DEL MES · un permanente cae más o menos el mismo día. Solo desempata;
     nunca alcanza por sí solo.

   Y la distinción que importa: FUERTE autoriza a tildar la casilla sola; el
   resto se propone y lo confirma él.                                        */
var CAT_ESTRICTAS={"Financiamiento":1,"Prestamo":1,"Abono a Capital MqV":1,"Alquiler":1,"Escuela":1};
function tolMonto(p){
  var c=String(p.cat||"").trim();
  if(CAT_ESTRICTAS[c])      return {rel:0,    abs:1};
  if(c==="Suscripciones")   return {rel:0.15, abs:5};
  return {rel:0.03, abs:2};
}
function dentroTol(p,monto){
  var pm=+p.monto||0, t=tolMonto(p);
  return pm>0 && Math.abs(monto-pm)<=Math.max(t.abs, pm*t.rel);
}
/* El margen de cuando NO hay texto que respalde: el mismo importe, o casi.
   Nunca el margen ancho de Suscripciones — ese es para "subió de precio", y eso
   solo se sabe si el nombre coincide. */
function dentroTolEstricta(p,monto){
  var pm=+p.monto||0;
  return pm>0 && Math.abs(monto-pm)<=Math.max(2, pm*0.03);
}
/* Piso de parecido: por debajo de esto el texto no dice nada útil. */
var SIM_ALGO=0.35;
/* La raíz del cobro: el nombre sin cuotas, sin referencias y sin números sueltos. */
function qRaiz(s){
  return qNorm(s)
    .replace(/\bCUOTA\b/g," ")
    .replace(/\b\d{1,3}\s*\/\s*\d{1,3}\b/g," ")
    .replace(/\bEXT\s*\d+\s*M?\b/g," ")
    .replace(/\b\d+\b/g," ")
    .replace(/\s+/g," ").trim();
}
function simTexto(a,b){
  var ra=qRaiz(a), rb=qRaiz(b);
  if(!ra||!rb) return 0;
  if(ra===rb) return 1;
  if(qDentroDe(ra,rb)||qDentroDe(rb,ra)) return 0.85;
  var ta=qTokens(ra), tb=qTokens(rb);
  if(!ta.length||!tb.length) return 0;
  var set={}; ta.forEach(function(x){ set[x]=1; });
  var com=tb.filter(function(x){ return set[x]; }).length;
  return com/Math.max(ta.length,tb.length);
}
function aliasCoincide(p,desc){
  var nd=qNorm(desc), nr=qRaiz(desc);
  if(!nd) return false;
  return aliasDe(p.id).some(function(a){
    var na=qNorm(a), ar=qRaiz(a);
    return (na.length>=6 && (nd===na||qDentroDe(nd,na)||qDentroDe(na,nd)))
        || (ar.length>=6 && nr===ar);
  });
}
function diaCerca(p,fecha){
  var d=parseInt(String(fecha||"").slice(8,10),10);
  if(!p.diaTipico||isNaN(d)) return false;
  var dif=Math.abs(d-p.diaTipico);
  return Math.min(dif,31-dif)<=4;
}
/* FORMA DE PAGO. Un cobro permanente de una tarjeta no puede ser el mismo que el
   de otra. En financiamientos y préstamos la forma de pago no cambia nunca: si
   difiere, no es ese cobro y no se tilda solo. En servicios, escuela y demás sí
   puede cambiar, así que solo baja la confianza y se avisa cuál era.
   Devuelve 1 = misma, −1 = distinta, 0 = alguna sin cargar.                     */
function pagoCoincide(p,f){
  var a=String(p.pago||"").trim(), b=String(f.pago||"").trim();
  if(!a||!b) return 0;
  return a===b ? 1 : -1;
}
function pagoRigido(p){ return !!CAT_ESTRICTAS[String(p.cat||"").trim()]; }
function buscaPerm(cand,f,monto){
  if(!cand.length) return null;
  var ev=cand.map(function(p){
    var alias=aliasCoincide(p,f.desc), pg=pagoCoincide(p,f);
    return {p:p, pausado:!permActivo(p),
      exacto: cts(+p.monto||0)===cts(monto),
      tol:    dentroTol(p,monto),
      alias:  alias,
      sim:    alias?1:simTexto(f.desc,p.desc||p.cat),
      dia:    diaCerca(p,f.fecha),
      pago:   pg,
      /* Forma de pago distinta en un rubro que nunca la cambia: normalmente no es
         ese cobro, y sale de la puja. PERO si el NOMBRE lo identifica sin dudas
         —el banco manda el mismo renglón— entonces sí es ese cobro y lo que está
         mal es la tarjeta anotada en el permanente. Ahí no se calla: lo propone
         y avisa de la diferencia, que él decide. Es lo que pasaba con
         «PROMOCION MINICUOTAS 12M CUOTA:09/12» por L 1,686.04 exactos: mismo
         nombre, mismo importe al centavo, y quedaba en «— ninguno —» solo
         porque el permanente tenía anotada otra tarjeta. */
      choca:  (pg===-1 && pagoRigido(p) && !alias && (alias?1:simTexto(f.desc,p.desc||p.cat))<0.8)};
  });
  function arma(x,fuerte,por){
    if(x.pago===-1){                       /* la forma de pago no calza: lo decide él */
      fuerte=false;
      por=por+" &middot; pero se cobra con "+(x.p.pago||"otra forma")+", no con "+(f.pago||"esta");
    }
    if(x.pausado){ fuerte=false; por=por+" &middot; está pausado en esta ventana"; }
    return {perm:x.p, fuerte:!!fuerte, por:por, ev:x};
  }
  /* Los que chocan por forma de pago rígida salen de la puja salvo que no quede nadie */
  var libres=ev.filter(function(x){ return !x.choca; });
  if(libres.length) ev=libres;
  function unicoPorTexto(lista){
    var max=0, gana=null, empate=false;
    lista.forEach(function(x){
      if(x.sim>max){ max=x.sim; gana=x; empate=false; }
      else if(x.sim===max && max>0) empate=true;
    });
    return (max>=SIM_ALGO && !empate)? gana : null;
  }
  /* 1 · monto exacto */
  var ex=ev.filter(function(x){ return x.exacto; });
  if(ex.length===1) return arma(ex[0],true,"monto exacto: "+fmt(ex[0].p.monto));
  if(ex.length>1){
    var pg=ex.filter(function(x){ return x.pago===1; });
    if(pg.length===1) return arma(pg[0],true,"monto exacto y la misma forma de pago");
    if(pg.length>1) ex=pg;
    var t1=unicoPorTexto(ex);
    if(t1) return arma(t1,true,"monto exacto y el texto apunta a este");
    var d1=ex.filter(function(x){ return x.dia; });
    if(d1.length===1) return arma(d1[0],true,"monto exacto y el día del mes coincide");
    return null;                                  /* varios idénticos: se calla */
  }
  /* 2 · el nombre coincide y el monto entra en la tolerancia de su rubro */
  var fuerteTxt=ev.filter(function(x){ return (x.alias||x.sim>=0.8) && x.tol; });
  if(fuerteTxt.length===1) return arma(fuerteTxt[0],true,
    fuerteTxt[0].alias? "texto ya confirmado antes" : "el nombre coincide y el monto entra en el margen del rubro");
  if(fuerteTxt.length>1) return null;
  /* 3 · el monto aproximado y nada más. Un solo dato flojo no alcanza:
       · UNA FORMA DE PAGO DISTINTA ES UN DATO EN CONTRA, no neutro. Si el
         cobro se hace con otra tarjeta y el texto no dice absolutamente nada,
         no queda de dónde agarrarse.
       · Sin texto, el importe tiene que ser el MISMO o casi — margen estrecho,
         no el ancho del rubro. El 15% de Suscripciones existe para cuando una
         suscripción sube de precio, y eso solo se sabe si el nombre coincide
         (eso es la regla 4). Usarlo a ciegas convertía cualquier gasto de
         importe parecido en candidato: así un SUPERMERCADO LA COLONIA de
         L 117.91 con Promerica se ofrecía como un GOOGLE *Facebook de L 133.85
         cobrado con EconoMia BAC.
       · Y hace falta una segunda señal: la misma forma de pago o el mismo día.
     El filtro SUPRIME la propuesta; no saca al candidato de la puja. Si hay
     varios en el margen, la app se sigue callando igual que antes — quitarlos
     de la lista convertiría una duda en una certeza falsa. */
  function proponible(x){
    if(x.sim>0||x.alias) return true;                  /* el texto acompaña */
    if(x.pago===-1) return false;                      /* otra tarjeta y sin texto: no */
    return dentroTolEstricta(x.p,monto) && (x.pago===1||x.dia);
  }
  var tol=ev.filter(function(x){ return x.tol; });
  if(tol.length===1) return proponible(tol[0])
    ? arma(tol[0],false,"monto aproximado a "+fmt(tol[0].p.monto)+" — confirmar") : null;
  if(tol.length>1){
    var t2=unicoPorTexto(tol);
    if(t2) return arma(t2,false,"monto aproximado y texto parecido — confirmar");
    return null;
  }
  /* 4 · el nombre coincide pero el monto cambió (típico de suscripciones).
     NO aplica a financiamientos ni préstamos: ahí la cuota no cambia, así que un
     importe distinto es otro cobro, no el mismo más caro. */
  var soloTxt=ev.filter(function(x){ return (x.alias||x.sim>=0.8) && !CAT_ESTRICTAS[String(x.p.cat||"").trim()]; });
  if(soloTxt.length===1) return arma(soloTxt[0],false,
    "el nombre coincide pero el monto cambió (antes "+fmt(soloTxt[0].p.monto)+") — confirmar");
  return null;
}
/* ¿Hubo alguno que estuvo cerca y se descartó? Sirve para que «— ninguno —»
   deje de ser mudo: si un permanente calzaba en casi todo, se dice cuál era y
   qué fue lo que no calzó. No cambia ninguna decisión — solo la explica. */
function casiPerm(cand,f,monto){
  if(!cand.length||!(monto>0)) return null;
  var mej=null;
  cand.forEach(function(p){
    var sim=aliasCoincide(p,f.desc)?1:simTexto(f.desc,p.desc||p.cat);
    var ex=cts(+p.monto||0)===cts(monto), tol=dentroTol(p,monto);
    var pg=pagoCoincide(p,f);
    if(!ex && !tol && sim<0.8) return;                 /* ni de lejos */
    var razones=[];
    if(pg===-1) razones.push("se cobra con "+(p.pago||"otra forma")+", no con "+(f.pago||"esta"));
    if(!ex&&!tol) razones.push("el importe no entra en el margen del rubro");
    else if(!ex&&sim<0.35) razones.push("el importe se parece pero el nombre no");
    if(sim<0.35&&!ex&&!tol) return;
    /* No nombrar un "más parecido" que no se parece. Si lo único que lo acerca
       es un importe caído dentro de un margen flexible, con otro nombre y otra
       forma de pago, nombrarlo es ruido — y se lee como si la app propusiera
       ese cobro, que es justo lo contrario de lo que quiere decir. */
    if(!(ex || sim>=SIM_ALGO || (tol && pg===1))) return;
    if(!permActivo(p)) razones.push("está pausado en esta ventana");
    if(!razones.length) return;                        /* si calzaba, ya se propuso */
    var pts=(ex?3:0)+(tol?1:0)+sim*3;
    if(!mej||pts>mej.pts) mej={p:p, pts:pts, razones:razones, ex:ex, sim:sim};
  });
  return mej;
}
function qLearnAlias(perm,desc){
  var full=qNorm(desc); if(!full||full.length<4) return;
  var core=qDescCore(full), add=[full];
  if(core&&core.length>=6&&core!==full) add.push(core);
  var todos=aliasDe(perm.id).concat(add), vistos={}, out=[];
  todos.forEach(function(a){ if(a&&!vistos[a]){ vistos[a]=1; out.push(a); } });
  S.alias[perm.id]=out.slice(0,10);
}
/* Lo que la app aprende de un cobro REAL: cómo lo nombra el banco y qué día del
   mes cae. Solo de cobros reales: el día en que se tilda una casilla no dice
   nada del día en que cobran. */
function aprendeDePago(perm,mv){
  if(!perm||!mv) return;
  if(mv.desc) qLearnAlias(perm, mv.desc);
  var d=parseInt(String(mv.fecha||"").slice(8,10),10);
  if(!isNaN(d)&&d>=1&&d<=31) perm.diaTipico=d;
}
/* ---------- SUGERENCIA de categoría: cómo categorizaste antes algo parecido ---------- */
function qHistCat(desc,tipo){
  var nd=qNorm(desc); if(!nd||nd.length<4) return null;
  var core=qDescCore(nd), best=null, bestSc=0, bestF="";
  var rz=null, rzF="", rzDuda=false;
  S.movimientos.forEach(function(m){
    if((m.tipo||"Egreso")!==tipo) return;
    var c=String(m.cat||"").trim(); if(!c||c===SIN_CAT) return;
    var md=qNorm(m.desc); if(!md||md.length<4) return;
    var sc=qDescScore(nd,md), fe=String(m.fecha||"");
    if(sc>0){ if(sc>bestSc||(sc===bestSc&&fe>bestF)){ bestSc=sc; bestF=fe; best={cat:c,desc:m.desc}; } return; }
    if(core.length>=5&&qDescCore(md)===core){
      if(rz&&rz.cat!==c) rzDuda=true;
      if(fe>=rzF){ rzF=fe; rz={cat:c,desc:m.desc,raiz:true}; }
    }
  });
  if(best) return best;
  if(rz&&!rzDuda) return rz;      /* misma raíz, número distinto: solo si SIEMPRE fue igual */
  return null;
}
function sugerirCat(f){
  /* El rubro sale del permanente ELEGIDO, no del que la app propuso: si él no lo
     eligió, la categoría no se le impone. */
  var pe=(f.permSel&&f.permSel!=="__nuevo")
    ? permsK(kAct()).filter(function(x){ return x.id===f.permSel; })[0] : null;
  if(pe){
    var c=String(pe.cat||"").trim();
    if(c&&c!==SIN_CAT) return {cat:c, de:"el permanente «"+(pe.desc||pe.cat)+"»"};
  }
  var h=qHistCat(f.desc,B.tipo);
  if(h) return {cat:h.cat, de:h.raiz?("todos los de «"+h.desc+"» que llevás registrados"):("la última vez en «"+h.desc+"»")};
  return null;
}

function bRecalcula(f){
  var antes=f.sug&&f.sug.perm&&f.sug.perm.id;

     todavía no tiene movimiento en la ventana y la coincidencia es inequívoca.
     Elegir aquí NO crea plata: la fila del banco se va a guardar igual; la
     elección solo la liga al permanente, y queda a la vista antes de guardar.
     Si él ya tocó el selector, la app no vuelve a opinar sobre esa fila. */
  if(!f.permTocada){
    var puede=(S.prefs.autoPerm!==false && f.sug && f.sug.fuerte && !f.sug.yaMarcado && !f.sug.yaCubierto);
    f.permSel=puede? f.sug.perm.id : "";

  else if(f.sug && f.sug.perm.id!==antes && !f.permSel) f.autoMarcada=false;

  if(f.permSel && f.permSel!=="__nuevo" && !permsK(kAct()).some(function(p){ return p.id===f.permSel; })){

/* La sugerencia SOLO se muestra. La casilla arranca desmarcada y ahí se queda
   hasta que Victor la toque: no marca, no cuenta, no suma. */
/* La celda del permanente NO impone: ofrece. Un selector con todos los
   permanentes de la ventana, la sugerencia de la app puesta como valor por
   defecto cuando es inequívoca, y debajo lo que haya que saber para decidir:
   qué encontró, si el importe no calza, si la forma de pago no calza, si ese
   permanente ya está cubierto. Cambiarlo es un clic. */
function permDeFila(f){
  if(!f.permSel||f.permSel==="__nuevo") return null;
  return permsK(kAct()).filter(function(p){ return p.id===f.permSel; })[0]||null;
}
/* La ficha completa del permanente: todo lo que hace falta para saber si ESE
   cobro es ESTE. Sin esto, dos cargos del mismo nombre y el mismo importe pero
   de tarjetas distintas se confunden — y aceptar el que no es sale caro. */
/* Lo que se va a crear si se elige «+ permanente nuevo»: sale de ESTA fila. */
function fichaNueva(f){
  var pz=[fmt(Math.abs(parseMonto(f.monto)))];
  pz.push(esc(f.pago||"sin forma de pago"));
  if(f.cat) pz.push(esc(f.cat));
  var h='<span class="sub"><b>'+esc(String(f.desc||"").trim()||"(sin comercio)")+'</b></span>'+
    '<br><span class="sub">'+pz.join(" &middot; ")+'</span>';
  if(String(f.motivo||"").trim()) h+='<br><span class="sub">'+esc(f.motivo)+'</span>';
  return h;
}
function fichaPerm(p,f){
  var k=kAct(), mv=movDePerm(k,p.id), monto=f?Math.abs(parseMonto(f.monto)):null;
  function d(txt,malo){ return '<span'+(malo?' class="tx-mal"':'')+'>'+txt+'</span>'; }
  var pz=[];
  pz.push(d(fmt(p.monto), (monto!=null&&monto>0&&cts(p.monto)!==cts(monto))));
  pz.push(d(esc(p.pago||"sin forma de pago"), !!(f&&f.pago&&p.pago&&p.pago!==f.pago)));
  if(p.cat) pz.push(d(esc(p.cat), !!(f&&f.cat&&f.catManual&&p.cat!==f.cat)));
  var h='<span class="sub">'+esc(p.desc||p.cat)+'</span><br><span class="sub">'+pz.join(" &middot; ")+'</span>';
  if(!permActivo(p)) h+='<br><span class="tx-mal">pausado</span><span class="sub"> desde esta ventana en adelante &middot; no cuenta en el presupuesto, pero el cobro se puede ligar igual</span>';
  if(p.motivo) h+='<br><span class="sub">'+esc(p.motivo)+'</span>';
  if(p.ultimaCuota||p.hasta) h+='<br><span class="sub">última cuota '+esc(p.ultimaCuota||p.hasta)+'</span>';
  if(mv) h+='<br><span class="tx-mal">ya cubierto</span><span class="sub"> por «'+esc(mv.desc||"")+'» del '+fmtF(mv.fecha)+
    (mv.origen==="perm"?' &middot; elegirlo acá lo reemplaza':' &middot; elegirlo acá deja este gasto sin ligar')+'</span>';
  return h;
}
function bSugHTML(f){
  if(bVacia(f)) return '<span class="sub" style="font-size:11.5px">—</span>';
  var k=kAct(), lista=permsK(k).filter(function(p){ return (p.tipo||"Egreso")===B.tipo; });
  lista.sort(function(a,b){ return String(a.desc||a.cat).localeCompare(String(b.desc||b.cat)); });
  var sel=f.permSel||"", monto=Math.abs(parseMonto(f.monto));

    op+='<optgroup label="Permanentes de la ventana">'+lista.map(function(p){
      var mv=movDePerm(k,p.id);
      var nm=String(p.desc||p.cat||"");
      if(nm.length>26) nm=nm.slice(0,25)+"…";
      return '<option value="'+esc(p.id)+'"'+(sel===p.id?" selected":"")+'>'+
        esc(nm)+' · '+fmt(p.monto)+(mv?" ✓":"")+(permActivo(p)?"":" (pausado)")+'</option>';
    }).join("")+'</optgroup>';
  }
  op+='<option value="__nuevo"'+(sel==="__nuevo"?" selected":"")+'>+ permanente nuevo</option>';

  var p=permDeFila(f), notas=[];
  /* «— ninguno —» mudo no ayuda: si hubo un candidato que estuvo cerca, se dice
     cuál y por qué no se propuso. El selector sigue teniendo la lista entera. */
  if(!sel && !f.sug){
    var casi=casiPerm(lista,f,monto);
    if(casi) notas.push('<span class="sub">el más parecido: <b>'+esc(casi.p.desc||casi.p.cat)+'</b> &middot; '+
      fmt(casi.p.monto)+(casi.p.pago?' &middot; '+esc(casi.p.pago):'')+
      '<br>no se propone porque '+esc(casi.razones.join(" · "))+
      '. Si igual corresponde, elegilo en la lista.</span>');
  }
  /* Ficha completa de lo que se propone o de lo elegido: comercio, importe,
     forma de pago, rubro, productos, última cuota y si ya está cubierto. En rojo
     lo que NO calza con esta fila. */
  if(!sel && f.sug)
    notas.push('<span class="sub">la app propone &middot; '+f.sug.por+'</span><br>'+fichaPerm(f.sug.perm,f));
  else if(sel==="__nuevo")
    /* La ficha de lo que se VA A CREAR, con los datos de ESTA fila. Nunca la del
       candidato descartado: leerlas juntas hacía creer que el permanente nuevo
       nacería con los datos de la sugerencia. */
    notas.push('<span class="sub">se agrega a la lista al guardar:</span><br>'+fichaNueva(f)+
      (f.sug?'<br><span class="sub">(la app había propuesto «'+esc(f.sug.perm.desc||f.sug.perm.cat)+'», descartado)</span>':''));
  else if(p){
    notas.push((f.sug&&f.sug.perm.id===p.id
        ? '<span class="sub">'+f.sug.por+(f.autoMarcada?' &middot; elegido por la app':'')+'</span><br>'
        : '<span class="sub">elegido a mano</span><br>')+fichaPerm(p,f));
    if(cts(p.monto)!==cts(monto) && monto>0)
      notas.push('<button class="ln" data-acc="b-perm-monto" title="Poner el permanente en '+esc(fmt(monto))+' para esta ventana y las que hereden de ella.">actualizar el importe a '+fmt(monto)+'</button>');
    if(String(p.pago||"")&&String(f.pago||"")&&p.pago!==f.pago)
      notas.push('<button class="ln" data-acc="b-perm-pago" title="Poner la forma de pago del permanente en '+esc(f.pago)+' para esta ventana y las que hereden de ella.">actualizar la forma de pago a '+esc(f.pago)+'</button>');
    if(f.sug&&f.sug.perm.id!==p.id)
      notas.push('<span class="sub">la app había propuesto «'+esc(f.sug.perm.desc||f.sug.perm.cat)+'»</span>');
  }
  if(f.duplaPerm) notas.push('<span class="tx-mal">otra fila de este pegado eligió el mismo</span>');
  return '<div style="width:272px">'+
    '<select class="cel'+(sel?" sug":"")+'" data-bc="permSel" style="width:100%" title="'+esc(
      "A qué permanente de la ventana corresponde este cobro. La app propone uno cuando la coincidencia es inequívoca, "+
      "pero la decisión es tuya: dejarlo en «ninguno» lo registra como gasto normal, elegir otro lo liga a ese, "+
      "y «+ permanente nuevo» lo agrega a la lista. Elegir no suma dinero: la fila se guarda igual.")+'">'+op+'</select>'+
    (notas.length?'<div style="font-size:11px;line-height:1.4;margin-top:3px">'+notas.join('<br>')+'</div>':'')+
  '</div>';
}
function bClase(f){

function bResumen(){
  var listas=0, faltan=0, otraMon=0, marcadas=0, autos=0, avisoDup=0, repes=0, cubiertas=0, convert=0, altas=0;
  var enBloque=0, otraVent=0;
  B.filas.forEach(function(f){
    if(bVacia(f)) return;
    var e=bEstado(f);
    if(!e.ok){ faltan++; return; }
    listas++;
    if(f.sug&&f.sug.yaMarcado&&!f.marcar) avisoDup++;
    if(f.sug&&f.sug.yaCubierto) cubiertas++;
    if(f.marcar){ marcadas++; if(f.autoMarcada) autos++; }
    if(f.nuevoPerm&&!f.sug) altas++;
    if(e.repe){ repes++; if(f.repeFila) enBloque++; else if(f.repe&&f.repe.otra) otraVent++; }
    else if(f.moneda&&f.moneda!=="Lps") otraMon++;
    else if(f.origMon) convert++;
  });
  var partes=[];
  partes.push('<b>'+listas+'</b> '+(listas===1?"fila lista":"filas listas")+' para guardar');
  if(faltan) partes.push('<b class="tx-mal">'+faltan+'</b> '+(faltan===1?"incompleta":"incompletas")+' (permanecen en la tabla)');
  if(repes) partes.push('<b class="tx-mal">'+repes+'</b> posible'+(repes===1?"":"s")+' duplicado'+(repes===1?"":"s")+
    (otraVent?' ('+otraVent+' de la ventana anterior)':'')+(enBloque?' ('+enBloque+' dentro de este pegado)':'')+
    ' &middot; <button class="ln" data-acc="b-quitar-repes" title="Quita de la grilla las filas señaladas como posible duplicado. No borra nada de lo ya registrado. Si alguna sí es un gasto aparte, dejarla y guardar.">quitar '+(repes===1?"esa fila":"esas "+repes+" filas")+'</button>');
  if(cubiertas) partes.push('<b class="tx-mal">'+cubiertas+'</b> con permanente ya cubierto por otro movimiento');
  if(avisoDup) partes.push('<b class="tx-mal">'+avisoDup+'</b> con permanente marcado a mano por el mismo importe &middot; marcar la casilla lo reemplaza');
  if(convert) partes.push('<b>'+convert+'</b> convertidas a lempiras al cambio del día');
  if(otraMon) partes.push('<b class="tx-mal">'+otraMon+'</b> en otra moneda sin tasa disponible');
  if(marcadas) partes.push('<b>'+marcadas+'</b> ligadas a un permanente'+(autos?' ('+autos+' elegidas por la app, cambiables en el selector)':''));
  if(altas) partes.push('<b>'+altas+'</b> se agregan a permanentes al guardar');
  var html='<div class="resumen">'+partes.join(' &nbsp;·&nbsp; ');
  /* Un estado de cuenta trae varias tarjetas en un mismo archivo, separadas por
     "XXXXXX4098". La forma de pago se aplica a TODO el bloque, así que mezclar
     plásticos en un solo pegado etiqueta mal la mayoría. No se corrige solo:
     se avisa, y él decide si pega tarjeta por tarjeta. */
  var tj={}, nTj=0;
  B.filas.forEach(function(f){ if(bVacia(f)) return;
    var t=f.tarjeta||"(sin número)"; if(!tj[t]){ tj[t]=0; nTj++; } tj[t]++; });
  if(nTj>1){
    html+='<div class="avi" data-t="avisoTarjetas" style="margin-top:9px">'+
      'El pegado trae <b>'+nTj+'</b> tarjetas distintas ('+
      Object.keys(tj).map(function(t){ return esc(t)+': '+tj[t]+' fila'+(tj[t]===1?"":"s"); }).join(' &middot; ')+
      '). La forma de pago de arriba se aplica a todo el bloque, así que quedarían con el mismo plástico. '+
      'Conviene pegar una tarjeta a la vez, o corregir la forma de pago fila por fila antes de guardar.</div>';
  }
  /* ---- CRÉDITOS ----------------------------------------------------------
     Un crédito no es un gasto, pero tampoco es basura: una devolución o un abono
     es dinero que vuelve, y si se descarta en silencio la ventana queda mostrando
     más gasto del que hubo. Se listan aparte, con lo que hace falta para meterlos
     como INGRESO en dos clics. Nada se registra solo: arrancan desmarcados. */
  var creds=B.fuera.filter(function(x){ return x.esCred; });
  if(creds.length){
    var totC=0; creds.forEach(function(x){ totC+=cts(x.monto); });
    var nSel=creds.filter(function(x){ return x.tomar; }).length;
    html+='<div class="avi" data-t="avisoCreditos" style="margin-top:9px">'+
      'El pegado trae <b>'+creds.length+'</b> crédito'+(creds.length===1?"":"s")+' por <b>'+fmt(totC/100)+
      '</b> — devoluciones, reversiones o abonos. <b>No son gastos</b>, así que no entraron a la grilla. '+
      'Si corresponden, se registran como ingreso de esta ventana y bajan el gasto neto.'+
      '<div class="tabla-cont" style="margin-top:8px;max-height:34vh"><table data-t="tablaCreditos"><thead><tr>'+
        '<th class="plano" style="width:30px"></th>'+
        '<th class="plano" style="width:92px">Fecha</th>'+
        '<th class="plano">Descripción</th>'+
        '<th class="plano der" style="width:104px">Monto</th>'+
        '<th class="plano" style="width:190px">Rubro de ingreso</th>'+
        '<th class="plano" style="width:170px">Forma de pago</th>'+
      '</tr></thead><tbody>'+
      creds.map(function(x,i){
        return '<tr class="cred-fila" data-cr="'+i+'">'+
          '<td style="text-align:center"><input type="checkbox" data-crc="tomar"'+(x.tomar?" checked":"")+
            ' title="Marcalo si este crédito sí corresponde registrarlo como ingreso."></td>'+
          '<td class="sub" style="white-space:nowrap;padding:6px 8px">'+esc(fmtF(x.fecha))+'</td>'+
          '<td style="padding:6px 8px">'+esc(x.desc||"(sin descripción)")+'</td>'+
          '<td class="num" style="padding:6px 8px">'+fmt(x.monto)+'</td>'+
          '<td><select class="cel" data-crc="cat">'+opciones(S.catI,x.cat||"",true)+'</select></td>'+
          '<td><select class="cel" data-crc="pago">'+opciones(S.formas,(x.pago||B.pago||""),true)+'</select></td>'+
        '</tr>';
      }).join("")+'</tbody></table></div>'+
      '<div class="barra-h" style="margin-top:9px">'+
      '<button class="btn gh peq" data-acc="cred-todos">'+(nSel===creds.length?"Desmarcar todos":"Marcar todos")+'</button>'+
      '<button class="btn peq" data-acc="cred-guardar"'+(nSel?"":" disabled style=\"opacity:.5\"")+'>'+
        'Registrar '+(nSel?nSel:"")+' como ingreso</button>'+
      '<span class="sub">se guardan de una vez, sin pasar por la grilla</span></div></div>';
  }
  if(B.fuera.length){
    html+='<details style="margin-top:9px"><summary style="cursor:pointer">Dejé fuera <b>'+B.fuera.length+
      '</b> línea(s) por no ser gasto — ver detalle</summary>'+
      '<div style="margin-top:8px;font-size:12.5px">'+B.fuera.map(function(x){
        return '<div style="display:flex;gap:10px;padding:3px 0;border-bottom:1px solid var(--linea2)">'+
          '<span style="white-space:nowrap;color:var(--tx3)">'+esc(fmtF(x.fecha))+'</span>'+
          '<span style="flex:1">'+esc(x.desc||"(sin descripción)")+'</span>'+
          '<span class="sub">'+esc(x.motivo)+'</span>'+
          '<span style="font-variant-numeric:tabular-nums;white-space:nowrap">'+fmt(x.monto)+'</span></div>';
      }).join("")+
      '<div class="barra-h" style="margin-top:9px"><button class="btn gh peq" data-acc="b-traer-fuera">'+
      'Traer a la grilla</button>'+
      '<span class="sub">si alguna sí corresponde a un gasto</span></div></div></details>';
  }
  html+='</div>';
  var r=$("#bResumen");
  if(r) r.innerHTML=html;
  var bg=document.querySelector('[data-t="btnGuardarBloque"]');
  if(bg){ bg.textContent=listas?("Guardar "+listas+" fila"+(listas===1?"":"s")):"Guardar"; bg.disabled=!listas; bg.style.opacity=listas?"":".5"; }
}
/* Registra los créditos marcados como INGRESO de la ventana activa. Van derecho
   a movimientos —que es lo único que es dinero— y quedan en la bitácora, así que
   se pueden revertir de un golpe si me equivoco. No pasan por la grilla porque
   la grilla es de un solo tipo por lote y esto es lo contrario del lote. */
function credGuardar(){
  if(!B) return;
  var k=kAct(), sel=B.fuera.filter(function(x){ return x.esCred && x.tomar; });
  if(!sel.length){ toast("Ninguno marcado."); return; }
  var sinCat=sel.filter(function(x){ return !x.cat; });
  if(sinCat.length){ toast("Falta el rubro de ingreso en "+sinCat.length+" crédito(s)",5000); return; }
  var nuevos=[];
  sel.forEach(function(x){
    var mv={id:id(), k:k, fecha:x.fecha||hoyISO(), tipo:"Ingreso",
            desc:String(x.desc||"").trim(), monto:red(Math.abs(+x.monto||0)),
            cat:x.cat, pago:x.pago||B.pago||"", motivo:"crédito del estado de cuenta",
            fx:"", permId:null, origen:"credito"};
    S.movimientos.push(mv); nuevos.push(mv);
  });
  anota("credito","Créditos del pegado registrados como ingreso", nuevos, []);
  B.fuera=B.fuera.filter(function(x){ return !(x.esCred && x.tomar); });
  guardar(); render(); pintaPegado();
  var tot=0; nuevos.forEach(function(m){ tot+=cts(m.monto); });
  toast(nuevos.length+" crédito"+(nuevos.length===1?"":"s")+" registrado"+(nuevos.length===1?"":"s")+
        " como ingreso &middot; "+fmt(tot/100)+" &middot; revertible desde la bitácora",6000);
}
function bGuardar(){
  var k=kAct(), guardadas=0, reemplazos=0, ligados=0, sinLigar=0, altas=0, quedan=[], tocados=[];
  var nuevos=[], permsAlta=[];
  B.filas.forEach(function(f){
    if(bVacia(f)) return;
    var e=bEstado(f);
    if(!e.ok){ quedan.push(f); return; }
    var mv={id:id(), k:k, fecha:f.fecha, tipo:B.tipo, desc:String(f.desc).trim(),
            monto:parseMonto(f.monto), cat:f.cat||"", pago:f.pago||"", motivo:String(f.motivo||"").trim(),
            fx:(f.origMon? f.origMon+" "+Math.abs(f.origVal).toFixed(2)+" @ "+fmtTasa(f.tasa) : ""),
            permId:null, origen:"bloque"};
    var pEleg=(f.marcar? permsK(k).filter(function(x){ return x.id===f.permSel; })[0] : null);
    if(pEleg){                                    /* SOLO el permanente que él eligió */
      var p=pEleg, ya=movDePerm(k,p.id);
      if(ya && ya.origen==="perm"){               /* el movimiento de plantilla se reemplaza por el real */
        if(ya.editado && !confirm("El movimiento «"+(ya.desc||"")+"» por "+fmt(ya.monto)+
            " fue editado a mano.\n\nReemplazarlo por el cobro del banco lo elimina. ¿Reemplazar?")){
          S.movimientos.push(mv); guardadas++; return;   /* se guarda el del banco, sin ligar ni borrar */
        }
        S.movimientos=S.movimientos.filter(function(x){ return x.id!==ya.id; });
        reemplazos++;
      }
      if(!movDePerm(k,p.id)){ mv.permId=p.id; if(!mv.motivo) mv.motivo=p.motivo||"";
        aprendeDePago(p, mv); ligados++; tocados.push(p.id); }
      else sinLigar++;
    }
    else if(f.nuevoPerm){                         /* no existía: se da de alta con estos datos */
      var np=permDesdeMov(k,{tipo:B.tipo, desc:mv.desc, monto:mv.monto, cat:mv.cat, pago:mv.pago, motivo:mv.motivo});
      mv.permId=np.id; aprendeDePago(np, mv); altas++; tocados.push(np.id); permsAlta.push(np.id);
    }
    S.movimientos.push(mv); nuevos.push(mv); guardadas++;
  });
  if(nuevos.length) anota("bloque","Pegado en bloque"+(B.pago?" · "+B.pago:""), nuevos, permsAlta);
  B.filas=quedan;
  S.prefs.pago=B.pago;
  guardar();
  if(quedan.length){
    bRecalculaTodo(); pintaPegado();
    toast(guardadas+" guardadas"+(ligados?" &middot; "+ligados+" permanentes dados por pagados":"")+
      (altas?" &middot; "+altas+" de alta como permanentes":"")+
      " &middot; "+quedan.length+" incompletas siguen en la tabla",5500);
  } else {
    cierraModal();
    /* Solo se preguntan las cuotas de los permanentes tocados en ESTE guardado. */
    var pendCuotas=tocados.filter(function(pid,i,arr){ return arr.indexOf(pid)===i; })
      .filter(function(pid){
        var pp=permsK(k).filter(function(x){ return x.id===pid; })[0];
        return pp && faltaCuotas(pp);
      });
    if(pendCuotas.length){
      guardar(); render();
      colaCuotas=pendCuotas.slice(1);
      setTimeout(function(){ abreCuotas(pendCuotas[0]); },250);
    }
    toast(guardadas+" guardadas"+
      (ligados?" &middot; "+ligados+" permanente"+(ligados===1?"":"s")+" dado"+(ligados===1?"":"s")+" por pagado"+(ligados===1?"":"s"):"")+
      (altas?" &middot; "+altas+" dado"+(altas===1?"":"s")+" de alta como permanente"+(altas===1?"":"s"):"")+
      (reemplazos?" &middot; "+reemplazos+" reemplazaron su plantilla":"")+
      (sinLigar?" &middot; "+sinLigar+" sin ligar: el permanente ya estaba cubierto":""),6000);
  }
  render();
}

/* pegado dentro de una celda: se reparte solo */
document.addEventListener("paste", function(ev){
  if(!B) return;
  var t=ev.target, bc=t.getAttribute&&t.getAttribute("data-bc");
  if(!bc) return;
  var cb=ev.clipboardData||window.clipboardData; if(!cb) return;
  var txt=cb.getData("text"); if(!txt) return;
  var multi=/[\n\t]/.test(txt) || txt.trim().split(/ {2,}/).length>=3;
  if(!multi) return;                              /* pegado normal de un dato suelto */
  ev.preventDefault();
  var tr=t.closest("tr[data-b]"), i=tr?+tr.getAttribute("data-b"):0;
  var res=qParsePaste(txt), rows=res.rows||[];
  B.fuera=B.fuera.concat(res.fuera||[]);
  if(!rows.length){
    var nd=(res.skipped.pago||0)+(res.skipped.cred||0);
    toast(nd? ("No había gastos que pegar — solo "+nd+" movimiento(s) que no son gasto.")
            : "No reconocí ninguna fila. Asegurate de copiar también la fecha.",5000);
    bResumen(); return;
  }
  var cats=catsDe(B.tipo);
  var nuevas=rows.map(function(r){
    var f=filaB();
    f.fecha=r.fecha||""; f.desc=r.desc||""; f.monto=r.monto||""; f.moneda=r.moneda||"Lps";
    /* Conversión al pegar: la grilla muestra lempiras y el estado deja ver la tasa. */
    if(f.moneda!=="Lps"){
      var tsa=fxTasa(f.moneda);
      if(tsa){
        f.origMon=f.moneda; f.origVal=parseMonto(f.monto); f.tasa=tsa;
        f.monto=String(red(f.origVal*tsa)); f.moneda="Lps";
      }
    }
    if(r.cat && cats.indexOf(r.cat)>=0) { f.cat=r.cat; f.catManual=true; }
    f.pago=(r.pago && S.formas.indexOf(r.pago)>=0) ? r.pago : (B.pago||"");
    f.tarjeta=r.tarjeta||"";        /* de qué plástico venía, si el estado lo dice */
    return f;
  });
  var libres=0;
  for(var j=i;j<B.filas.length&&bVacia(B.filas[j]);j++) libres++;
  Array.prototype.splice.apply(B.filas,[i,Math.min(libres,nuevas.length)].concat(nuevas));
  bRecalculaTodo(); pintaPegado();
  toast(nuevas.length+" fila(s) pegadas.");
});
