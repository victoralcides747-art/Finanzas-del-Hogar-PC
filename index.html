<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanzas del Hogar</title>
<!-- Instalable en el celular. Todo esto es INERTE al abrir el archivo con doble
     clic (file://): el manifiesto no se pide y el service worker no se registra.
     Solo entra en juego cuando la app se sirve por https. -->
<meta name="theme-color" content="#17171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- Firebase (Firestore) para respaldo en la nube -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   Paleta: superficies e ink de la referencia de dataviz; azul = PLANEADO,
   tinta neutra = REAL, y estado (bueno/crítico/aviso) para los saldos.
   Rojo y verde no se distinguen en daltonismo (ΔE 4.1 deutan), así que
   TODO número de estado lleva su signo — el color nunca decide solo.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#f2f2f0; --card:#fcfcfb; --card2:#f8f8f6;
  --linea:#e3e2de; --linea2:#eeedea; --linea3:#f5f4f1;
  --tx:#0b0b0b; --tx2:#52514e; --tx3:#8b8a84;
  --plan:#2a78d6; --plan-tx:#1c5cab; --plan-bg:#f3f8fe; --plan-linea:#d9e8fb; --plan-pista:#cde2fb;
  --ok:#0ca30c; --ok-tx:#006300; --ok-bg:#eff8ef;
  --mal:#d03b3b; --mal-tx:#b02f2f; --mal-bg:#fdf1f1;
  --avi:#fab219; --avi-tx:#6b4d00; --avi-bg:#fdf8ec; --avi-linea:#eee0bc;
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
  font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1720px;margin:0 auto;padding:0 16px 40px}

/* ── cabecera ─────────────────────────────────────────────────────── */
header{background:var(--card);border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:40}
.hrow{max-width:1720px;margin:0 auto;padding:7px 16px;display:flex;align-items:center;gap:12px}
.marca{font-weight:650;letter-spacing:-.2px;white-space:nowrap;font-size:14px}
.tabs{display:flex;gap:2px;margin-left:4px}
.tab{background:none;border:0;padding:6px 14px;border-radius:6px;cursor:pointer;color:var(--tx2);font-weight:500}
.tab:hover{background:var(--linea2)}
.tab.on{background:var(--plan-bg);color:var(--plan-tx);font-weight:600;box-shadow:inset 0 0 0 1px var(--plan-linea)}
.sp{flex:1}
.vsel{display:flex;align-items:center;gap:6px}
.vsel label{font-size:11.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em}
select.pill,input.pill{background:var(--card);border:1px solid var(--linea);border-radius:6px;padding:5px 8px;outline:none}
select.pill:focus,input.pill:focus{border-color:var(--plan)}
.fx{display:flex;align-items:center;gap:3px;border:1px solid var(--linea);border-radius:6px;
  background:var(--card2);padding:2px 3px 2px 5px;white-space:nowrap}
.fx-b{background:none;border:0;padding:2px 4px;cursor:pointer;display:flex;align-items:baseline;gap:5px;border-radius:4px}
.fx-b:hover{background:var(--linea2)}
.fx-m{font-size:9.5px;color:var(--tx3);font-weight:700;letter-spacing:.04em}
.fx-v{font-size:11.5px;color:var(--tx2);font-variant-numeric:tabular-nums;margin-right:4px}
.fx-r{background:none;border:0;color:var(--tx3);cursor:pointer;font-size:13px;line-height:1;padding:3px 4px;border-radius:4px}
.fx-r:hover{background:var(--linea2);color:var(--plan-tx)}
.fx-r.gira{animation:gira 1s linear infinite;color:var(--plan)}
@keyframes gira{to{transform:rotate(360deg)}}
.fx-p{color:var(--avi);font-size:15px;line-height:1;padding-right:3px}
/* estado del respaldo en la nube · mismo lenguaje visual que el cuadro de tasas */
.nb{display:flex;align-items:center;border:1px solid var(--linea);border-radius:6px;background:var(--card2)}
.nb-b{background:none;border:0;padding:3px 7px;cursor:pointer;display:flex;align-items:baseline;gap:5px;border-radius:5px}
.nb-b:hover{background:var(--linea2)}
.nb-m{font-size:9.5px;color:var(--tx3);font-weight:700;letter-spacing:.04em}
.nb-v{font-size:11.5px;color:var(--tx2);font-variant-numeric:tabular-nums}
.nb-v.esp{color:var(--tx3)}
.nb-v.mal{color:var(--mal-tx);font-weight:650}
/* libreta de tarjetas */
.tj-tabla td{vertical-align:middle}
.tj-cen{text-align:center}
.tj-cen .cel{width:100%;text-align:center;font-variant-numeric:tabular-nums}
.tj-cen th,.tj-tabla th.tj-cen{text-align:center}
.tj-lim{display:flex;align-items:center;gap:3px;justify-content:center}
.tj-lim .cel{width:78px}
.tj-lim .mon-sel{flex:0 0 auto}
.tj-benes{display:flex;flex-direction:column;gap:3px;padding:2px 0;align-items:center}
/* cada beneficio en UNA línea, con columnas fijas para que se lean alineados */
.tj-b{display:grid;grid-template-columns:minmax(96px,1fr) 46px 10px 104px 22px;
      align-items:center;gap:5px}
.tj-b .cel{width:100%;padding:4px 6px}
.tj-b .cel.n{text-align:right;font-variant-numeric:tabular-nums}
.tj-b .sub{font-size:11px;color:var(--tx3)}
.tj-b .borrar{justify-self:center}
.tj-pg{display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:3px 2px;white-space:nowrap}
.tj-p{display:flex;align-items:center;gap:7px}
@media (max-width:1180px){ .nb .nb-m{display:none} }
@media (max-width:1180px){ .fx .fx-m{display:none} }
.icb{background:none;border:1px solid var(--linea);border-radius:6px;width:30px;height:30px;cursor:pointer;
  color:var(--tx2);display:grid;place-items:center}
.icb:hover{background:var(--linea2);color:var(--tx)}

/* ── bloques ──────────────────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--linea);border-radius:var(--r);padding:13px 15px;margin-top:12px}
.card h2{margin:0 0 2px;font-size:11px;font-weight:650;color:var(--tx3);letter-spacing:.05em;text-transform:uppercase}
.sub{font-size:12px;color:var(--tx3)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:start;margin-top:12px}
.grid2>.card{margin-top:0}
@media (max-width:1080px){ .grid2{grid-template-columns:1fr} }
[title]{cursor:help}
h2 [title],label[title],.et[title]{border-bottom:1px dotted var(--tx3)}

/* ── cifra principal ──────────────────────────────────────────────── */
.grande{display:block;background:none;border:0;padding:0;cursor:pointer;font-size:50px;line-height:1.02;
  font-weight:680;letter-spacing:-1.6px;text-align:left}
.grande:hover{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:6px}
.verde{color:var(--ok-tx)} .rojo{color:var(--mal-tx)}
.formula{font-size:11.5px;color:var(--tx3);margin-top:3px}

.tres.dos{grid-template-columns:repeat(2,1fr)}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--linea);
  border:1px solid var(--linea);border-radius:6px;overflow:hidden;margin-top:12px}
.mini{background:var(--card);padding:9px 11px;text-align:left;border:0;cursor:pointer}
.mini:hover{background:var(--plan-bg)}
.mini .et{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.mini .vl{font-size:19px;font-weight:640;margin-top:1px}
.mini .pie{font-size:11px;color:var(--tx3);margin-top:1px}

.num-lnk{background:none;border:0;padding:0;cursor:pointer;font-weight:640;color:var(--tx);
  text-decoration:underline;text-decoration-color:var(--linea);text-underline-offset:3px}
.num-lnk:hover{text-decoration-color:var(--plan);color:var(--plan-tx)}
.fila-in{margin-top:11px;padding-top:10px;border-top:1px solid var(--linea2);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap}

/* ── pronóstico ───────────────────────────────────────────────────── */
.pron{background:var(--avi-bg);border:1px solid var(--avi-linea);border-radius:var(--r);padding:13px 15px}
.pron .tit{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--avi-tx)}
.pron .avi{font-size:11.5px;color:var(--avi-tx);margin-top:10px;border-top:1px solid var(--avi-linea);
  padding-top:8px;line-height:1.5}
.pron-et{font-size:10.5px;color:var(--avi-tx);text-transform:uppercase;letter-spacing:.04em;font-weight:650}
.pron-pie{font-size:11px;color:#8a7340;margin-top:2px;max-width:210px;line-height:1.3}
.pron-lista{margin-top:9px;max-height:46vh;overflow:auto;font-size:12.5px}
.pron-lista div{display:flex;justify-content:space-between;gap:10px;padding:2.5px 0;border-bottom:1px solid var(--avi-linea)}
.pron-lista div:last-child{border-bottom:0}
.pron-lista span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--avi-tx)}

/* ── tablas ───────────────────────────────────────────────────────── */
.tabla-cont{overflow:auto;border:1px solid var(--linea);border-radius:6px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
table[data-t="tablaMov"]{min-width:1010px}
table[data-t="tablaPerm"]{min-width:940px}
table[data-t="tablaPegado"]{min-width:1120px}
table[data-t="tablaRub"]{table-layout:fixed}
table[data-t="tablaRub"] td:first-child,table[data-t="tablaHoyRub"] td:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th{text-align:left;font-weight:650;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--tx3);background:var(--card2);border-bottom:1px solid var(--linea);padding:0;
  white-space:nowrap;position:sticky;top:0;z-index:2}
th button{background:none;border:0;padding:7px 8px;width:100%;text-align:left;cursor:pointer;
  font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
th button:hover{color:var(--plan-tx)}
th.plano{padding:7px 8px}
th.der,th.der button{text-align:right}
td{border-bottom:1px solid var(--linea3);padding:0;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--card2)}
td .cel{width:100%;border:0;background:none;padding:6px 8px;outline:none}
td .cel:focus{background:var(--plan-bg);box-shadow:inset 0 0 0 1.5px var(--plan);border-radius:4px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.num .cel{text-align:right;font-variant-numeric:tabular-nums}
select.cel{cursor:pointer;appearance:none;-webkit-appearance:none}
.neg{color:var(--mal-tx)}
.rub-lnk{width:100%;text-align:left;background:none;border:0;padding:6px 8px;cursor:pointer;
  font:inherit;color:inherit;outline:none;border-radius:4px}
.rub-lnk.der{text-align:right;font-variant-numeric:tabular-nums}
tr.rub-clic:hover .rub-lnk{color:var(--plan-tx)}
.rub-lnk:focus-visible{box-shadow:inset 0 0 0 1.5px var(--plan)}
input.tienefx{box-shadow:inset 2px 0 0 var(--plan)}
.mon-cel{display:flex;align-items:center;gap:3px;justify-content:flex-end}
.mon-sel{border:0;background:none;color:var(--tx3);font-size:10.5px;padding:2px 0;cursor:pointer;
  outline:none;max-width:44px}
.mon-sel:hover,.mon-sel:focus{color:var(--plan-tx);background:var(--plan-bg);border-radius:4px}
.fx-sello{font-size:10px;text-align:right;padding:0 4px 3px 0;line-height:1.2}
.col-plan{background:var(--plan-bg)}
tbody tr:hover td.col-plan{background:#eaf2fd}
th.col-plan{background:#e9f1fd;color:var(--plan-tx)}
.borrar{background:none;border:0;color:var(--tx3);cursor:pointer;padding:5px 7px;border-radius:5px;line-height:1;font-size:13px}
.borrar:hover{background:var(--mal-bg);color:var(--mal-tx)}
/* ── proyección: el saldo libre manda ─────────────────────────────── */
.pron-jefe{margin-top:8px;padding:11px 13px;background:rgba(255,255,255,.55);
  border:1px solid var(--avi-linea);border-radius:9px}
.pron-dos{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.pron-p{flex:1;min-width:132px;text-align:left;background:none;border:1px solid var(--avi-linea);
  border-radius:7px;padding:7px 9px;cursor:pointer;font:inherit}
.pron-p:hover{background:rgba(255,255,255,.75)}
.pron-p .et{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--avi-tx);opacity:.85;margin-bottom:2px}
.pron-p .vl{display:block;font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--avi-tx)}
.pron-p .vl.rojo{color:var(--mal-tx)}

/* ── préstamos ────────────────────────────────────────────────────── */
.pr-estado{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;
  background:var(--linea);border:1px solid var(--linea);border-radius:8px;overflow:hidden}
.pr-d{background:var(--card);padding:9px 11px}
.pr-d .et{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);margin-bottom:3px}
.pr-d .vl{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}
.pr-sim{margin-top:12px;padding:11px 12px;border:1px solid var(--plan-linea);
  background:var(--plan-bg);border-radius:8px}
.pr-campos{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.pr-det{margin-top:12px;border-top:1px solid var(--linea);padding-top:10px}
.pr-det>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--tx2)}
.pr-ancla{margin-top:12px;padding:10px 11px;border:1px dashed var(--linea);border-radius:8px;background:var(--card2)}
.ln{background:none;border:0;padding:0;font:inherit;color:var(--plan);cursor:pointer;text-decoration:underline}
.ln:hover{color:var(--tx)}
.pbt{background:none;border:1px solid transparent;color:var(--tx3);cursor:pointer;padding:3px 6px;
  border-radius:5px;line-height:1;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;opacity:.35}
tr:hover .pbt{opacity:1;border-color:var(--linea)}
.pbt:hover{border-color:var(--tx3)!important;color:var(--tx2)}
.pbt.on{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok-tx);opacity:1}
.filaTot td{background:var(--card2);font-weight:650;border-top:1px solid var(--linea);border-bottom:0;
  padding:8px;font-variant-numeric:tabular-nums}

/* ── medidor: la pista es un paso claro del MISMO azul ────────────── */
.barra{height:5px;border-radius:99px;background:var(--plan-pista);overflow:hidden;min-width:56px}
.barra i{display:block;height:100%;background:var(--plan);border-radius:99px}
.barra.x{background:#f6d6d6} .barra.x i{background:var(--mal)}

/* ── botones ──────────────────────────────────────────────────────── */
.btn{background:var(--plan);color:#fff;border:1px solid var(--plan);border-radius:6px;padding:6px 12px;
  cursor:pointer;font-weight:550}
.btn:hover{filter:brightness(.93)}
.btn.gh{background:var(--card);color:var(--tx);border-color:var(--linea)}
.btn.gh:hover{background:var(--linea2);filter:none}
.btn.peq{padding:4px 9px;font-size:12px}
.btn.mal{background:var(--mal);border-color:var(--mal)}
.barra-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.qadd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--plan-bg);
  border:1px solid var(--plan-linea);border-radius:var(--r);padding:8px 10px;margin-bottom:10px}
.qadd input,.qadd select{border:1px solid var(--plan-linea);background:var(--card);border-radius:6px;padding:5px 7px;outline:none}
.qadd input:focus,.qadd select:focus{border-color:var(--plan)}

/* ── modales ──────────────────────────────────────────────────────── */
.velo{position:fixed;inset:0;background:rgba(18,22,28,.4);display:flex;align-items:flex-start;
  justify-content:center;padding:32px 14px;z-index:100;overflow:auto}
.modal{background:var(--card);border-radius:10px;width:100%;max-width:620px;box-shadow:0 16px 44px rgba(0,0,0,.2)}
.modal.ancho{max-width:940px}
.modal.enorme{max-width:1400px}
.mh{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--linea)}
.mh h3{margin:0;font-size:14px;font-weight:650}
.mb{padding:14px 16px;max-height:72vh;overflow:auto}
.mf{padding:10px 16px;border-top:1px solid var(--linea);display:flex;gap:8px;justify-content:flex-end}
.desg-tot{font-size:26px;font-weight:660;margin-bottom:2px}
.desg-frm{font-size:12px;color:var(--tx2);margin-bottom:12px;line-height:1.55}
.desg-frm code{background:var(--linea2);padding:1px 5px;border-radius:4px;font-size:11.5px}

/* ── grilla de pegado ─────────────────────────────────────────────── */
tr.sug td{background:var(--plan-bg)}
tr.sug.marcada td{background:var(--ok-bg)}
tr.dup td{background:var(--avi-bg)}
tr.falta td:first-child{box-shadow:inset 3px 0 0 var(--avi)}
tr.ojo td:first-child{box-shadow:inset 3px 0 0 var(--avi)}
tr.lista td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.est{font-size:11px;line-height:1.25;display:inline-block}
.est.lista{color:var(--ok-tx)}
.est.falta{color:var(--avi-tx);font-weight:600}
.est.ojo{color:var(--avi-tx)}
select.cel.auto{box-shadow:inset 2px 0 0 var(--plan)}
.resumen{margin-top:10px;padding:9px 12px;background:var(--card2);border:1px solid var(--linea);
  border-radius:6px;font-size:12.5px;color:var(--tx2)}
.tx-mal{color:var(--mal-tx)}

/* ── permanentes ──────────────────────────────────────────────────── */
tr.perm-fila.marcada td{background:var(--ok-bg)}
tr.perm-fila.pausada td{opacity:.45}
tr.perm-fila.vencida td:first-child{box-shadow:inset 3px 0 0 var(--avi)}

/* ── varios ───────────────────────────────────────────────────────── */
.vacio{text-align:center;padding:34px 18px;color:var(--tx3)}
.campo{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.campo label{font-size:11.5px;color:var(--tx2);font-weight:550}
.campo input,.campo select,.campo textarea{border:1px solid var(--linea);border-radius:6px;padding:7px 9px;
  outline:none;background:var(--card);width:100%}
.campo input:focus,.campo select:focus{border-color:var(--plan)}
.aviso{background:var(--mal-bg);border:1px solid #f2cccc;color:var(--mal-tx);padding:9px 12px;
  border-radius:6px;font-size:12.5px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1e2228;color:#fff;
  padding:9px 16px;border-radius:6px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.24);max-width:88vw}
.chip{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:99px;background:var(--linea2);
  color:var(--tx2);font-weight:600;letter-spacing:.02em}
.chip.ok{background:var(--ok-bg);color:var(--ok-tx)}
.chip.plan{background:var(--plan-bg);color:var(--plan-tx)}
.chip.avi{background:var(--avi-bg);color:var(--avi-tx);border:1px solid var(--avi-linea)}
.chip.mal{background:var(--mal-bg);color:var(--mal-tx)}
.chip.cada-no{opacity:.5;font-style:italic}

/* ── reembolsables ────────────────────────────────────────────────── */
tr.reemb-pend td{background:var(--avi-bg)}
tr.reemb-pend td:first-child{box-shadow:inset 3px 0 0 var(--avi)}
tr.reemb-libre td{background:var(--avi-bg)}
tr.dupe td{background:var(--mal-bg)}
tr.dupe td:first-child{box-shadow:inset 3px 0 0 var(--mal)}
.pbt.reemb{border-color:var(--avi-linea);background:var(--avi-bg);color:var(--avi-tx);opacity:1}
.pbt.reemb.ok{border-color:var(--ok-bg);background:var(--ok-bg);color:var(--ok-tx)}
tr:hover .pbt.reemb{border-color:var(--avi-linea)}
.rb-it{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--linea);
  border-radius:6px;margin-bottom:6px;background:var(--card2)}
.rb-it .rb-d{flex:1;min-width:0}

<script>
"use strict";
/* =============================================================================
   FINANZAS DEL HOGAR · un solo archivo, sin servidor, sin internet.

   REGLA 1 — SOLO LOS MOVIMIENTOS SON DINERO.
   El único lugar de todo el archivo donde se calcula plata es totales().
   Suma exclusivamente state.movimientos de la ventana activa. Ninguna otra
   tabla (permanentes, presupuestos, "con cuánto cuento") entra jamás en esa
   resta. Un permanente es una PLANTILLA: existe para crear un movimiento, no
   es un monto por su cuenta. Así fue el error de −35 mil de la app anterior.

   REGLA 2 — LA APP SUGIERE, VICTOR DECIDE.
   Nada se marca solo. La casilla de un permanente arranca desmarcada siempre.

   REGLA 3 — CADA VENTANA ES BORRÓN Y CUENTA NUEVA.
   Ningún saldo, ahorro ni deuda cruza de una ventana a otra. Lo único que
   cruza es información de referencia (cómo se categorizó algo parecido).
============================================================================= */

/* Rubros y categorías de ingreso tomados de los archivos de Victor
   (semilla_junjul.json y las hojas "Listas Validadas" de sus dos Excel).
   Solo se usan cuando la lista está vacía; a partir de ahí manda la suya.
   Todo es editable: se renombra, se agrega y se quita desde la app. */
var CAT_E_BASE=["Despensa","Servicio Publico","Escuela","Salud y estetica","Farmacia","Combustible",
  "Entretenimiento","Comida Rapida","Niños (no urgencia)","Mantenimiento Carros","Mantenimiento Casa",
  "Vestimenta","Formación","Intrinsecos/mandados","Regalos","Donación","Gusto Culposo","Reembolsable",
  "Prestamo","Alquiler","Financiamiento","Viajes/Paseos/Festejos","Reembolso Abuelos","Otros Gastos",
  "Suscripciones","Ahorro","Abono a Capital MqV","Descuentos/Reembolsos","Sin categoría"];
var CAT_I_BASE=["Salario Victor","Salario Giselle BBB","Alquiler El Bosque","Iris","Servicios papás+Lav",
  "Regalo","Reembolsables","Negocio/Ventas","Otros"];

/* El préstamo que ya existe, cargado del estado de cuenta de la cooperativa
   (09/04/2026). Todo es editable y se pueden agregar otros a mano.
   La transferencia mensual es L 11,802.68, pero al préstamo solo entra la cuota
   de L 11,477.68: los L 325.00 restantes son aporte a la cooperativa y ese
   control no se lleva aquí. El gasto se registra completo; el préstamo usa la cuota. */
var PRESTAMO_BASE=[{
  id:"pMqV1", nombre:"Prestamo MqV 1", entidad:"Cooperativa Más Que Vencedores",
  numero:"01010802005182",
  monto:800000, tasaAnual:12, plazo:120, desembolso:"2021-04-30",
  cuota:11477.68, aporte:325, diaPago:30,
  catCuota:"Prestamo", catAbono:"Abono a Capital MqV",
  fechaRef:"2026-03-30", saldoRef:521968.83, cuotasRef:59, intRef:399348.95,
  nota:"Estado de cuenta al 09/04/2026. Transferencia mensual L 11,802.68 = cuota L 11,477.68 + aporte cooperativa L 325.00."
}];

/* ---------- almacenamiento ---------- */
var LLAVE="finanzasHogarRodVit_v1", sinDisco=false, memoria=null;
function leerDisco(){
  try{ return localStorage.getItem(LLAVE); }
  catch(e){ sinDisco=true; return memoria; }
}
function guardar(){
  var ts=Date.now();
  try{ localStorage.setItem(LLAVE, JSON.stringify(S)); localStorage.setItem(LLAVE+"_ts", String(ts)); }
  catch(e){ sinDisco=true; memoria=JSON.stringify(S); }
  nubeGuardar(ts);   // además del local, sube una copia a la nube con la misma marca de tiempo
}

/* ---------- respaldo en la nube (Firestore) ----------
   Sin login: todo se guarda en un único documento fijo. El local (localStorage)
   sigue siendo la fuente principal y el respaldo cuando no hay internet; la nube
   permite recuperar los datos desde otro dispositivo o si se borra el navegador. */
var NUBE_OK=false, nubeDB=null, nubeRef=null, nubeTimer=null, aplicandoNube=false;
var nubeAuth=null, SESION=false;
var CORREO_FIJO="victor@finanzas.app";   // correo interno fijo; el usuario solo escribe su PIN
(function initFirebase(){
  try{
    var firebaseConfig = {
      apiKey: "AIzaSyBPrBSABs0WJ7uVXtchPPcksvVEsR5DoDA",
      authDomain: "finanzas-del-hogar-182ca.firebaseapp.com",
      projectId: "finanzas-del-hogar-182ca",
      storageBucket: "finanzas-del-hogar-182ca.firebasestorage.app",
      messagingSenderId: "213840250422",
      appId: "1:213840250422:web:417a7fa0689e08b9e4fa97"
    };
    firebase.initializeApp(firebaseConfig);
    nubeDB = firebase.firestore();
    nubeRef = nubeDB.collection("finanzas").doc("estado");  // documento único
    nubeAuth = firebase.auth();
    NUBE_OK = true;
  }catch(e){ NUBE_OK=false; }
})();

/* =============================================================================
   TARJETAS · SOLO REFERENCIA
   -----------------------------------------------------------------------------
   Fechas de corte y de pago máximo, y los beneficios de cada tarjeta. Es una
   libreta, no una cuenta: NINGÚN dato de acá entra en totales(), ni en el
   presupuesto, ni en pronóstico alguno. No hay cálculo de cashback, ni tope
   consumido, ni "ya te toca pagar". Se edita a mano y se deja escrito.

   Vive en S.tarjetas para que una app satélite lea el mismo documento y pueda,
   por su cuenta, deducir en qué ventana cae cada tarjeta a partir del corte.
   El nombre debe coincidir con el de la forma de pago para poder cruzarlos.
============================================================================= */
function tarjetaVacia(){
  /* tope: UNO por tarjeta. Si la tarjeta da beneficio en varios rubros, todos
     acumulan contra el mismo tope; no hay un tope por rubro. */
  return {id:"tj"+id(), nombre:"", corte:null, pago:null, limite:0, limMon:"Lps",
          tope:0, benes:[], nota:""};
}
/* Las tres tarjetas que Victor dictó, escritas UNA sola vez como si las hubiera
   cargado él. Si ya existe una tarjeta cuyo nombre contiene la clave, se le
   completan los datos y se le respeta el nombre (para no romper el cruce con la
   forma de pago); si no existe, se crea. Después de eso queda todo a su mano:
   lo que edite o borre no vuelve a aparecer. */
var TJ_DICTADAS=[
  {clave:"economia", nombre:"EconoMía BAC", corte:12, pago:3, tope:1200,
   benes:[{que:"Supermercados",pct:7,tipo:"cashback"},
          {que:"Educación",    pct:7,tipo:"cashback"}]},
  {clave:"gascard",  nombre:"GasCard BAC",  corte:9,  pago:30, tope:300,
   benes:[{que:"Gasolineras",  pct:7,tipo:"descuento"}]},
  {clave:"promerica",nombre:"Promérica",    corte:19, pago:10, tope:1300,
   benes:[{que:"Supermercados",pct:7,tipo:"cashback"},
          {que:"Farmacias",    pct:7,tipo:"cashback"}]}
];
function sembrarTarjetasDictadas(){
  TJ_DICTADAS.forEach(function(d){
    var t=(S.tarjetas||[]).filter(function(x){
      return tjClave(x.nombre).replace(/\s+/g,"").indexOf(d.clave)>=0;
    })[0];
    if(!t){ t=tarjetaVacia(); t.nombre=d.nombre; S.tarjetas.push(t); }
    t.corte=d.corte; t.pago=d.pago; t.tope=d.tope;
    t.benes=d.benes.map(function(b){ return {que:b.que,pct:b.pct,tipo:b.tipo}; });
  });
}
function tjClave(s){                      /* "Promérica" y "Promerica" son la misma */
  var t=String(s||"").toLowerCase().trim();
  try{ t=t.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }catch(e){}
  return t;
}
function normalizaTarjetas(){
  if(!Array.isArray(S.tarjetas)) S.tarjetas=[];
  S.tarjetas=S.tarjetas.map(function(x){
    var t = (typeof x==="string") ? {nombre:x} : (x||{});
    var r=tarjetaVacia();
    r.id     = t.id||r.id;
    r.nombre = t.nombre||"";
    r.corte  = (t.corte===0||t.corte)?+t.corte:null;
    r.pago   = (t.pago===0||t.pago)?+t.pago:null;
    r.limite = red(+t.limite||0);
    /* El límite se guarda EN SU MONEDA, no convertido. Es una referencia que se
       consulta durante meses: si se sellara en lempiras al cambio de hoy,
       quedaría viejo mañana. Los movimientos sí se convierten al capturar,
       porque son dinero; esto no lo es. */
    r.limMon = (FX_MONEDAS.indexOf(t.limMon)>=0) ? t.limMon : "Lps";
    r.nota   = t.nota||"";
    r.benes  = Array.isArray(t.benes)? t.benes.map(function(b){
      return {que:(b&&b.que)||"", pct:(b&&+b.pct)||0,
              tipo:(b&&b.tipo==="descuento")?"descuento":"cashback"};
    }) : [];
    /* Migración: antes el tope estaba en cada beneficio. Como en realidad es uno
       solo para toda la tarjeta, se sube el mayor de los que hubiera. */
    r.tope = red(+t.tope||0);
    if(!r.tope && Array.isArray(t.benes)){
      t.benes.forEach(function(b){ var v=red(+(b&&b.tope)||0); if(v>r.tope) r.tope=v; });
    }
    return r;
  });
  if(!S.tjPref||typeof S.tjPref!=="object"||Array.isArray(S.tjPref)) S.tjPref={};
  if(!S.tjPago||typeof S.tjPago!=="object"||Array.isArray(S.tjPago)) S.tjPago={};
  if(!S.prefs) S.prefs={};
  if(!S.prefs.tjDictadas){ sembrarTarjetasDictadas(); S.prefs.tjDictadas=true; }
}
/* Tarjeta preferida por rubro. Un rubro, una tarjeta. Se guarda por NOMBRE de
   tarjeta —no por id— porque es el mismo texto que llevan los movimientos en
   "pago", así que una app satélite puede cruzarlos sin traducir nada.
   La app madre no usa esto para nada: no preselecciona ni sugiere al capturar. */
function tjPref(){ if(!S.tjPref||typeof S.tjPref!=="object") S.tjPref={}; return S.tjPref; }
function tjPrefRubros(){ return Object.keys(tjPref()); }
/* ¿Marqué yo el corte de esta tarjeta como pagado, en ESTA ventana?
   Es una marca a mano y nada más. No mueve un centavo, no crea movimiento, no
   entra en totales() y no se deduce de ninguna fecha (regla 3): si no lo marco,
   está pendiente, aunque el día de pago ya haya pasado. Es por ventana, así que
   no se arrastra a la siguiente (regla 4). */
function tjPagoK(k){ if(!S.tjPago[k]) S.tjPago[k]={}; return S.tjPago[k]; }
function tjPagado(k,nombre){ return tjPagoK(k)[nombre]===true; }
function tjMarcaPago(k,nombre,on){
  var m=tjPagoK(k);
  if(on) m[nombre]=true; else delete m[nombre];
  guardar();
}
function tarjetaDe(tid){ return (S.tarjetas||[]).filter(function(t){ return t.id===tid; })[0]||null; }
function diaTxt(n){ return (n===0||n)?String(n):"—"; }

/* ---------- ESTADO DEL RESPALDO (solo informa, no decide nada) ----------
   Un rótulo discreto en la cabecera que dice si lo último que se escribió ya
   subió. Antes el fallo de subida se tragaba en silencio: si las reglas de
   Firestore quedaban mal, la app parecía guardar y no guardaba. Esto no cambia
   qué se sube ni cuándo; solo lo hace visible. Clic = comprobar ahora. */
var NUBE_EST="", NUBE_HORA=0, NUBE_MSG="";
function nubeEstado(est,msg){
  NUBE_EST=est; NUBE_MSG=msg||"";
  if(est==="ok") NUBE_HORA=Date.now();
  pintaNube();
}
function horaCorta(ms){
  if(!ms) return "—";
  var d=new Date(ms);
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function pintaNube(){
  var c=document.getElementById("nubeCaja"); if(!c) return;
  var txt, cls="", tit;
  if(NUBE_EST==="pend"){ txt="pendiente"; cls="esp";
    tit="Hay un cambio esperando a subir. Sube solo, en menos de un segundo."; }
  else if(NUBE_EST==="sube"){ txt="subiendo"; cls="esp";
    tit="Escribiendo en la nube en este momento."; }
  else if(NUBE_EST==="ok"){ txt=horaCorta(NUBE_HORA);
    tit="Última escritura confirmada por la nube a las "+horaCorta(NUBE_HORA)+"."; }
  else if(NUBE_EST==="mal"){ txt="sin subir"; cls="mal";
    tit="La nube RECHAZÓ la escritura"+(NUBE_MSG?" ("+NUBE_MSG+")":"")+
        ". Lo local está a salvo, pero este dispositivo es el único que lo tiene. "+
        "Suele ser un problema de reglas de Firestore o de internet."; }
  else if(NUBE_EST==="off"){ txt="sin sesión"; cls="esp";
    tit="Sin sesión activa: no se está respaldando nada."; }
  else { txt="—"; cls="esp"; tit="Todavía no se ha escrito nada en esta sesión."; }
  c.innerHTML='<button class="nb-b" data-acc="nube-check" data-t="nubeBtn" title="'+esc(tit)+
    ' &middot; Clic para comprobar ahora.">'+
    '<span class="nb-m">NUBE</span><span class="nb-v '+cls+'" data-t="nubeVal">'+esc(txt)+'</span></button>';
}
/* Comprobar ahora: escribe el estado actual sin esperar el retraso. Sirve para
   confirmar que las reglas dejan escribir, sin tener que tocar un número. */
function nubeVerificar(){
  if(!NUBE_OK || !SESION){ nubeEstado("off"); return; }
  clearTimeout(nubeTimer);
  nubeEstado("sube");
  try{
    nubeRef.set({ datos: JSON.stringify(S), ts: Date.now() })
           .then(function(){ nubeEstado("ok"); })
           .catch(function(e){ nubeEstado("mal",(e&&e.code)||""); });
  }catch(e){ nubeEstado("mal","local"); }
}

// sube el estado a la nube (con un pequeño retraso para no escribir en cada tecla)
function nubeGuardar(ts){
  if(!NUBE_OK || !SESION || aplicandoNube) return;
  clearTimeout(nubeTimer);
  var t = ts || Date.now();
  nubeEstado("pend");
  nubeTimer = setTimeout(function(){
    nubeEstado("sube");
    try{
      nubeRef.set({ datos: JSON.stringify(S), ts: t })
             .then(function(){ nubeEstado("ok"); })
             .catch(function(e){ nubeEstado("mal",(e&&e.code)||""); /* sin internet: queda solo el local */ });
    }catch(e){ nubeEstado("mal","local"); }
  }, 800);
}

// al abrir: si la nube tiene una versión más reciente que la local, la adopta.
// Corre en segundo plano; la app ya abrió con los datos locales.
function sincronizarDesdeNube(){
  if(!NUBE_OK || !SESION) return;
  var tsLocal=0;
  try{ tsLocal = parseInt(localStorage.getItem(LLAVE+"_ts")||"0",10)||0; }catch(e){}
  nubeRef.get().then(function(doc){
    if(NUBE_EST!=="mal") nubeEstado("ok");   // la lectura pasó: las reglas dejan leer
    if(!doc || !doc.exists) return;
    var d=doc.data(); if(!d || !d.datos) return;
    var tsNube = d.ts||0;
    if(tsNube > tsLocal){                       // la nube es más nueva → adoptarla
      var obj=null;
      try{ obj=JSON.parse(d.datos); }catch(e){ return; }
      if(obj && typeof obj==="object" && Array.isArray(obj.movimientos)){
        aplicandoNube=true;
        S=obj; cargarNormaliza();
        try{ localStorage.setItem(LLAVE, JSON.stringify(S)); localStorage.setItem(LLAVE+"_ts", String(tsNube)); }catch(e){}
        aplicandoNube=false;
        render();
        try{ toast("Datos recuperados desde la nube", 4000); }catch(e){}
      }
    }
  }).catch(function(e){ nubeEstado("mal",(e&&e.code)||""); /* sin internet: se queda con lo local */ });
}

/* ---------- login con PIN (protege la nube de verdad) ----------
   Por dentro usa el login real de Firebase (correo fijo + PIN como contraseña).
   El usuario solo ve y escribe su PIN. Sin sesión válida, Firestore no deja
   leer ni escribir (según las reglas: allow if request.auth != null). */
function pantallaPIN(mensaje){
  var ov=document.getElementById("pinOverlay");
  if(!ov){
    ov=document.createElement("div");
    ov.id="pinOverlay";
    ov.style.cssText="position:fixed;inset:0;z-index:99999;background:#17171a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:inherit;padding:24px";
    ov.innerHTML=
      '<div style="color:#eaeaea;font-size:20px;font-weight:700;letter-spacing:.02em">Finanzas del Hogar</div>'+
      '<div style="color:#9a9aa2;font-size:13px">Ingresa tu PIN para entrar</div>'+
      '<input id="pinInput" type="password" inputmode="numeric" maxlength="6" autocomplete="off" '+
        'style="width:180px;text-align:center;font-size:26px;letter-spacing:10px;padding:12px 10px;border-radius:12px;border:1px solid #33333a;background:#1f1f24;color:#fff;outline:none" '+
        'placeholder="••••••">'+
      '<button id="pinBtn" style="width:180px;padding:12px;border:none;border-radius:12px;background:#3b82f6;color:#fff;font-size:15px;font-weight:700;cursor:pointer">Entrar</button>'+

/* =============================================================================
   TIPO DE CAMBIO · lempiras por unidad de moneda extranjera
   -----------------------------------------------------------------------------
   Se consulta a dos fuentes públicas sin llave, en orden, y gana la primera que
   responda. Si ninguna responde (sin internet, o el navegador bloquea la
   petición desde file://) se conservan las últimas tasas conocidas y quedan
   editables a mano. La app nunca se bloquea por esto.

   REGLA: la conversión ocurre AL CAPTURAR, no al mostrar. Todo movimiento se
   guarda en lempiras y la nota conserva el importe original y la tasa aplicada.
   Cambiar la tasa después NO reescribe nada de lo ya registrado.
============================================================================= */
var FX_MONEDAS=["USD","CAD","EUR"];
var FX_FUENTES=[
  {id:"jsdelivr",  url:"https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json", lee:leeFawaz},
  {id:"cloudflare",url:"https://latest.currency-api.pages.dev/v1/currencies/usd.json",                          lee:leeFawaz},
  {id:"er-api",    url:"https://open.er-api.com/v6/latest/USD",                                                 lee:leeErApi}
];
function leeFawaz(d){
  var u=d&&d.usd; if(!u||!u.hnl) return null;
  return {USD:+u.hnl, CAD:u.cad?+u.hnl/+u.cad:null, EUR:u.eur?+u.hnl/+u.eur:null, fecha:d.date||""};
}
function leeErApi(d){
  var r=d&&d.rates; if(!d||d.result!=="success"||!r||!r.HNL) return null;
  return {USD:+r.HNL, CAD:r.CAD?+r.HNL/+r.CAD:null, EUR:r.EUR?+r.HNL/+r.EUR:null,
          fecha:(d.time_last_update_utc||"").slice(5,16)};
}
function fxOk(){ return !!(S.fx&&+S.fx.USD>0); }
function fxTasa(mon){
  if(!mon||mon==="Lps"||mon==="HNL") return 1;
  var v=S.fx&&+S.fx[mon];
  return (v>0)? v : null;
}
function fxViejo(){                       /* ¿la tasa es de otro día? */
  if(!S.fx||!S.fx.fecha) return true;

}
var fxCargando=false;
function fxActualizar(manual){
  if(fxCargando) return;
  fxCargando=true; pintaFX();
  var i=0;
  function intenta(){
    if(i>=FX_FUENTES.length){
      fxCargando=false; pintaFX();
      if(manual) toast("Sin conexión con las fuentes de tipo de cambio · se conservan las últimas tasas",6000);
      return;
    }
    var f=FX_FUENTES[i++], ctl=null, corte=null;
    try{ ctl=new AbortController(); corte=setTimeout(function(){ try{ctl.abort();}catch(e){} },8000); }catch(e){}
    fetch(f.url, ctl?{signal:ctl.signal,cache:"no-store"}:{cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
      .then(function(d){
        if(corte) clearTimeout(corte);
        var t=f.lee(d);
        if(!t||!(t.USD>0)) throw new Error("respuesta sin HNL");
        FX_MONEDAS.forEach(function(m){ if(t[m]>0) S.fx[m]=Math.round(t[m]*10000)/10000; });
        S.fx.fecha=t.fecha||hoyISO(); S.fx.src=f.id; S.fx.ts=new Date().toISOString();
        fxCargando=false; guardar();
        /* Solo se repinta el widget: un render completo borraría una grilla de
           pegado a medio llenar si la respuesta llega mientras se trabaja. */
        pintaFX();
        if($('[data-t="modalFX"]')) abreFX();
        if(manual) toast("Tipo de cambio actualizado · USD "+fmtTasa(S.fx.USD),4000);
      })
      .catch(function(){ if(corte) clearTimeout(corte); intenta(); });
  }
  intenta();
}
function fmtTasa(v){ return (v==null||!(v>0))? "—" : (Math.round(v*10000)/10000).toFixed(4); }
/* Una tasa lleva 4 decimales, no 2: parseMonto redondearía 26.8250 a 26.83. */
function parseTasa(s){
  var c=String(s||"").replace(/[^0-9.,]/g,"").replace(/,/g,"");
  var n=parseFloat(c);
  return isNaN(n)?0:Math.round(n*10000)/10000;
}
function fxOrigen(){
  var m={jsdelivr:"currency-api (jsDelivr)", cloudflare:"currency-api (Cloudflare)",
         "er-api":"ExchangeRate-API", manual:"captura manual", inicial:"valor inicial"};

/* ---------- utilería ---------- */
function K(a,p){ return a+"|"+p; }
function kAct(){ return K(S.ui.anio,S.ui.per); }
function cts(n){ return Math.round((+n||0)*100); }
function red(n){ return Math.round(n*100)/100; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function id(){ return "m"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function hoyISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmt(n,signo){
  n=red(+n||0);
  var neg=n<0, a=Math.abs(n).toFixed(2).split("."),
      ent=a[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return (neg?"−":(signo?"+":""))+"L "+ent+"."+a[1];
}
function fmtF(f){
  if(!f) return "";
  var p=String(f).split("-"); if(p.length!==3) return f;
  return p[2]+"/"+p[1]+"/"+p[0];
}

/* =============================================================================
   >>> EL ÚNICO CÁLCULO DE DINERO DE TODA LA APP <<<
   me queda = ingresos de la ventana − gastos de la ventana. Nada más entra.
============================================================================= */
function movsDe(k){ return S.movimientos.filter(function(m){ return m.k===k; }); }
function totales(k){
  var i=0,e=0;
  movsDe(k).forEach(function(m){
    var c=cts(m.monto);
    if(m.tipo==="Ingreso") i+=c; else e+=c;
  });
  return {ing:i/100, egr:e/100, queda:(i-e)/100};
}
/* Ahorro apartado: también sale de los movimientos, del rubro de ahorro.
   El nombre del rubro NO está clavado: si se renombra en la pestaña Presupuesto, la
   baldosa sigue al rubro renombrado en vez de quedarse en cero en silencio. */
function catAhorro(){ return S.prefs.rubroAhorro || "Ahorro"; }
function movsAhorro(k){ var c=catAhorro();
  return movsDe(k).filter(function(m){ return m.tipo==="Egreso" && m.cat===c; }); }
function totAhorro(k){ var c=0; movsAhorro(k).forEach(function(m){ c+=cts(m.monto); }); return c/100; }

/* ---------- permanentes: CADA VENTANA TIENE LA SUYA ----------
   La lista no es global. Cada ventana guarda su propio listado, que se HEREDA de
   la ventana anterior cuando se crea. A partir de ahí es independiente: si pausás
   una suscripción o quitás un financiamiento, eso vale para esa ventana en
   adelante y no reescribe el pasado. Es la misma idea de borrón y cuenta nueva.
   El check de cada permanente no se guarda acá: vive en el movimiento que crea
   (movDePerm). Sin movimiento, no hay check, y sin check no hay gasto.          */
function permsK(k){ if(!S.perms[k]) S.perms[k]=[]; return S.perms[k]; }
function permActivo(f){ return f.activo!==false; }
function permsActivos(k){ return permsK(k).filter(permActivo); }
function movDePerm(k,pid){ return movsDe(k).filter(function(m){ return m.permId===pid; })[0]||null; }
/* Pronóstico: permanentes de EGRESO activos, con monto, que todavía no tienen
   movimiento. Se muestra APARTE. Nunca entra en totales(). */
/* ¿ESTE COBRO TOCA AHORA?
   Un mensual toca siempre. Uno trimestral o semestral toca cuando su próximo
   cobro ya llegó — y ese próximo se cuenta desde el ÚLTIMO PAGO REGISTRADO
   (ver proximoCobro), nunca desde el calendario a secas. Si todavía no hay
   ningún pago registrado ni mes base, no hay de dónde saberlo y se cuenta.

   Es lo único que decide por fecha, y decide una PREVISIÓN: si un cobro
   trimestral no toca este mes, no tiene sentido listarlo como pendiente ni
   presupuestarlo. El saldo real no lo mira nunca — sale solo de totales(). */
function permToca(f){
  if(cadaDe(f)<=1) return true;
  var px=proximoCobro(f);
  if(!px.mes) return true;
  return px.mes <= mesDe(hoyISO());
}
function permsPendientes(k){
  return permsActivos(k).filter(function(f){
    return (f.tipo||"Egreso")==="Egreso" && (+f.monto||0)>0 && !movDePerm(k,f.id) && permToca(f);
  });
}
function permsDeRubro(k,cat){
  return permsActivos(k).filter(function(p){
    return (p.tipo||"Egreso")!=="Ingreso" && (p.cat||"Sin categoría")===cat && permToca(p);
  });
}
/* Los que existen pero este período no tocan: se muestran aparte para que no
   parezca que la app se los comió. */
function permsNoTocan(k){
  return permsActivos(k).filter(function(f){
    return (f.tipo||"Egreso")==="Egreso" && (+f.monto||0)>0 && !movDePerm(k,f.id) && !permToca(f);
  });
}
/* Los alias aprendidos son información de referencia, no dinero: por eso viven
   fuera de la ventana y se comparten entre todas. */
function aliasDe(pid){ return (S.alias&&S.alias[pid])||[]; }
/* ¿La última cuota de este financiamiento ya quedó atrás para esta ventana? */
function cuotaVencida(f,k){
  var uc=f.ultimaCuota||f.hasta; if(!uc) return false;
  var q=String(uc).split("-"), aa=parseInt(q[0],10), mm=parseInt(q[1],10);
  if(isNaN(aa)||isNaN(mm)) return false;
  var kp=String(k).split("|"), i=PERIODOS.indexOf(kp[1]);
  if(i<0) return false;
  return (aa*12+(mm-1)) < (parseInt(kp[0],10)*12+i);   /* venció antes del 1er mes */
}
/* =============================================================================
   PERIODICIDAD · cobros que no son mensuales

   Hay suscripciones y servicios que se cobran cada 2, 3, 6 o 12 meses. Marcarlo
   sirve para dos cosas: saber cuándo toca el próximo, y que el aviso salte a
   tiempo. Para nada más.

   DE DÓNDE SALE EL "PRÓXIMO": del ÚLTIMO PAGO REGISTRADO, no del calendario.
   El último pago es el movimiento más reciente ligado a este permanente, en
   cualquier ventana. Si nunca se registró uno, se usa el mes base que él
   escriba a mano. Un pago que no está registrado no cuenta — REGLA 3.

   POR QUÉ NO SE TOCA LA PROYECCIÓN: las ventanas son un mosaico de fechas de
   corte de tarjetas y se solapan (Jun-Jul y Jul-Ago comparten julio), así que
   NO se puede decidir con certeza en qué ventana cae un cobro trimestral.
   Adivinarlo movería compromisos con una fecha, que es justo lo que la app no
   hace. Un cobro que este período no toca se saca con la PAUSA — un clic, y la
   decisión es suya.
============================================================================= */
var CADAS=[{v:1,t:"mensual"},{v:2,t:"cada 2 meses"},{v:3,t:"trimestral"},
           {v:4,t:"cada 4 meses"},{v:6,t:"semestral"},{v:12,t:"anual"}];
function cadaDe(f){ var n=parseInt(f&&f.cada,10); return (n>=1&&n<=12)?n:1; }
function cadaTxt(n){
  for(var i=0;i<CADAS.length;i++) if(CADAS[i].v===n) return CADAS[i].t;
  return "cada "+n+" meses";
}
/* El pago registrado más reciente de este permanente, mirando TODAS las
   ventanas: un trimestral se pagó hace dos ventanas, no en esta. */
function ultimoPagoPerm(pid){
  var mej=null;
  S.movimientos.forEach(function(m){
    if(m.permId!==pid || !m.fecha) return;
    if(!mej || String(m.fecha)>String(mej.fecha)) mej=m;
  });
  return mej;
}
function proximoCobro(f){
  var n=cadaDe(f);
  var mv=ultimoPagoPerm(f.id);
  var base=mv? mesDe(mv.fecha) : (/^\d{4}-\d{2}$/.test(String(f.mesBase||""))? f.mesBase : "");
  if(!base) return {mes:"", desde:null, n:n};
  return {mes:mesMas(base,n), desde:(mv?"pago":"base"), base:base, n:n, mov:mv};
}

/* =============================================================================
   AVISO DE ÚLTIMO COBRO · suscripciones con fecha de corte

   "Quiero mantener esta suscripción 3 meses más y que me avise 2 días antes
   del último cobro que pienso pagar."

   Es el único lugar donde una fecha decide algo — y lo que decide NO es plata:
   decide si se muestra un recordatorio. REGLA 3 intacta: la fecha sirve para
   avisar, nunca para dar por hecho un pago. El aviso no marca el permanente,
   no lo pausa, no presupuesta y no suma en ningún total. Solo aparece. Dar de
   baja lo hace él, cuando quiera, con un clic.

   Campos que agrega, todos opcionales:
     ultimaCuota  aaaa-mm  el mes del último cobro que quiere pagar (ya existía)
     avisoDia     1..31    el día de ese mes en que cae el cobro
     avisoDias    0..90    con cuántos días de anticipación avisar
============================================================================= */
function diasDelMes(ym){
  var p=String(ym||"").split("-"), a=parseInt(p[0],10), m=parseInt(p[1],10);
  if(isNaN(a)||isNaN(m)) return 31;
  return new Date(a,m,0).getDate();          /* día 0 del mes siguiente = último */
}
/* Fecha del cobro: mes de la última cuota + día típico. Un día 31 en un mes de
   30 se recorta al último día real; no se inventa una fecha que no existe. */
/* El mes del cobro que se va a recordar. Dos casos, en este orden:
     1 · hay una "última cuota que quiero pagar" → esa (para dar de baja);
     2 · el cobro es periódico → el próximo, contado desde el último pago
         REGISTRADO (nunca desde el calendario). */
function avisoMes(f){
  if(!f) return {mes:"", tipo:""};
  var uc=String(f.ultimaCuota||f.hasta||"").slice(0,7);
  if(/^\d{4}-\d{2}$/.test(uc)) return {mes:uc, tipo:"ultima"};
  if(cadaDe(f)>1){
    var px=proximoCobro(f);
    if(px.mes) return {mes:px.mes, tipo:"proximo", px:px};
  }
  return {mes:"", tipo:""};
}
function avisoFecha(f){
  if(!f) return "";
  var am=avisoMes(f);
  if(!am.mes) return "";
  var d=parseInt(f.avisoDia,10);
  if(isNaN(d)||d<1) d=parseInt(f.diaTipico,10);
  if(isNaN(d)||d<1) return "";
  return am.mes+"-"+String(Math.min(d,diasDelMes(am.mes))).padStart(2,"0");
}
function diasHasta(iso){
  var p=String(iso||"").split("-");
  if(p.length<3) return null;
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  if(isNaN(d.getTime())) return null;
  var n=new Date(); n=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.round((d-n)/86400000);
}
function avisoDe(f){
  if(!f||f.avisoDias==null||f.avisoDias==="") return null;
  var fe=avisoFecha(f); if(!fe) return null;
  var n=parseInt(f.avisoDias,10); if(isNaN(n)||n<0) n=0;
  var d=diasHasta(fe); if(d==null) return null;
  return {fecha:fe, dias:d, antes:n, activo:(d<=n), vencido:(d<0)};
}
function avisosVivos(k){
  return permsK(k||kAct()).filter(function(f){
    if(!permActivo(f)) return false;
    var a=avisoDe(f); return !!(a&&a.activo);
  }).sort(function(a,b){ return String(avisoFecha(a)).localeCompare(String(avisoFecha(b))); });
}
function avisoCuando(a){
  if(a.dias>1)  return "faltan "+a.dias+" días";
  if(a.dias===1)return "es mañana";
  if(a.dias===0)return "es hoy";
  if(a.dias===-1)return "fue ayer";
  return "fue hace "+(-a.dias)+" días";
}
function fmtFecha(iso){
  var p=String(iso||"").split("-");
  return p.length<3? String(iso||"") : p[2]+"/"+p[1]+"/"+p[0];
}
function fmtTS(ts){
  var d=new Date(ts||"");
  if(isNaN(d.getTime())) return "—";
  function dd(n){ return (n<10?"0":"")+n; }
  return dd(d.getDate())+"/"+dd(d.getMonth()+1)+"/"+d.getFullYear()+" "+dd(d.getHours())+":"+dd(d.getMinutes());
}
function nomVentana(k){ var p=String(k||"").split("|"); return p[1]? (p[1]+" "+p[0]) : String(k||""); }
function ventanaPrevia(k){
  ordenaVentanas();
  var i=-1;
  S.ventanas.forEach(function(v,j){ if(K(v.anio,v.per)===k) i=j; });
  if(i<=0) return null;
  var p=S.ventanas[i-1];
  return K(p.anio,p.per);
}
/* Heredar = copiar la lista de la ventana anterior. Se copia tal cual, incluidos
   los pausados, para que él los pueda reactivar. Nada queda marcado: el check
   depende de que exista un movimiento en ESTA ventana, y no hay ninguno. */
function heredarPermanentes(kDest,tipo){
  var kOrig=ventanaPrevia(kDest);
  if(!kOrig) return {n:0, nI:0, nE:0, vencidos:[], origen:null};
  var dest=permsK(kDest), ya={};
  dest.forEach(function(p){ ya[p.id]=1; });
  var n=0, nI=0, nE=0, vencidos=[];
  permsK(kOrig).forEach(function(p){
    if(ya[p.id]) return;
    var esIng=((p.tipo||"Egreso")==="Ingreso");
    if(tipo && (esIng!==(tipo==="Ingreso"))) return;
    var c=JSON.parse(JSON.stringify(p));
    dest.push(c); n++; if(esIng) nI++; else nE++;
    if(cuotaVencida(c,kDest)) vencidos.push(c);
  });
  return {n:n, nI:nI, nE:nE, vencidos:vencidos, origen:kOrig};
}

/* =============================================================================
   CUOTAS DE UN FINANCIAMIENTO
   Con "esta es la cuota N de M" y el mes de esa cuota, la última sale sola:
       última = mes de esta cuota + (M − N) meses
   Ese dato alimenta el aviso de última cuota vencida al heredar la lista.
============================================================================= */
var CAT_FIN="Financiamiento";
function esFinanciamiento(f){ return (f&&String(f.cat||"").trim())===CAT_FIN; }
function mesMas(ym,k){
  var p=String(ym||"").split("-"), a=parseInt(p[0],10), m=parseInt(p[1],10);
  if(isNaN(a)||isNaN(m)) return "";
  var t=a*12+(m-1)+(+k||0);
  return Math.floor(t/12)+"-"+String((t%12)+1).padStart(2,"0");
}
/* El banco suele escribir la cuota en la descripción:
   "EXT18CUOTA: 10/"  →  10 de 18       "MINICUOTAS 12M CUOTA:02/12"  →  2 de 12 */
/* El plazo va primero: "EXT18CUOTA: 10/" y "MINICUOTAS 12M CUOTA:02/12" dicen el
   total antes que la cuota. Si se leyera "10/" como 10 de 1, saldría al revés. */
function leeCuotas(desc){
  var t=String(desc||"").toUpperCase(), m, r=null;
  if(m=t.match(/EXT\s*(\d{1,3})\s*M?\s*CUOTA[:\s]*(\d{1,3})/))      r={actual:+m[2], total:+m[1]};
  else if(m=t.match(/(\d{1,3})\s*M\b[\s\S]*?CUOTA[:\s]*(\d{1,3})/)) r={actual:+m[2], total:+m[1]};
  else if(m=t.match(/CUOTA[:\s]*(\d{1,3})\s*\/\s*(\d{1,3})\b/))     r={actual:+m[1], total:+m[2]};
  if(!r) return null;
  if(r.total>0 && r.actual>r.total) r.total=0;    /* lectura incoherente: el total no se sabe */
  return r;
}
/* Solo pregunta si no sabe cuándo termina. Si la última cuota ya está cargada
   —a mano o venida de un respaldo— no hay nada que preguntar. */
function faltaCuotas(f){
  return esFinanciamiento(f) && !(+f.cuotasTotal>0) && !(f.ultimaCuota||f.hasta);
}
/* ── CUÁNTAS CUOTAS SE LLEVAN PAGADAS ─────────────────────────────────────
   No se cuenta por calendario. Se cuenta plata:
       pagadas = el ancla que él declaró ("esta es la cuota N")
               + cada movimiento que la app registró ligado a ese permanente
                 después de fijar el ancla.
   Así el número solo sube cuando hay un movimiento detrás. Si un mes no se
   registra, la cuenta no avanza — y eso es correcto: la app no lo vio.        */
function cuotasRegistradas(f){
  var n=0;
  S.movimientos.forEach(function(m){ if(m.permId===f.id) n++; });
  return n;
}
function finCuotas(f){
  var lee=leeCuotas(f.desc)||{};
  var tot=+f.cuotasTotal||lee.total||0; if(!(tot>0)) tot=null;
  var reg=cuotasRegistradas(f), ancla=0, base=0, deTexto=false;
  if(+f.cuotasAncla>0){ ancla=+f.cuotasAncla; base=+f.cuotasAnclaReg||0; }
  else if(+f.cuotaActual>0){ ancla=+f.cuotaActual; base=Math.min(reg,1); }
  else if(lee.actual>0){ ancla=lee.actual; base=Math.min(reg,1); deTexto=true; }
  var pag=ancla+Math.max(0,reg-base);
  if(tot!=null && pag>tot) pag=tot;
  return {total:tot, pagadas:(ancla?pag:null), registradas:reg, ancla:ancla, deTexto:deTexto,
          restantes:(tot!=null&&ancla)? Math.max(0,tot-pag) : null};
}
/* Abre la ventana de cuotas si corresponde. Devuelve true si la abrió. */
function pideCuotas(pid,mesSug){
  var f=permsK(kAct()).filter(function(x){ return x.id===pid; })[0];
  if(!f || !faltaCuotas(f)) return false;
  abreCuotas(pid,mesSug);
  return true;
}
/* Cuando entran varios financiamientos de un golpe hay que preguntar por TODOS,
   no solo por el primero. La cola guarda los que faltan y cada vez que se
   guarda u omite uno, se abre el siguiente. */
var colaCuotas=[];
function siguienteCuota(){
  cierraModal();
  while(colaCuotas.length){
    var pid=colaCuotas.shift();
    var p=permsK(kAct()).filter(function(x){ return x.id===pid; })[0];
    if(p && faltaCuotas(p)){ abreCuotas(pid); return true; }
  }
  return false;
}
function abreCuotas(pid,mesSug){
  var k=kAct(), f=permsK(k).filter(function(x){ return x.id===pid; })[0];
  if(!f) return;
  var lee=leeCuotas(f.desc)||{};
  var act=+f.cuotaActual||lee.actual||1;
  var tot=+f.cuotasTotal||lee.total||0;
  var mv=movDePerm(k,f.id);
  var mes=f.cuotaMes || mesSug || (mv&&mv.fecha? String(mv.fecha).slice(0,7) : hoyISO().slice(0,7));
  abreModal('<div class="mh"><h3>Cuotas del financiamiento</h3>'+
      (colaCuotas.length?'<span class="chip">faltan '+colaCuotas.length+' más</span>':'')+'<div class="sp"></div>'+
      '<button class="icb" data-acc="cerrar">×</button></div>'+
    '<div class="mb" data-t="modalCuotas" data-pid="'+esc(pid)+'">'+
      '<p class="sub" style="margin-bottom:12px">'+esc(f.desc||f.cat)+' &middot; '+fmt(f.monto)+'</p>'+
      '<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end">'+
        '<div class="campo" style="margin:0"><label title="Número de la cuota que estás registrando ahora.">Esta es la cuota</label>'+
          '<input id="cuAct" data-t="cuAct" inputmode="numeric" style="width:88px" value="'+esc(act)+'"></div>'+
        '<div class="campo" style="margin:0"><label title="Cuántas cuotas se pactaron en total.">de un total de</label>'+
          '<input id="cuTot" data-t="cuTot" inputmode="numeric" style="width:88px" value="'+(tot?esc(tot):"")+'" placeholder="?"></div>'+
        '<div class="campo" style="margin:0"><label title="Mes al que corresponde esta cuota.">Mes de esta cuota</label>'+
          '<input id="cuMes" data-t="cuMes" type="month" style="width:158px" value="'+esc(mes)+'"></div>'+
      '</div>'+
      '<div class="resumen" id="cuRes" data-t="cuRes" style="margin-top:14px"></div>'+
    '</div>'+
    '<div class="mf"><button class="btn gh" data-acc="cuotas-omitir" data-t="btnOmitirCuotas" '+
        'title="Dejar este sin datos de cuotas. Se puede cargar después con el botón ≡ de su fila en Permanentes.">Omitir</button>'+
      '<button class="btn" data-acc="cuotas-guardar" data-t="btnCuotas">Guardar cuotas</button></div>');
  pintaCuotas();
}

        '<select id="avCada" data-t="avCada" style="width:170px">'+
          CADAS.map(function(x){ return '<option value="'+x.v+'"'+(x.v===cadaDe(f)?" selected":"")+'>'+x.t+'</option>'; }).join("")+
        '</select></div>'+
      (cadaDe(f)>1? '<div class="resumen" data-t="avPeriodo" style="margin:0 0 12px">'+prTxtPeriodo(f)+'</div>' : '')+
      '<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end">'+
        '<div class="campo" style="margin:0"><label title="Cuántos cobros más pensás pagar, contando el del mes que viene como 1. Rellena el mes de al lado.">Mantenerla</label>'+
          '<div style="display:flex;align-items:baseline;gap:6px">'+
            '<input id="avN" data-t="avN" inputmode="numeric" style="width:70px" placeholder="3">'+

          '<input id="avBase" data-t="avBase" type="month" style="width:150px" value="'+esc(f.mesBase||"")+'"></div>'+
        '<div class="campo" style="margin:0"><label title="Con cuántos días de anticipación querés verlo en la pantalla Hoy.">Avisarme con</label>'+
          '<div style="display:flex;align-items:baseline;gap:6px">'+
            '<input id="avDias" data-t="avDias" inputmode="numeric" style="width:70px" value="'+esc(dias)+'">'+
            '<span class="sub">días antes</span></div></div>'+
      '</div>'+

    '</div>'+
    '<div class="mf">'+
      (f.avisoDias!=null&&f.avisoDias!==""?'<button class="btn gh" data-acc="aviso-quitar" data-t="btnQuitarAviso" '+
        'title="Deja de recordarlo. La fecha del último cobro se conserva como dato.">Quitar el aviso</button>':'')+
      '<button class="btn" data-acc="aviso-guardar" data-t="btnAviso">Guardar aviso</button></div>');

function calcAviso(){
  var mb=document.querySelector('[data-t="modalAviso"]');
  var pid=mb&&mb.getAttribute("data-pid");
  var fp=pid? permsK(kAct()).filter(function(x){return x.id===pid;})[0] : null;
  var vBase=(($("#avBase")||{}).value||"").slice(0,7);
  var cada=parseInt((($("#avCada")||{}).value||"1"),10); if(!(cada>=1)) cada=1;
  var mes=(($("#avMes")||{}).value||"").slice(0,7);
  var dia=parseInt((($("#avDia")||{}).value||""),10);
  var dias=parseInt((($("#avDias")||{}).value||""),10);
  if(isNaN(dias)||dias<0) dias=null;
  if(isNaN(dia)||dia<1||dia>31) dia=null;
  if(!/^\d{4}-\d{2}$/.test(mes)) mes="";
  /* Si no fijó un mes de corte pero el cobro es periódico, el mes lo pone el
     próximo cobro, contado desde el último pago registrado. */
  var auto="";
  if(!mes && cada>1 && fp){
    var px=proximoCobro({id:fp.id, cada:cada, mesBase:vBase||fp.mesBase});
    auto=px.mes||"";
  }
  var mUsa=mes||auto;
  var fecha=(mUsa&&dia)? mUsa+"-"+String(Math.min(dia,diasDelMes(mUsa))).padStart(2,"0") : "";
  return {mes:mes, cada:cada, auto:auto, usa:mUsa, dia:dia, dias:dias, fecha:fecha,
          faltan:fecha? diasHasta(fecha):null,
          desde:(fecha&&dias!=null)? diasHasta(fecha)-dias : null};
}
/* "Quiero mantenerla 3 cobros más" → el mes del último sale solo, contando
   desde el mes que viene. Es un atajo para llenar el mes, nada más. */
function avDesdeCobros(){
  var n=parseInt((($("#avN")||{}).value||""),10);
  var mm=$("#avMes");
  if(mm && !isNaN(n) && n>=1) mm.value=mesMas(hoyISO().slice(0,7), n);
  pintaAviso();
}
function pintaAviso(){
  var c=$("#avRes"); if(!c) return;
  var r=calcAviso();
  if(!r.fecha){ c.innerHTML='<span class="sub">'+(r.cada>1&&!r.usa
      ? 'Falta el día del cobro, o un pago registrado / mes base desde donde contar el próximo.'
      : 'Falta el mes o el día del cobro. Sin los dos no hay nada que recordar.')+'</span>'; return; }
  if(r.dias==null){ c.innerHTML='<span class="sub">Falta con cuántos días de anticipación avisar.</span>'; return; }
  var recorte=(r.dia>diasDelMes(r.mes))? ' <span class="sub">(ese mes no tiene día '+r.dia+': se toma el último)</span>':'';
  c.innerHTML=(r.mes?'Último cobro que pensás pagar: ':'Próximo cobro ('+esc(cadaTxt(r.cada))+'): ')+
    '<b>'+esc(fmtFecha(r.fecha))+'</b>'+recorte+
    '<br><span class="sub">'+(r.faltan<0
      ? 'Esa fecha ya pasó: el aviso aparece igual en Hoy hasta que lo des de baja o lo quites.'
      : 'Aparece en la pantalla Hoy '+(r.desde<=0?'desde ya':'dentro de '+r.desde+' día'+(r.desde===1?'':'s'))+
        ' &middot; '+r.dias+' día'+(r.dias===1?'':'s')+' antes del cobro')+
    '</span><br><span class="sub">No cambia ingresos, gastos, saldo real ni presupuesto.</span>';
}
function calcCuotas(){
  var a=parseInt(($("#cuAct")||{}).value,10), t=parseInt(($("#cuTot")||{}).value,10);
  var mes=($("#cuMes")||{}).value||"";
  if(isNaN(a)||a<1) a=null;
  if(isNaN(t)||t<1) t=null;
  var faltan=(a!=null&&t!=null)? (t-a) : null;
  return {act:a, tot:t, mes:mes, faltan:faltan, ultima:(faltan!=null&&mes)? mesMas(mes,faltan):""};
}
function pintaCuotas(){
  var r=$("#cuRes"); if(!r) return;
  var c=calcCuotas();
  if(c.act==null||c.tot==null||!c.mes){
    r.innerHTML='<span class="sub">Faltan datos para calcular la última cuota.</span>'; return;
  }
  if(c.faltan<0){
    r.innerHTML='<span class="tx-mal">La cuota '+c.act+' no puede ser mayor que el total de '+c.tot+'.</span>'; return;
  }
  r.innerHTML='Última cuota: <b data-t="cuUltima">'+esc(c.ultima)+'</b>'+
    ' &middot; quedan <b>'+c.faltan+'</b> cuota'+(c.faltan===1?"":"s")+' después de esta'+
    '<div class="sub" style="margin-top:5px">'+esc(c.mes)+' + ('+c.tot+' − '+c.act+') meses = '+esc(c.ultima)+
    '. Al heredar la lista, la app avisa cuando esa fecha ya quedó atrás.</div>';
}

/* =============================================================================
   PRÉSTAMOS · control propio, aparte del estado de cuenta
   No toca el dinero de ninguna ventana: es información de referencia.
   El gasto mensual se registra completo en movimientos; acá solo entra la parte
   que va a la cuota del préstamo.

   Todo arranca de un ANCLA verificable: el saldo del último estado de cuenta y
   su fecha. De ahí en adelante se amortiza mes a mes:
       interés del mes = saldo × (tasa anual / 12)
       capital del mes = cuota − interés
   Los abonos a capital NO se inventan: salen de los movimientos registrados con
   el rubro que tenga configurado el préstamo, y solo los posteriores al ancla
   (los anteriores ya están dentro del saldo de referencia).
============================================================================= */
function prTasaMes(p){ return (+p.tasaAnual||0)/100/12; }
function mesDe(f){ return String(f||"").slice(0,7); }
function mesesEntre(a,b){                       /* b − a, en meses */
  var x=String(a||"").split("-"), y=String(b||"").split("-");
  var xa=parseInt(x[0],10), xm=parseInt(x[1],10), ya=parseInt(y[0],10), ym=parseInt(y[1],10);
  if(isNaN(xa)||isNaN(xm)||isNaN(ya)||isNaN(ym)) return null;
  return (ya*12+ym)-(xa*12+xm);
}
/* Pagos REALES posteriores al ancla: movimientos registrados, nada más.
   Una cuota es un movimiento con el rubro de la cuota; un abono, uno con el
   rubro de abonos. Ordenados por fecha, que es el orden en que ocurrieron. */
function prEventos(p){
  var cq=String(p.catCuota||"").trim(), ca=String(p.catAbono||"").trim();
  var corte=String(p.fechaRef||""), ev=[];
  if(!cq&&!ca) return ev;
  S.movimientos.forEach(function(m){
    if((m.tipo||"Egreso")==="Ingreso") return;
    var f=String(m.fecha||""); if(!f || (corte && f<=corte)) return;
    var c=String(m.cat||"").trim();
    if(cq && c===cq)      ev.push({t:"cuota", fecha:f, monto:cts(m.monto), id:m.id, k:m.k, desc:m.desc||""});
    else if(ca && c===ca) ev.push({t:"abono", fecha:f, monto:cts(m.monto), id:m.id, k:m.k, desc:m.desc||""});
  });
  ev.sort(function(a,b){ return a.fecha<b.fecha?-1:(a.fecha>b.fecha?1:0); });
  return ev;
}
/* Plan de pagos en dos tramos:
     1 · REGISTRADO — un paso por cada pago que existe como movimiento. Ningún
         pago se da por hecho: si el mes no se registró, la cuenta no avanza.
     2 · PROYECTADO — de ahí en adelante, un mes por cuota. Es pronóstico y se
         muestra como tal; nunca se suma a lo pagado.
   ex = escenario del simulador: {unico:{mes,monto}, mensual, cuota}          */
function prPlan(p,ex){
  ex=ex||{};
  var i=prTasaMes(p), sal=cts(p.saldoRef), cuo=cts(p.cuota);
  var cuoP=cts(ex.cuota!=null&&ex.cuota!==""?ex.cuota:p.cuota);
  var filas=[], intReg=0, abReg=0, nCuo=0;
  if(!(sal>0)) return {filas:[], nReg:0, nCuotasReg:0, saldoHoy:red(sal/100), intReg:0, abonosReg:0,
                       n:0, interes:0, abonos:0, ultima:"", saldo:red(sal/100), corta:false};
  if(cuo>0) prEventos(p).forEach(function(e){
    if(sal<=0) return;
    if(e.t==="abono"){
      var ab=Math.min(e.monto,sal); if(ab<=0) return;
      sal-=ab; abReg+=ab;
      filas.push({mes:mesDe(e.fecha), fecha:e.fecha, reg:true, tipo:"abono",
                  mid:e.id, mk:e.k, mdesc:e.desc,
                  interes:0, capital:0, abono:ab/100, saldo:sal/100});
      return;
    }
    var it=Math.round(sal*i), cap=cuo-it;
    if(cap<0) cap=0; if(cap>sal) cap=sal;
    sal-=cap; intReg+=it; nCuo++;
    filas.push({mes:mesDe(e.fecha), fecha:e.fecha, reg:true, tipo:"cuota",
                mid:e.id, mk:e.k, mdesc:e.desc,
                interes:it/100, capital:cap/100, abono:0, saldo:sal/100});
  });
  var nReg=filas.length, saldoHoy=sal;
  /* de acá en adelante es pronóstico */
  var ultimo=filas.length? filas[filas.length-1].mes : mesDe(p.fechaRef);
  var mes=mesMas(ultimo,1), hoy=mesDe(hoyISO());
  if(mes<hoy) mes=hoy;                       /* el pronóstico no arranca en el pasado */
  var intP=0, abP=0, n=0, corta=false;
  if(cuoP>0 && mes) while(sal>0 && n<720){
    var itp=Math.round(sal*i);
    var extra=(ex.mensual?cts(ex.mensual):0)+((ex.unico&&ex.unico.mes===mes)?cts(ex.unico.monto):0);
    var cp=cuoP-itp;
    if(cp<0) cp=0;
    if(cp+extra<=0){ corta=true; break; }
    if(cp>sal){ cp=sal; extra=0; } else if(cp+extra>sal) extra=sal-cp;
    if(extra<0) extra=0;
    sal-=cp+extra; intP+=itp; abP+=extra;
    filas.push({mes:mes, reg:false, tipo:"cuota", interes:itp/100, capital:cp/100, abono:extra/100, saldo:sal/100});
    mes=mesMas(mes,1); n++;
  }
  else if(sal>0) corta=true;
  return {filas:filas, nReg:nReg, nCuotasReg:nCuo, saldoHoy:red(saldoHoy/100),
          intReg:red(intReg/100), abonosReg:red(abReg/100),
          n:n, interes:red(intP/100), abonos:red(abP/100),
          ultima:(!corta&&filas.length)? filas[filas.length-1].mes : "",
          saldo:red(sal/100), corta:corta};
}

var PERIODOS=["Ene-Feb","Feb-Mar","Mar-Abr","Abr-May","May-Jun","Jun-Jul","Jul-Ago","Ago-Sep","Sep-Oct","Oct-Nov","Nov-Dic","Dic-Ene"];
function ordenaVentanas(){
  S.ventanas.sort(function(a,b){
    if(a.anio!==b.anio) return a.anio-b.anio;
    return PERIODOS.indexOf(a.per)-PERIODOS.indexOf(b.per);
  });
}
function siguienteVentana(){

  if(!u) return {anio:new Date().getFullYear(),per:"Ene-Feb"};
