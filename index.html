}

/* ---------- categorías y presupuestos ---------- */
function catsDe(tipo){ return (tipo==="Ingreso"? S.catI : S.catE).slice(); }
function presuDe(k){ if(!S.presu[k]) S.presu[k]={}; return S.presu[k]; }
function rubrosDe(k){
  var p=presuDe(k), usadas={}, out=[];
  movsDe(k).forEach(function(m){ if(m.tipo!=="Ingreso") usadas[m.cat||"Sin categoría"]=1; });
  var nombres=S.catE.slice();
  Object.keys(usadas).forEach(function(c){ if(nombres.indexOf(c)<0) nombres.push(c); });
  Object.keys(p).forEach(function(c){ if(nombres.indexOf(c)<0) nombres.push(c); });
  permsActivos(k).forEach(function(f){ if((f.tipo||"Egreso")!=="Ingreso"){
    var c=f.cat||"Sin categoría"; if(nombres.indexOf(c)<0) nombres.push(c); } });
  nombres.forEach(function(c){
    var g=0, nm=0;
    movsDe(k).forEach(function(m){ if(m.tipo!=="Ingreso" && (m.cat||"Sin categoría")===c){ g+=cts(m.monto); nm++; } });
    /* Permanentes ACTIVOS del rubro: no son gasto todavía, pero son plata que ya
       tiene dueño. Se muestran aparte para poder presupuestar sobre ellos. */
    var pf=0, pp=0;
    permsDeRubro(k,c).forEach(function(f){
      pf+=cts(f.monto);
      if(!movDePerm(k,f.id)) pp+=cts(f.monto);
    });
    var tienePres = p[c]!=null && p[c]!=="";
    var pre = tienePres ? red(+p[c]||0) : null;
    out.push({cat:c, pres:pre, gastado:g/100, n:nm, perm:pf/100, permPend:pp/100,
              queda: pre==null?null:red(pre-g/100)});
  });
  return out;
}
/* ═════════════════ DINERO COMPROMETIDO — PRONÓSTICO, NUNCA UN GASTO ═════════
   Esto NO entra en totales(). Vive aparte y siempre rotulado como pronóstico.
   Por rubro, lo que falta por salir es lo MAYOR entre:
     · el presupuesto asignado que todavía no se gastó, y
     · los permanentes activos del rubro que todavía no se marcaron.
   Se toma el mayor, no la suma: el presupuesto de un rubro ya debería cubrir sus
   permanentes. Sumarlos sería contar el mismo dinero dos veces — que es
   exactamente como la app anterior llegó a los −35 mil.                        */
/* Ingreso que la ventana todavía espera: los ingresos permanentes activos que
   no se han marcado. Con el mismo cuidado que en los gastos — por categoría se
   descuenta lo que YA entró, porque si el ingreso se registró sin ligarlo a su
   permanente, sumarlo otra vez sería contar el mismo dinero dos veces.
   Nada de esto es dinero real: vive en la proyección. */
function ingresoPendiente(k){
  var porCat={}, det=[], tot=0;
  permsActivos(k).forEach(function(f){
    if((f.tipo||"Egreso")!=="Ingreso") return;
    if(movDePerm(k,f.id)) return;                       /* ya marcado: ya es real */
    var c=f.cat||f.desc||"Sin categoría";
    porCat[c]=(porCat[c]||0)+cts(f.monto);
  });
  var real={};
  movsDe(k).forEach(function(m){
    if((m.tipo||"Egreso")!=="Ingreso") return;
    var c=m.cat||"Sin categoría"; real[c]=(real[c]||0)+cts(m.monto);
  });
  Object.keys(porCat).forEach(function(c){
    var v=porCat[c]-(real[c]||0);
    if(v>0){ tot+=v; det.push({cat:c, esperado:porCat[c]/100, recibido:(real[c]||0)/100, val:v/100}); }
  });
  det.sort(function(a,b){ return b.val-a.val; });
  return {pendiente:tot/100, det:det};
}
/* =============================================================================
   EL PISO DE PERMANENTES DEL PRESUPUESTO

   Un permanente activo es plata que ya se sabe que hay que pagar. No es un
   gasto —solo lo es cuando su casilla se marca—, pero sí es el mínimo sensato
   que ese rubro debería tener presupuestado.

   Por eso igualar el presupuesto al gasto real NUNCA baja de ahí: a mitad de
   ventana el gasto real de un rubro puede ser 0 y su permanente L 1,686, y
   dejar el presupuesto en 0 sería decir que ese rubro no cuesta nada.

   Ojo con lo que esto NO cambia: la proyección ya tomaba, rubro por rubro, el
   mayor entre presupuesto no gastado y permanentes sin marcar (ver
   compromiso()). El piso arregla la vista de Presupuesto contra real, no la
   plata — que sigue saliendo solo de totales().
============================================================================= */
function pisoPerm(k,cat){
  var c=0;
  permsDeRubro(k,cat).forEach(function(f){ c+=cts(f.monto); });
  return c/100;
}
function compromiso(k){
  var pend=0, det=[];
  rubrosDe(k).forEach(function(r){
    var porPres=(r.pres==null)?0:Math.max(0, cts(r.pres)-cts(r.gastado));
    var porPerm=cts(r.permPend);
    var v=Math.max(porPres,porPerm);
    if(v>0){ pend+=v; det.push({cat:r.cat, porPres:porPres/100, porPerm:porPerm/100, val:v/100}); }
  });
  /* El rubro de ahorro no es un compromiso: esa plata no sale, se guarda.
     Se aparta de los compromisos y reaparece como parte del saldo libre. */
  var ca=catAhorro(), res=0;
  det=det.filter(function(d){ if(d.cat!==ca) return true; res=d.val; return false; });
  pend-=cts(res);
  det.sort(function(a,b){ return b.val-a.val; });
  var t=totales(k), ip=ingresoPendiente(k);
  var libre=red(t.queda+ip.pendiente-pend/100);
  return {pendiente:red(pend/100), det:det, ingPend:ip.pendiente, ingDet:ip.det,
          reservaAhorro:res, sobrante:red(libre-res), libre:libre};
}
/* ═══════════ COTEJO: LO PLANEADO CONTRA LO REAL ═══════════════════════
   Dos mundos paralelos que nunca se mezclan.
     PLANEADO · lo que él pronostica: el presupuesto por rubro (egresos) y los
                permanentes de ingreso activos (ingresos). No es plata.
     REAL     · los movimientos que reportó. Esto sí es plata, y es lo único
                que entra en totales().
   La diferencia se calcula siempre como real − plan.                        */
function planIngresos(k){
  var c=0; permsActivos(k).forEach(function(p){ if((p.tipo||"Egreso")==="Ingreso") c+=cts(p.monto); });
  return c/100;
}
/* La diferencia se muestra SIEMPRE como "a favor": positivo es bueno en las tres
   filas. Por eso en gastos es plan − real (gastar menos suma a favor) y en las
   otras dos es real − plan. Así el signo y el color dicen lo mismo en todas. */
function cotejo(k){
  var t=totales(k), pi=planIngresos(k), pg=totPresupuestado(k), pr=red(pi-pg);
  return {
    ing:{plan:pi, real:t.ing,   dif:red(t.ing-pi)},
    egr:{plan:pg, real:t.egr,   dif:red(pg-t.egr)},
    res:{plan:pr, real:t.queda, dif:red(t.queda-pr)}
  };
}
function totPresupuestado(k){
  var c=0, p=presuDe(k);
  Object.keys(p).forEach(function(x){ if(p[x]!=null&&p[x]!=="") c+=cts(p[x]); });
  return c/100;
}

/* =============================================================================
   RENDER
============================================================================= */
function $(s,r){ return (r||document).querySelector(s); }
/* =============================================================================
   NO PERDER EL LUGAR

   Marcar una casilla, borrar una fila o cambiar un rubro obliga a redibujar, y
   redibujar destruye los nodos: el contenedor con desplazamiento vuelve a
   arriba y hay que bajar otra vez a buscar dónde se estaba. Acá se anota la
   altura de cada caja desplazable antes de redibujar y se restituye después.

   La clave de cada caja es el data-t de su tabla, que sobrevive al redibujado.
   Al cambiar de pestaña NO se restituye: ahí sí corresponde empezar arriba.
============================================================================= */
var SCROLL_TAB=null;
function claveScroll(el,i){
  var t=el.querySelector("table[data-t]");
  if(t) return t.getAttribute("data-t");
  var l=el.getAttribute("data-lista"); if(l) return "lista:"+l;
  return "n"+i;
}
function scrollsLee(){
  var m={}, i=0;
  document.querySelectorAll(".tabla-cont,.mb,.lista-cfg,.pron-lista").forEach(function(el){
    var k=claveScroll(el,i++);
    if(el.scrollTop>0) m[k]=el.scrollTop;
  });
  return {cajas:m, y:window.scrollY||0};
}
function scrollsPone(g){
  if(!g) return;
  var i=0;
  document.querySelectorAll(".tabla-cont,.mb,.lista-cfg,.pron-lista").forEach(function(el){
    var k=claveScroll(el,i++), v=g.cajas[k];
    if(v>0) el.scrollTop=v;
  });
  if(g.y>0) window.scrollTo(0,g.y);
}
/* ---------------------------------------------------------------------------
   EL ANCLA · que la fila que estoy tocando no se me mueva
   ---------------------------------------------------------------------------
   Conservar el desplazamiento en píxeles no alcanza. Las tablas están ordenadas
   por una columna, y al guardar un cambio esa fila se reacomoda: el mismo
   scrollTop pasa a mostrar otro contenido y se siente como un salto hacia
   arriba. Lo mismo pasa cuando el contenido se acorta y el navegador recorta el
   desplazamiento al nuevo máximo.

   Por eso, además del desplazamiento, se guarda QUÉ fila se tocó y a qué altura
   de la pantalla estaba. Después de redibujar se busca esa misma fila y se
   corrige la diferencia — primero moviendo su contenedor, y lo que sobre, la
   página. Si la fila desapareció (se borró), no se corrige nada y queda el
   desplazamiento de siempre.
--------------------------------------------------------------------------- */
/* ---------------------------------------------------------------------------
   ORDEN CONGELADO
   ---------------------------------------------------------------------------
   Una tabla se ordena cuando yo lo pido: al abrirla, al cambiar de ventana o al
   tocar un encabezado. NO cada vez que se guarda un cambio. Si el orden se
   recalculara con cada tecla, la fila que estoy editando se iría a otro lugar
   —igualar un presupuesto la manda al fondo— y se siente como que la pantalla
   salta sola.

   El orden vigente se guarda como una lista de claves. Mientras la firma no
   cambie (misma ventana, misma columna, mismo sentido), las filas se muestran
   en ese orden; lo que aparece nuevo se agrega al final y lo que desaparece se
   cae solo. No se guarda en S: es memoria de la sesión, no un dato.
--------------------------------------------------------------------------- */
var ORD_CONG={};
function ordenCongelado(clave, firma, arr, idDe){
  var c=ORD_CONG[clave];
  if(!c || c.firma!==firma){
    ORD_CONG[clave]={firma:firma, lista:arr.map(idDe)};
    return arr;
  }
  var pos={};
  c.lista.forEach(function(x,i){ pos[x]=i; });
  var out=arr.slice().sort(function(a,b){
    var pa=pos[idDe(a)], pb=pos[idDe(b)];
    if(pa==null && pb==null) return 0;
    if(pa==null) return 1;                 /* lo que es nuevo va al final */
    if(pb==null) return -1;
    return pa-pb;
  });
  c.lista=out.map(idDe);                   /* los nuevos ya quedan en el orden */
  return out;
}
function ordenOlvida(){ ORD_CONG={}; }     /* al cambiar de pestaña o de ventana */
/* Renombrar no es mover: el rubro tiene que quedarse donde estaba. */
function ordenRenombra(clave, viejo, nuevo){
  var c=ORD_CONG[clave]; if(!c) return;
  var i=c.lista.indexOf(viejo);
  if(i>=0) c.lista[i]=nuevo;
}

var ANCLA=null, ANCLA_TS=0;
var ANCLA_ATTRS=["data-id","data-cat","data-pid","data-tj","data-vk","data-bit",
                 "data-cr","data-pid2","data-b","data-lista","data-pr"];
function anclaEsc(v){ return String(v).replace(/\\/g,"\\\\").replace(/"/g,'\\"'); }
function anclaDe(el){
  if(!el||!el.closest) return null;
  for(var i=0;i<ANCLA_ATTRS.length;i++){
    var a=ANCLA_ATTRS[i], n=null;
    try{ n=el.closest("["+a+"]"); }catch(e){ n=null; }
    if(n){
      var v=n.getAttribute(a);
      if(v!=null&&v!=="") return {sel:"["+a+'="'+anclaEsc(v)+'"]', top:n.getBoundingClientRect().top};
    }
  }
  return null;
}
function anclaFija(a){
  if(!a) return;
  var n=null; try{ n=document.querySelector(a.sel); }catch(e){ return; }
  if(!n) return;
  var d=Math.round(n.getBoundingClientRect().top - a.top);
  if(!d) return;
  var cont=n.closest?n.closest(".tabla-cont,.mb,.lista-cfg,.pron-lista"):null;
  if(cont && cont.scrollHeight>cont.clientHeight+1){
    var antes=cont.scrollTop;
    cont.scrollTop=antes+d;
    d-=(cont.scrollTop-antes);              /* lo que el contenedor no pudo absorber */
  }
  if(d) window.scrollTo(0,Math.max(0,(window.scrollY||0)+d));
}
/* Se mide en fase de captura: corre antes que cualquier manejador, así que la
   altura que se guarda todavía es la de ANTES de redibujar. */
["click","change","input"].forEach(function(evName){
  document.addEventListener(evName, function(e){
    ANCLA=anclaDe(e.target); ANCLA_TS=Date.now();
  }, true);
});
function anclaVigente(){
  var a=(ANCLA && (Date.now()-ANCLA_TS)<1500)? ANCLA : null;
  ANCLA=null;
  return a;
}
function render(){
  /* Solo se conserva el lugar si se sigue en la misma pestaña. */
  var guardado=(SCROLL_TAB===S.ui.tab)? scrollsLee() : null;

  SCROLL_TAB=S.ui.tab;

  scrollsPone(guardado);

function movsOrdenados(){
  var k=kAct(), o=S.ui.ordMov, q=(S.ui.busca||"").toLowerCase().trim();
  var arr=movsDe(k);
  if(q) arr=arr.filter(function(m){
    return (String(m.desc||"")+" "+String(m.cat||"")+" "+String(m.pago||"")+" "+String(m.motivo||"")).toLowerCase().indexOf(q)>=0;
  });
  arr=arr.slice().sort(function(a,b){
    var x,y;
    if(o.k==="monto"){ x=cts(a.monto); y=cts(b.monto); }
    else { x=String(a[o.k]||"").toLowerCase(); y=String(b[o.k]||"").toLowerCase(); }
    if(x<y) return -1*o.dir; if(x>y) return 1*o.dir;
    return String(a.id)<String(b.id)?-1:1;
  });
  return ordenCongelado("mov", k+"|"+o.k+"|"+o.dir+"|"+q, arr, function(m){ return m.id; });
}

/* =============================================================================
   DUPLICADOS YA REGISTRADOS
   La grilla de pegado avisa antes de guardar, pero un duplicado también nace de
   otras formas: marcar un permanente cuyo cargo ya vino del banco, desmarcarlo
   creyendo que se borra y volver a marcarlo, o anotar dos veces a mano. Ahí
   nadie avisaba, y el movimiento repetido se llevaba por delante los gastos y
   —si el rubro es el de un préstamo— hacía avanzar el plan de pagos una cuota
   de más.
   Mismo criterio que en el pegado, sin inventar nada nuevo: MISMO IMPORTE al
   centavo, MISMA descripción de banco y pocos días de diferencia. La app marca
   los dos y no borra ninguno: cuál sobra lo sabe él.
============================================================================= */
function movDupes(k){
  var arr=movsDe(k).filter(function(m){ return m.fecha && cts(m.monto) && qDescCore(m.desc); });
  var out={};
  for(var i=0;i<arr.length;i++){
    for(var j=i+1;j<arr.length;j++){
      var r=repeCompara(arr[i],arr[j]);
      if(!r) continue;
      if(!out[arr[i].id]) out[arr[i].id]={n:1, otro:arr[j], tipo:r.tipo};
      out[arr[i].id].n++;
      if(!out[arr[j].id]) out[arr[j].id]={n:1, otro:arr[i], tipo:r.tipo};
      out[arr[j].id].n++;
      if(r.tipo==="exacta"){ out[arr[i].id].tipo="exacta"; out[arr[j].id].tipo="exacta"; }
    }
  }
  return out;
}
function filaMov(m){
  var cats=catsDe(m.tipo), neg=cts(m.monto)<0;
  var lig=m.permId? ' title="Ligado al permanente: '+esc(nombrePerm(m.permId))+'"':"";
  var rG=reembGasto(m), rC=reembCobro(m), cobr=rG&&reembCobrado(m), gLig=rC?gastoDe(m):null;
  var cls=rG? (cobr?" reemb-ok":" reemb-pend") : (rC&&!gLig? " reemb-libre":"");
  var dup=MOV_DUP[m.id];
  if(dup) cls+=" dupe";
  return '<tr data-id="'+esc(m.id)+'"'+(cls?' class="'+cls.slice(1)+'"':"")+lig+
    (m.permId?' style="box-shadow:inset 3px 0 0 var(--ok)"':"")+'>'+
    '<td><input class="cel" type="date" data-c="fecha" value="'+esc(m.fecha||"")+'"></td>'+
    '<td><select class="cel" data-c="tipo"><option'+(m.tipo==="Egreso"?" selected":"")+'>Egreso</option><option'+(m.tipo==="Ingreso"?" selected":"")+'>Ingreso</option></select></td>'+
    '<td><input class="cel" data-c="desc" title="'+esc(m.desc||"")+'" value="'+esc(m.desc||"")+'"></td>'+
    '<td class="num"><div class="mon-cel"><input class="cel'+(neg?" neg":"")+(m.fx?" tienefx":"")+'" data-c="monto" inputmode="decimal"'+
      (m.fx?' title="'+esc(m.fx)+'"':'')+' value="'+esc(m.monto)+'">'+
      selMoneda('data-c="monEnt"')+'</div>'+
      (m.fx?'<div class="sub fx-sello" title="'+esc("Importe original y tasa con la que se convirtió al capturarlo. Cambiar la tasa después no recalcula nada.")+'">'+esc(m.fx)+'</div>':'')+
      '</td>'+
    '<td><select class="cel" data-c="cat">'+opciones(cats,m.cat||"")+'</select></td>'+
    '<td><select class="cel" data-c="pago">'+opciones(S.formas,m.pago||"")+'</select></td>'+
    '<td><input class="cel" data-c="motivo" title="Texto propio: qué se compró o se pagó. El comercio de al lado se deja tal cual lo manda el banco, porque de él dependen la detección de repetidas y la sugerencia de categoría." value="'+esc(m.motivo||"")+'" placeholder="—"></td>'+
    '<td style="white-space:nowrap;padding-right:4px">'+
      (dup?'<span class="chip mal" data-t="chipDup" title="'+esc(
        (dup.tipo==="exacta"
          ? "Posible duplicado: mismo importe ("+fmt(m.monto)+") y misma descripción, a pocos días."
          : "Posible duplicado: importe casi igual, descripción parecida, la misma forma de pago y "+
            "menos de "+DIAS_REPE_CASI+" días de diferencia. Suele pasar cuando el mismo cargo se copia "+
            "de dos orígenes que lo escriben distinto y lo fechan distinto.")+
        " — «"+(dup.otro.desc||"")+"» "+fmt(dup.otro.monto)+" del "+fmtF(dup.otro.fecha)+
        ". No se borra nada: revisar cuál sobra y quitarlo con la ×.")+'">×'+dup.n+'</span> ':'')+

          rG? (cobr? (cobroDe(m.id)? "Cobrado con el ingreso «"+(cobroDe(m.id).desc||"")+"». Clic para ver o desligar."
                                   : "Dado por cobrado a mano, sin ingreso ligado. Clic para quitar la marca.")
             : "Gasto reembolsable todavía sin cobrar. Clic para ligarlo al ingreso que lo reintegra, o darlo por cobrado.")
            : (gLig? "Reintegra el gasto «"+(gLig.desc||"")+"». Clic para ver o desligar."
                   : "Cobro reembolsable sin gasto ligado. Clic para elegir a qué gasto corresponde."))+
        '">'+(rG? (cobr?"cobrado":"por cobrar") : (gLig?"ligado":"¿de qué gasto?"))+'</button>':'')+
      '<button class="pbt'+(m.permId?" on":"")+'" data-acc="mov-perm" title="'+

                 : "Dar de alta este gasto como permanente de esta ventana, con su descripción, monto, rubro y forma de pago. Queda ligado a este movimiento y contado como pagado. Si el rubro es Financiamiento se piden las cuotas.")+
        '">'+(m.permId?"perm":"+ perm")+'</button>'+

function nombrePerm(pid){
  var f=permsK(kAct()).filter(function(x){return x.id===pid;})[0];
  return f? (f.desc||f.cat) : "(permanente borrado)";
}

/* =============================================================================
   REEMBOLSABLES · plata propia que alguien más tiene que devolver.

   NO ES UNA CATEGORÍA DE DINERO APARTE. El gasto ya está contado en gastos
   desde que se registró, y el cobro, cuando llega, ya está contado en
   ingresos. Lo único que se agrega acá es el VÍNCULO entre los dos, para no
   perder de vista lo que falta cobrar. totales() no mira ni un campo de esta
   sección: el saldo real es el mismo con el vínculo puesto o sin él.

   Reembolsable es todo rubro que empiece con "Reembols" — Reembolsable,
   Reembolso Abuelos, Reembolsables. "Descuentos/Reembolsos" queda afuera a
   propósito: eso no es plata que alguien deba.
============================================================================= */
function esReemb(m){ return /^\s*reembols/i.test(String((m&&m.cat)||"")); }
function reembGasto(m){ return !!m && m.tipo!=="Ingreso" && esReemb(m); }
function reembCobro(m){ return !!m && m.tipo==="Ingreso" && esReemb(m); }
function cobroDe(mid){
  var r=null;
  S.movimientos.forEach(function(x){ if(x.reembDe===mid && reembCobro(x) && !r) r=x; });
  return r;
}
function gastoDe(cobro){
  if(!cobro||!cobro.reembDe) return null;
  var g=S.movimientos.filter(function(x){ return x.id===cobro.reembDe; })[0];
  return reembGasto(g)? g : null;
}
/* Cobrado = hay un ingreso ligado, o él lo dio por cobrado a mano.
   La marca a mano existe porque a veces el reintegro llega en efectivo y no
   se registra como movimiento; entonces no hay ingreso que ligar. */
function reembCobrado(m){ return reembGasto(m) && (m.reembOk===true || !!cobroDe(m.id)); }
/* Esta ventana y la anterior: el cobro casi nunca cae en el mismo corte que
   el gasto. Nada de esto cruza plata entre ventanas — es solo un puntero. */
function reembVentanas(){
  var k=kAct(), p=ventanaPrevia(k);
  return p? [k,p] : [k];
}
function reembPendientes(){
  var ks=reembVentanas();
  return S.movimientos.filter(function(m){
    return ks.indexOf(m.k)>=0 && reembGasto(m) && !reembCobrado(m);
  });
}
/* Candidatos vistos desde un ingreso: todo gasto reembolsable que todavía no
   tenga un COBRO REAL ligado. Los dados por cobrado a mano siguen en la lista
   —la marca a mano es un recordatorio, no un movimiento— y se muestran con su
   aclaración; ligarles el ingreso real borra la marca. */
function reembLigables(){
  var ks=reembVentanas();
  return S.movimientos.filter(function(m){
    return ks.indexOf(m.k)>=0 && reembGasto(m) && !cobroDe(m.id);
  });
}
function reembCobrosLibres(){
  var ks=reembVentanas();
  return S.movimientos.filter(function(m){
    return ks.indexOf(m.k)>=0 && reembCobro(m) && !gastoDe(m);
  });
}
function reembResumen(k){
  var n=0, tot=0;
  S.movimientos.forEach(function(m){
    if(m.k!==k || !reembGasto(m) || reembCobrado(m)) return;
    n++; tot+=cts(m.monto);
  });
  return {n:n, monto:red(tot/100)};
}
function nombreK(k){ var p=String(k||"").split("|"); return (p[1]||"")+" "+(p[0]||""); }
/* Al borrar un movimiento se cortan los vínculos que lo apuntaban, para que no
   queden gastos "cobrados" por un ingreso que ya no existe. */
function reembOlvida(mid){
  S.movimientos.forEach(function(x){ if(x.reembDe===mid) delete x.reembDe; });
}
function reembLiga(cobroId,gastoId){
  var c=S.movimientos.filter(function(x){return x.id===cobroId;})[0];
  var g=S.movimientos.filter(function(x){return x.id===gastoId;})[0];
  if(!c||!g) return false;
  /* un cobro liga a un solo gasto y un gasto recibe un solo cobro */
  S.movimientos.forEach(function(x){ if(x.reembDe===gastoId && x.id!==cobroId) delete x.reembDe; });
  c.reembDe=gastoId;
  delete g.reembOk;              /* el ingreso real manda sobre la marca a mano */
  guardar(); render();
  return true;
}
function reembCorta(mid){
  var m=S.movimientos.filter(function(x){return x.id===mid;})[0];
  if(!m) return;
  if(reembCobro(m)) delete m.reembDe;
  else { delete m.reembOk; reembOlvida(mid); }
  guardar(); render();
}
function reembMarca(gastoId,on){
  var g=S.movimientos.filter(function(x){return x.id===gastoId;})[0];
  if(!g) return;
  if(on) g.reembOk=true; else delete g.reembOk;
  guardar(); render();
}

function abreReemb(mid){

  function ficha(x,acc){

    '<div class="mb">'+
    '<p class="sub" style="margin:0 0 10px">Ligar un cobro a su gasto <b>no mueve ningún número</b>. '+
    'El gasto ya está en gastos y el cobro ya está en ingresos desde que se registraron; '+
    'esto solo deja de mostrarlo como pendiente.</p>'+
    '<div class="secc"><h4>'+(esG?"Gasto":"Cobro")+'</h4>'+ficha(m)+'</div>';

  if(ligado){
    h+='<div class="secc"><h4>'+(esG?"Cobrado con este ingreso":"Cubre este gasto")+'</h4>'+
      ficha(ligado,'<button class="btn gh peq" data-acc="reemb-cortar" data-rid="'+esc(m.id)+'">Desligar</button>')+
      '</div>';
  } else if(esG && m.reembOk){
    h+='<div class="secc"><h4>Estado</h4><div class="rb-it"><div class="rb-d">'+
      'Marcado como cobrado a mano, sin ingreso ligado.</div>'+
      '<button class="btn gh peq" data-acc="reemb-desmarcar" data-rid="'+esc(m.id)+'">Quitar la marca</button></div></div>';
  } else {
    h+='<div class="secc"><h4>'+(esG?"Ingresos reembolsables sin gasto ligado":"Gastos reembolsables sin cobrar")+
      ' <span class="sub" style="text-transform:none;letter-spacing:0">· esta ventana y la anterior</span></h4>'+
      (cands.length? cands.map(function(x){
        return ficha(x,'<button class="btn peq" data-acc="reemb-ligar" data-rid="'+esc(m.id)+'" data-oid="'+esc(x.id)+'">Ligar</button>');
      }).join("") : '<div class="vacio" style="padding:18px">No hay '+(esG?"ingresos":"gastos")+
        ' reembolsables libres. '+(esG?"Cuando entre el reintegro, registralo con un rubro que empiece con «Reembols» y volvé acá.":"")+'</div>')+
      '</div>';
    if(esG) h+='<div class="secc"><h4>Sin ingreso registrado</h4><div class="rb-it">'+
      '<div class="rb-d">Si el reintegro llegó en efectivo y no se registró como movimiento, '+
      'se puede dar por cobrado a mano.<div class="sub">No crea ningún ingreso: los gastos e ingresos reales no cambian.</div></div>'+
      '<button class="btn gh peq" data-acc="reemb-marcar" data-rid="'+esc(m.id)+'">Dar por cobrado</button></div></div>';
  }
  h+='</div><div class="mf"><button class="btn gh" data-acc="cerrar">Cerrar</button></div>';
  abreModal(h);
}
/* Refresca el total activo de la cabecera sin reconstruir la tabla (no se
   pierde el foco mientras se escribe en otra celda). */
function repintaTotalPerm(tipo){
  var ing=(tipo==="Ingreso"), k=kAct(), tot=0, act=0;
  permsK(k).forEach(function(f){
    if(((f.tipo||"Egreso")==="Ingreso")!==ing) return;
    if(!permActivo(f)) return;
    tot+=cts(f.monto); act++;
  });
  var el=$('[data-t="permTotal'+(ing?"I":"")+'"]');
  if(el) el.textContent=fmt(tot/100)+" activo"+(act===1?"":"s");
}
function permsOrdenados(tipo){
  var ing=(tipo==="Ingreso");
  var o=(ing? S.ui.ordPermI : S.ui.ordPerm)||{k:"desc",dir:1}, k=kAct();
  var base=permsK(k);
  if(tipo) base=base.filter(function(f){ return ((f.tipo||"Egreso")==="Ingreso")===ing; });
  var arr=base.slice().sort(function(a,b){
    var x,y;
    if(o.k==="monto"){ x=cts(a.monto); y=cts(b.monto); }
    else if(o.k==="activo"){ x=permActivo(a)?1:0; y=permActivo(b)?1:0; }
    else if(o.k==="marca"){ x=movDePerm(k,a.id)?1:0; y=movDePerm(k,b.id)?1:0; }
    else if(o.k==="desc"){ x=String(a.desc||a.cat||"").toLowerCase(); y=String(b.desc||b.cat||"").toLowerCase(); }
    else { x=String(a[o.k]||"").toLowerCase(); y=String(b[o.k]||"").toLowerCase(); }
    if(x<y) return -o.dir; if(x>y) return o.dir;
    return String(a.desc||"").localeCompare(String(b.desc||""));
  });
  return ordenCongelado("perm"+(ing?"I":"E"), k+"|"+o.k+"|"+o.dir, arr, function(f){ return f.id; });
}

/* Ingreso del rubro ya registrado en la ventana SIN ligar a un permanente.
   Si eso ya cubre lo que este permanente espera, marcarlo lo contaría dos veces. */
/* Plata que YA está registrada en ese rubro de esta ventana y no está ligada a
   ningún permanente. Si él marca la casilla encima, el mismo dinero queda
   contado dos veces — y en un préstamo eso hace avanzar el plan de pagos una
   cuota de más. La app no lo impide: lo pone a la vista antes de marcar. */
function sueltoEnRubro(k,cat,tipo){
  var c=0, esIng=(tipo==="Ingreso");
  movsDe(k).forEach(function(m){
    if(((m.tipo||"Egreso")==="Ingreso")!==esIng || m.permId) return;
    if((m.cat||"Sin categoría")!==cat) return;
    c+=cts(m.monto);
  });
  return c/100;
}
function ingresoSuelto(k,cat){ return sueltoEnRubro(k,cat,"Ingreso"); }
/* Movimientos de esta ventana que PODRÍAN SER ESTE MISMO COBRO ya registrado:
   mismo rubro, sin ligar a ningún permanente, y con el importe dentro del
   margen del rubro. Compartir rubro no basta —en Suscripciones hay diez cobros
   distintos—; lo que delata el doble conteo es que además el importe calce. */
function sueltoIgual(k,f){
  var out=[], esIng=((f.tipo||"Egreso")==="Ingreso"), cat=f.cat||"Sin categoría";
  movsDe(k).forEach(function(m){
    if(((m.tipo||"Egreso")==="Ingreso")!==esIng || m.permId) return;
    if((m.cat||"Sin categoría")!==cat) return;
    if(!dentroTol(f,Math.abs(+m.monto||0))) return;
    out.push(m);
  });
  return out;
}
function filaPerm(f){
  var k=kAct(), mv=movDePerm(k,f.id), on=!!mv, act=permActivo(f), cats=catsDe(f.tipo||"Egreso");
  var venc=act&&cuotaVencida(f,k);
  var av=avisoDe(f), avOn=act&&av&&av.activo;
  var ing=((f.tipo||"Egreso")==="Ingreso");
  /* En ingresos alcanza con el rubro (un salario es único); en egresos, además,
     el importe tiene que calzar: si no, todo Suscripciones saldría avisando. */
  var yaEntro=0;
  if(!on&&act){
    if(ing) yaEntro=ingresoSuelto(k,f.cat||"Sin categoría");
    else { var gm=sueltoIgual(k,f), c=0; gm.forEach(function(m){ c+=cts(m.monto); }); yaEntro=c/100; }

/* Los financiamientos son solo lectura: se arman con los permanentes del rubro
   Financiamiento de la ventana activa. Los préstamos se cargan y se editan acá. */
function finRows(){
  var hoy=mesDe(hoyISO());
  return permsK(kAct()).filter(esFinanciamiento).map(function(f){
    var ult=f.ultimaCuota||f.hasta||"";
    var c=finCuotas(f), cuo=red(+f.monto||0);
    var difCal=ult? mesesEntre(hoy,ult) : null;             /* solo para contrastar */
    var restCal=(difCal==null)? null : Math.max(0,difCal+1);
    var prim=(c.total!=null&&ult)? mesMas(ult,-(c.total-1)) : "";
    /* Terminado se decide por cuotas pagadas; si no hay con qué contarlas,
       queda la fecha de la última cuota como único indicio. */
    var term=(c.restantes!=null)? (c.restantes===0) : (difCal!=null&&difCal<0);
    return {f:f, desc:f.desc||f.cat, cuota:cuo, ultima:ult, primera:prim,
            total:c.total, pagadas:c.pagadas, restantes:c.restantes,
            registradas:c.registradas, ancla:c.ancla, deTexto:c.deTexto,
            restCal:restCal, terminado:term,
            desfase:(c.restantes!=null&&restCal!=null&&Math.abs(c.restantes-restCal)>1),
            falta:c.restantes!=null? red(cuo*c.restantes):null,
            pagado:c.pagadas!=null? red(cuo*c.pagadas):null,
            monto:c.total!=null? red(cuo*c.total):null,
            activo:permActivo(f)};
  }).sort(function(a,b){
    if(a.terminado!==b.terminado) return a.terminado?1:-1;
    return String(a.ultima||"9999").localeCompare(String(b.ultima||"9999"));
  });
}

        td(x.cuota)+

      (sinDato?' &middot; <b class="tx-mal">'+sinDato+'</b> sin datos de cuotas: marcar el permanente en Movimientos los pide.':'')+
      (term?' &middot; <b class="tx-mal">'+term+'</b> ya terminado'+(term===1?"":"s")+': conviene pausarlos en Movimientos.':'')+'</div>'+

function prSimDe(id){
  S.ui.prSim=S.ui.prSim||{};

  return S.ui.prSim[id];
}
function prEscenario(sim){
  var ex={};
  if(parseMonto(sim.unicoMonto)>0 && sim.unicoMes) ex.unico={mes:sim.unicoMes, monto:parseMonto(sim.unicoMonto)};
  if(parseMonto(sim.mensual)>0) ex.mensual=parseMonto(sim.mensual);
  if(parseMonto(sim.cuota)>0) ex.cuota=parseMonto(sim.cuota);
  return ex;
}

function vistaRubros(){
  var k=kAct(), filas=rubrosDe(k), o=S.ui.ordRub;
  filas.sort(function(a,b){
    var x,y;
    if(o.k==="cat"){ x=a.cat.toLowerCase(); y=b.cat.toLowerCase(); if(x<y)return -o.dir; if(x>y)return o.dir; return 0; }
    if(o.k==="queda"){ x=a.queda; y=b.queda;
      if(x==null&&y==null) return a.cat.localeCompare(b.cat);
      if(x==null) return 1; if(y==null) return -1; }   /* sin presupuesto, al final */
    else { x=a[o.k]==null?-Infinity:a[o.k]; y=b[o.k]==null?-Infinity:b[o.k]; }
    if(x!==y) return (x-y)*o.dir;                      /* dir −1 = de mayor a menor */
    return a.cat.localeCompare(b.cat);
  });
  filas=ordenCongelado("rub", k+"|"+o.k+"|"+o.dir, filas, function(r){ return r.cat; });
  var tp=0,tg=0,tperm=0,conPres=0;
  filas.forEach(function(r){ if(r.pres!=null){ tperm+=cts(r.perm); tp+=cts(r.pres); tg+=cts(r.gastado); conPres++; } });
  tp/=100; tg/=100; tperm/=100;
  function th2(campo,txt,ancho,tit,cls){
    var act=o.k===campo;
    return '<th class="der'+(cls?" "+cls:"")+'" style="width:'+ancho+'"'+(tit?' title="'+esc(tit)+'"':'')+
      '><button data-ordr="'+campo+'">'+txt+(act?(o.dir>0?" ↑":" ↓"):"")+'</button></th>';
  }
  var h=vistaCotejo(k)+
    '<div class="card">'+
      '<div class="barra-h" style="margin-bottom:8px">'+
        '<h2 style="margin:0" title="Edición en celda: nombre del rubro, importe presupuestado, agregar y quitar. Ordenable por cualquier encabezado.">Presupuesto por rubro &middot; '+esc(S.ui.per+" "+S.ui.anio)+'</h2>'+
        '<div class="sp"></div>'+
        '<button class="btn gh peq" data-acc="rubros-piso" data-t="btnPiso" title="Presupuesta de una vez lo que ya se sabe que hay que pagar: cada rubro con permanentes activos queda con ese importe. Nunca baja nada — si el rubro ya tenía un presupuesto mayor, se respeta.">Presupuestar los permanentes</button>'+
        '<button class="btn gh peq" data-acc="rubros-igualar-todos" data-t="btnIgualarTodos" '+
          'title="Poner el presupuesto de cada rubro igual a su gasto real de la ventana. Ningún rubro baja por debajo de sus permanentes activos: eso ya se sabe que hay que pagarlo. Pregunta antes.">= Igualar al real (sin bajar del piso)</button>'+
        '<button class="btn gh peq" data-acc="rubro-nuevo">+ Rubro</button></div>'+
      '<div class="tabla-cont" style="max-height:66vh"><table data-t="tablaRub"><thead><tr>'+
        '<th style="width:26%"><button data-ordr="cat">Rubro'+(o.k==="cat"?(o.dir>0?" ↑":" ↓"):"")+'</button></th>'+
        th2("perm","Permanentes","12%","Importe de los permanentes activos del rubro en esta ventana. Es el piso del presupuesto, no un gasto: un permanente solo es gasto cuando su casilla está marcada.")+
        th2("pres","Presupuesto","12%","Importe asignado al rubro en esta ventana. Editable en la celda. No afecta el saldo real.","col-plan")+
        th2("gastado","Real","12%","Suma de los movimientos de la ventana en ese rubro.")+
        th2("queda","Disponible","13%","Presupuesto menos real. Negativo = rubro excedido.")+
        '<th class="plano" style="width:18%" title="Porcentaje del presupuesto ya ejecutado.">% ejecutado</th>'+
        '<th class="plano" style="width:7%"></th>'+
      '</tr></thead><tbody>'+
      filas.map(function(r){
        var pct=(r.pres!=null&&r.pres>0)? Math.min(100,Math.max(0,r.gastado/r.pres*100)) : 0;
        var pasado=(r.queda!=null&&r.queda<0);
        var vacio=(r.pres==null && r.n===0 && !r.perm);
        var pisoCorto=(r.pres!=null && r.perm>r.pres);
        return '<tr data-cat="'+esc(r.cat)+'"'+(vacio?' style="opacity:.5"':'')+'>'+
          '<td><input class="cel" data-c="rubroNom" value="'+esc(r.cat)+'" title="Renombrar aquí propaga el cambio a los movimientos y permanentes que usan ese rubro."></td>'+
          '<td class="num"'+(pisoCorto?' style="color:var(--avi-tx)" title="Los permanentes activos del rubro superan el presupuesto asignado."':'')+'>'+
            (r.perm?'<button class="cel" style="text-align:right;width:100%;cursor:pointer;font-variant-numeric:tabular-nums;color:inherit" data-desg="permrubro">'+fmt(r.perm)+'</button>':'<span class="sub">—</span>')+'</td>'+
          '<td class="num col-plan"><input class="cel" data-c="pres" inputmode="decimal" placeholder="—" value="'+(r.pres==null?"":esc(r.pres))+'"></td>'+
          '<td class="num"><button class="cel" style="text-align:right;width:100%;cursor:pointer;font-variant-numeric:tabular-nums" '+
            'title="'+r.n+' movimiento'+(r.n===1?"":"s")+' en este rubro &middot; clic para ver el detalle completo" data-desg="rubroFull">'+fmt(r.gastado)+'</button></td>'+
          '<td class="num" style="padding:6px 8px'+(pasado?";color:var(--mal-tx);font-weight:640":(r.queda!=null?";color:var(--ok-tx)":""))+'">'+
            (r.queda==null?'<span class="sub">—</span>':fmt(r.queda,r.queda>0))+'</td>'+
          '<td style="padding:6px 8px">'+(r.pres!=null&&r.pres>0?
            '<div class="barra'+(pasado?" x":"")+'" title="'+pct.toFixed(0)+'% del presupuesto ejecutado"><i style="width:'+pct.toFixed(1)+'%"></i></div>':
            '<span class="sub">sin presupuesto</span>')+'</td>'+
          '<td style="white-space:nowrap"><button class="borrar" data-acc="rubro-igualar" title="Igualar el presupuesto del rubro a su gasto real acumulado, sin bajar de sus permanentes activos.">=</button>'+
            '<button class="borrar" data-acc="rubro-borrar" title="Quitar el rubro de la lista.">×</button></td>'+
        '</tr>';
      }).join("")+
      '</tbody><tfoot>'+pieRubros(conPres,tp,tg,tperm)+'</tfoot></table></div>'+
    '</div>';
  return h;
}

function toast(msg,ms){
  document.querySelectorAll(".toast").forEach(function(x){ x.remove(); });   /* uno a la vez */
  var t=document.createElement("div"); t.className="toast"; t.setAttribute("data-t","toast");
  t.textContent=String(msg).replace(/&middot;/g,"·").replace(/&nbsp;/g," ");

}

/* ---------------- desglose: de qué está hecho un número ---------------- */
function desglose(cual,extra){
  var k=kAct(), t=totales(k), lista=[], lineas=null, titulo="", total=0, formula="";
  if(cual==="ing"){ titulo="Ingresos reales &middot; "+S.ui.per+" "+S.ui.anio;
    lista=movsDe(k).filter(function(m){return m.tipo==="Ingreso";}); total=t.ing;
    formula="Suma de los "+lista.length+" movimientos de tipo <b>Ingreso</b> de la ventana."; }
  else if(cual==="egr"){ titulo="Gastos reales &middot; "+S.ui.per+" "+S.ui.anio;
    lista=movsDe(k).filter(function(m){return m.tipo!=="Ingreso";}); total=t.egr;
    formula="Suma de los "+lista.length+" movimientos de tipo <b>Egreso</b> de la ventana. "+
      "Los montos negativos (devoluciones y descuentos) restan."; }
  else if(cual==="queda"){ titulo="Saldo real &middot; "+S.ui.per+" "+S.ui.anio;
    lista=movsDe(k); total=t.queda;
    formula="<code>saldo real = ingresos reales − gastos reales</code><br>"+
      "<code>"+fmt(t.ing)+" − "+fmt(t.egr)+" = "+fmt(t.queda,true)+"</code><br>"+
      "Solo los "+lista.length+" movimientos de la ventana entran en esta resta. "+
      "El presupuesto, los permanentes sin marcar y el saldo manual <b>no</b> entran."; }
  else if(cual==="ahorro"){ titulo=esc(catAhorro())+" apartado &middot; "+S.ui.per+" "+S.ui.anio;
    lista=movsAhorro(k); total=totAhorro(k);
    formula="Movimientos de la ventana en el rubro <b>"+esc(catAhorro())+"</b>: plata que ya salió de la cuenta "+
      "y quedó guardada. Lo que todavía falta por ahorrar vive en la proyección, dentro del "+
      "<b>saldo libre proyectado</b>."; }
  else if(cual==="ahorropres"){ titulo="Ahorro presupuestado &middot; "+S.ui.per+" "+S.ui.anio;
    var cA=compromiso(k); total=cA.reservaAhorro; lineas=[];
    formula="Lo que el rubro <b>"+esc(catAhorro())+"</b> tiene presupuestado y todavía no se apartó.<br>"+
      "No es un compromiso pendiente: esa plata no se va a gastar, se guarda. Por eso está <b>dentro</b> "+
      "del saldo libre proyectado y no restándolo.<br>"+
      "Se asigna en la pestaña <b>Presupuesto</b>. Al registrar el movimiento de ahorro, esta cifra baja "+
      "y aparece en la baldosa <b>"+esc(catAhorro())+" apartado</b>."; }
  else if(cual==="sobrante"){ titulo="Sobrante sin asignar &middot; "+S.ui.per+" "+S.ui.anio;
    var cS=compromiso(k); total=cS.sobrante; lineas=[];
    formula="<code>saldo libre proyectado − ahorro presupuestado</code><br>"+
      "<code>"+fmt(cS.libre,true)+" − "+fmt(cS.reservaAhorro)+" = "+fmt(cS.sobrante,true)+"</code><br>"+
      "Plata que a esta altura no está gastada, ni comprometida por ningún rubro, ni reservada para ahorrar.<br>"+
      "Negativo significa que los compromisos pendientes ya superan a lo disponible."; }
  else if(cual==="comprometido"){ titulo="Compromisos pendientes &middot; "+S.ui.per+" "+S.ui.anio;
    var c=compromiso(k); total=c.pendiente;
    lineas=c.det.map(function(d){ return {t:d.cat, v:d.val,
      n:"presupuesto no gastado "+fmt(d.porPres)+" &middot; permanentes sin marcar "+fmt(d.porPerm)+" → se toma el mayor"}; });
    formula="Plata que la ventana todavía tiene que pagar: lo que falta ejecutar del presupuesto y los "+
      "permanentes activos que aún no se marcaron.<br>"+
      "Por rubro se toma el <b>mayor</b> entre los dos, nunca la suma: el presupuesto de un rubro ya debería "+
      "cubrir sus permanentes, y sumarlos sería contar el mismo importe dos veces.<br>"+
      "El rubro <b>"+esc(catAhorro())+"</b> queda fuera: esa plata no sale, se guarda, y por eso vive dentro "+

  else if(cual==="ingpend"){ titulo="Ingreso permanente por entrar &middot; "+S.ui.per+" "+S.ui.anio;
    var ci=compromiso(k); total=ci.ingPend;
    lineas=ci.ingDet.map(function(d){ return {t:d.cat, v:d.val,
      n:"esperado "+fmt(d.esperado)+" &middot; ya recibido "+fmt(d.recibido)+" → falta la diferencia"}; });
    formula="Ingresos permanentes <b>activos y sin marcar</b> de la ventana.<br>"+
      "Por rubro se descuenta lo que ya entró: si el ingreso se registró sin ligarlo a su permanente, "+
      "sumarlo otra vez sería contar el mismo dinero dos veces.<br>"+

  else if(cual==="libre"){ titulo="Saldo libre proyectado &middot; "+S.ui.per+" "+S.ui.anio;
    var c2=compromiso(k); total=c2.libre; lineas=[];
    formula="<code>saldo real"+(c2.ingPend>0?" + ingreso permanente por entrar":"")+" − presupuesto sin ejecutar</code><br><code>"+
      fmt(t.queda,true)+(c2.ingPend>0?" + "+fmt(c2.ingPend):"")+" − "+fmt(c2.pendiente)+" = "+fmt(c2.libre,true)+"</code><br>"+
      "El saldo real por sí solo puede inducir a error: parte de ese importe ya está comprometido por el "+
      "presupuesto. Esta cifra es el remanente después de ejecutarlo.<br>"+
      "Es una proyección: solo cambia al modificar el presupuesto, los permanentes o los movimientos."; }
  else if(cual==="rubroFull"){
    /* La ficha entera de un rubro: qué se presupuestó, qué se gastó, qué
       permanentes tiene y qué movimientos lo componen. Todo sale de lo que ya
       existe — presupuesto, permanentes y movimientos —; acá solo se junta. */
    var rF=rubrosDe(k).filter(function(x){ return x.cat===extra; })[0];
    if(!rF) return;
    var pmF=permsK(k).filter(function(p){
      return (p.tipo||"Egreso")!=="Ingreso" && (p.cat||"Sin categoría")===extra; });
    var mvF=movsDe(k).filter(function(m){
      return m.tipo!=="Ingreso" && (m.cat||"Sin categoría")===extra; });
    var pctF=rF.pres>0? (rF.gastado/rF.pres*100) : null;
    var cab='<div class="ct-fila" style="margin-bottom:10px">'+
      '<div class="ct"><div class="ct-et">Presupuesto</div><div class="ct-g">'+
        '<span class="ct-l">asignado</span><span class="ct-v c-plan">'+(rF.pres==null?"—":fmt(rF.pres))+'</span>'+
        '<span class="ct-l">piso perm.</span><span class="ct-v">'+fmt(rF.perm)+'</span>'+
        '<span class="ct-l">% ejec.</span><span class="ct-v">'+(pctF==null?"—":pctF.toFixed(0)+"%")+'</span>'+
      '</div></div>'+
      '<div class="ct"><div class="ct-et">Real</div><div class="ct-g">'+
        '<span class="ct-l">gastado</span><span class="ct-v">'+fmt(rF.gastado)+'</span>'+
        '<span class="ct-l">movs.</span><span class="ct-v">'+rF.n+'</span>'+
        '<span class="ct-l">perm. sin marcar</span><span class="ct-v">'+fmt(rF.permPend)+'</span>'+
      '</div></div>'+
      '<div class="ct"><div class="ct-et">Disponible</div><div class="ct-g">'+
        '<span class="ct-l">presup. − real</span><span class="ct-v" style="color:'+
          (rF.queda!=null&&rF.queda<0?"var(--mal-tx)":"var(--ok-tx)")+';font-weight:650">'+
          (rF.queda==null?"—":fmt(rF.queda,rF.queda>0))+'</span>'+
        '<span class="ct-l">compromiso</span><span class="ct-v">'+
          fmt(Math.max(rF.pres==null?0:Math.max(0,red(rF.pres-rF.gastado)), rF.permPend))+'</span>'+
        '<span class="ct-l">&nbsp;</span><span class="ct-v">&nbsp;</span>'+
      '</div></div></div>';
    var perF=pmF.length? '<div class="secc"><h4>Permanentes de este rubro ('+pmF.length+')</h4>'+
      '<div class="tabla-cont"><table><thead><tr>'+
        '<th class="plano">Comercio</th><th class="plano">Ritmo</th>'+
        '<th class="plano">Estado</th><th class="plano der">Monto</th></tr></thead><tbody>'+
      pmF.map(function(pp){
        var on=!!movDePerm(k,pp.id), act=permActivo(pp), toca=permToca(pp);
        var px=proximoCobro(pp), fe=avisoFecha(pp);
        var est=!act? '<span class="chip mal">pausado</span>'
              : on? '<span class="chip ok">pagado</span>'
              : toca? '<span class="chip avi">sin marcar</span>'
                    : '<span class="chip">no toca este mes</span>';
        return '<tr><td style="padding:5px 8px">'+esc(pp.desc||pp.cat)+
            (pp.motivo?' <span class="sub">· '+esc(pp.motivo)+'</span>':'')+'</td>'+
          '<td style="padding:5px 8px" class="sub">'+esc(cadaTxt(cadaDe(pp)))+
            (cadaDe(pp)>1&&px.mes?' · próximo '+esc(fe?fmtFecha(fe):px.mes):'')+'</td>'+
          '<td style="padding:5px 8px">'+est+'</td>'+
          '<td style="padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums">'+fmt(pp.monto)+'</td></tr>';
      }).join("")+'</tbody></table></div></div>' : '';
    var movF=mvF.length? '<div class="secc"><h4>Movimientos de este rubro ('+mvF.length+')</h4>'+
      '<div class="tabla-cont"><table><thead><tr>'+
        '<th class="plano">Fecha</th><th class="plano">Comercio</th>'+
        '<th class="plano">Forma de pago</th><th class="plano der">Monto</th></tr></thead><tbody>'+
      mvF.slice().sort(function(a2,b2){ return String(a2.fecha)<String(b2.fecha)?-1:1; }).map(function(m){
        return '<tr><td style="padding:5px 8px;white-space:nowrap">'+esc(fmtF(m.fecha))+'</td>'+
          '<td style="padding:5px 8px">'+esc(m.desc||"(sin descripción)")+
            (m.motivo?' <span class="sub">· '+esc(m.motivo)+'</span>':'')+
            (m.permId?' <span class="chip ok">permanente</span>':'')+'</td>'+
          '<td style="padding:5px 8px" class="sub">'+esc(m.pago||"—")+'</td>'+
          '<td style="padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums'+
            (cts(m.monto)<0?";color:var(--mal)":"")+'">'+fmt(m.monto)+'</td></tr>';
      }).join("")+'</tbody></table></div></div>'
      : '<p class="sub">Todavía no hay movimientos registrados en este rubro.</p>';
    abreModal('<div class="mh"><h3>'+esc(extra)+'</h3><div class="sp"></div>'+
        '<button class="icb" data-acc="cerrar">×</button></div>'+
      '<div class="mb" data-t="modalDesglose">'+cab+
        '<p class="sub" style="margin:0 0 12px">Presupuesto y permanentes son previsión; solo los '+
        'movimientos son dinero. El compromiso del rubro es el <b>mayor</b> entre presupuesto no gastado '+
        'y permanentes sin marcar — nunca la suma.</p>'+
        perF+movF+'</div>'+
      '<div class="mf"><button class="btn gh" data-acc="cerrar">Cerrar</button></div>', true);
    return;
  }
  else if(cual==="rubro"){ titulo="Gasto real &middot; "+extra;
    lista=movsDe(k).filter(function(m){ return m.tipo!=="Ingreso" && (m.cat||"Sin categoría")===extra; });
    lista.forEach(function(m){ total+=cts(m.monto); }); total/=100;
    formula="Suma de los "+lista.length+" movimientos de la ventana en este rubro."; }

  var cuerpo;
  if(lineas){
    cuerpo=lineas.length? '<div class="tabla-cont"><table><thead><tr>'+
      '<th class="plano">Concepto</th><th class="plano">Detalle</th><th class="plano" style="text-align:right">Monto</th>'+
      '</tr></thead><tbody>'+lineas.map(function(x){
        return '<tr><td style="padding:5px 8px">'+esc(x.t)+'</td>'+
          '<td style="padding:5px 8px" class="sub">'+(x.n||"")+'</td>'+
          '<td style="padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums">'+fmt(x.v)+'</td></tr>';
      }).join("")+'</tbody></table></div>' : '';
    abreModal('<div class="mh"><h3>'+esc(titulo)+'</h3><div class="sp"></div><button class="icb" data-acc="cerrar">×</button></div>'+

      '<div class="desg-frm">'+formula+'</div>'+cuerpo+'</div>'+
      '<div class="mf"><button class="btn gh" data-acc="cerrar">Cerrar</button></div>', true);
    return;
  }
  lista=lista.slice().sort(function(a,b){ return String(a.fecha)<String(b.fecha)?-1:1; });
  var filas=lista.map(function(m){
    return '<tr><td style="padding:5px 8px;white-space:nowrap">'+esc(fmtF(m.fecha))+'</td>'+
      '<td style="padding:5px 8px">'+esc(m.desc||"(sin descripción)")+
        (m.motivo?' <span class="sub">· '+esc(m.motivo)+'</span>':'')+
        (m.permId?' <span class="chip ok">permanente</span>':'')+'</td>'+
      '<td style="padding:5px 8px" class="sub">'+esc(m.cat||"")+'</td>'+
      '<td style="padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums'+(cts(m.monto)<0?";color:var(--mal)":"")+'">'+
        (m.tipo==="Ingreso"?"+":"")+fmt(m.monto)+'</td></tr>';
  }).join("");

  abreModal('<div class="mh"><h3>'+esc(titulo)+'</h3><div class="sp"></div><button class="icb" data-acc="cerrar">×</button></div>'+
    '<div class="mb" data-t="modalDesglose">'+
      '<div class="desg-tot">'+fmt(total,cual==="queda")+'</div>'+
      '<div class="desg-frm">'+formula+'</div>'+
      (lista.length?'<div class="tabla-cont"><table><thead><tr>'+
        '<th class="plano">Fecha</th><th class="plano">Descripción</th><th class="plano">Categoría</th><th class="plano" style="text-align:right">Monto</th>'+
      '</tr></thead><tbody>'+filas+'</tbody></table></div>':'<p class="sub">No hay movimientos que compongan este número.</p>')+
    '</div>'+
    '<div class="mf"><button class="btn gh" data-acc="cerrar">Cerrar</button></div>', true);
}

   ORDEN DE LAS LISTAS (categorías y formas de pago)
   El desplegable se dibuja recorriendo el arreglo en orden (ver opciones()),
   así que reordenar el arreglo es todo lo que hace falta: no hay campo "orden"
   ni índice aparte que mantener sincronizado.

/* Redibuja la libreta de tarjetas sin perder el scroll del modal. Mismo patrón
   que reListas: el modal se rehace entero, así que hay que devolver el scroll. */
function reTarjetas(alFinal){
  var vp=document.querySelector('[data-t="modalAjustes"]');
  var y=vp?vp.scrollTop:0;
  abreAjustes("tarjetas");
  var v2=document.querySelector('[data-t="modalAjustes"]');
  if(!v2) return;
  if(alFinal){
    v2.scrollTop=v2.scrollHeight;
    var fs=v2.querySelectorAll("tr[data-tj]");
    var ul=fs[fs.length-1], inp=ul&&ul.querySelector('[data-tc="nombre"]');
    if(inp) inp.focus();
  } else v2.scrollTop=y;
}
function reListas(){                        /* redibuja la sección sin perder el scroll */
  var vp=document.querySelector('[data-t="modalAjustes"]');
  var y=vp?vp.scrollTop:0;
  abreAjustes("listas");
  var v2=document.querySelector('[data-t="modalAjustes"]');
  if(v2) v2.scrollTop=y;
}
function mueveLista(campo,de,a){
  var L=S[campo];
  if(!L||de<0||de>=L.length) return false;
  if(a<0) a=0; if(a>L.length-1) a=L.length-1;
  if(a===de) return false;
  L.splice(a,0,L.splice(de,1)[0]);
  guardar(); render(); reListas();
  return true;
}
var arrLista=null;                          /* {campo, de} mientras se arrastra */
function arrLimpia(){
  var m=document.querySelectorAll(".lista-cfg .it.sobre,.lista-cfg .it.sobre-ab,.lista-cfg .it.arr");
  for(var i=0;i<m.length;i++) m[i].classList.remove("sobre","sobre-ab","arr");
}
function arrFin(){ arrLista=null; arrLimpia(); }
function arrFila(ev){                       /* fila de la MISMA lista que se arrastra */
  var t=ev.target, it=t&&t.closest?t.closest(".it"):null;
  if(!it) return null;
  var cl=it.closest("[data-lista]");
  if(!cl||!arrLista||cl.getAttribute("data-lista")!==arrLista.campo) return null;
  return it;
}
document.addEventListener("dragstart", function(ev){
  var t=ev.target;
  if(!t||!t.classList||!t.classList.contains("asa")) return;
  var it=t.closest(".it"), cl=it&&it.closest("[data-lista]");
  if(!it||!cl) return;
  arrLista={campo:cl.getAttribute("data-lista"), de:+it.getAttribute("data-i")};
  it.classList.add("arr");
  try{ ev.dataTransfer.effectAllowed="move"; ev.dataTransfer.setData("text/plain","lista"); }catch(e){}
});
document.addEventListener("dragover", function(ev){
  var it=arrFila(ev); if(!it) return;
  ev.preventDefault();
  try{ ev.dataTransfer.dropEffect="move"; }catch(e){}
  var r=it.getBoundingClientRect(), abajo=(ev.clientY-r.top)>r.height/2;
  var m=document.querySelectorAll(".lista-cfg .it.sobre,.lista-cfg .it.sobre-ab");
  for(var i=0;i<m.length;i++) m[i].classList.remove("sobre","sobre-ab");
  if(+it.getAttribute("data-i")!==arrLista.de) it.classList.add(abajo?"sobre-ab":"sobre");
});
document.addEventListener("drop", function(ev){
  var it=arrFila(ev);
  if(!it){ arrFin(); return; }
  ev.preventDefault();
  var r=it.getBoundingClientRect(), abajo=(ev.clientY-r.top)>r.height/2;
  var sobre=+it.getAttribute("data-i"), de=arrLista.de, campo=arrLista.campo;
  var a=abajo?sobre+1:sobre;   /* punto de inserción contando la fila arrastrada */
  if(de<a) a--;                /* al sacarla, todo lo de abajo sube un lugar */
  arrLista=null; arrLimpia();
  mueveLista(campo,de,a);
});
document.addEventListener("dragend", function(){ arrFin(); });

function importarJSON(txt){
  var d;
  try{ d=JSON.parse(txt); }catch(e){ toast("No pude leer el archivo: no es un JSON válido."); return; }
  if(!d||typeof d!=="object"){ toast("El archivo no tiene la forma esperada."); return; }
  var esRespaldo=!!(d.v&&Array.isArray(d.ventanas)&&Array.isArray(d.movimientos));
  if(!esRespaldo&&!Array.isArray(d.movimientos)&&!Array.isArray(d.permanentes)){
    toast("El archivo no trae movimientos ni permanentes."); return; }
  /* Importar REEMPLAZA todo. Nunca en silencio. */
  if(S.movimientos.length||S.ventanas.length){
    if(!confirm("Importar reemplaza TODO lo que hay ahora:\n\n"+
      "  · "+S.movimientos.length+" movimiento(s)\n"+
      "  · "+S.ventanas.length+" ventana(s)\n"+
      "  · "+Object.keys(S.perms).reduce(function(a,x){return a+S.perms[x].length;},0)+" permanente(s) y los presupuestos\n\n"+
      "La operación no se puede deshacer. Para conservarlo: cancelar y usar Ajustes → Descargar respaldo.\n\n¿Continuar?")) return;
  }

  /* respaldo de esta misma app */
  if(d.v && Array.isArray(d.ventanas) && Array.isArray(d.movimientos)){
    S=d; cargarNormaliza(); guardar(); cierraModal(); render();
    toast("Respaldo restaurado: "+S.movimientos.length+" movimientos en "+S.ventanas.length+" ventana(s)."); return;
  }
  /* semilla */
  var anio=(d.ventana&&d.ventana.anio)||new Date().getFullYear();
  var per=(d.ventana&&d.ventana.per)||"Ene-Feb";
  var k=K(anio,per);

  S=estadoVacio();
  S.formas=(d.formas||[]).slice();
  S.catE=(d.catE||[]).slice();
  S.catI=(d.catI||[]).slice();
  S.catIcons=d.catIcons||{};
  S.tarjetas=(d.tarjetas||[]).slice();
  var permsSemilla=(d.permanentes||[]).map(function(f,i){
    var o=JSON.parse(JSON.stringify(f));
    o.id=o.id||("p"+i+"_"+Math.random().toString(36).slice(2,7));
    o.tipo=o.tipo||"Egreso"; o.monto=+o.monto||0;
    if(o.activo!==false) o.activo=true;
    delete o.alias; delete o.desde;
    return o;
  });
  S.movimientos=(d.movimientos||[]).map(function(m,i){
    return {id:m.id||("s"+i), k:k, fecha:m.fecha||"", tipo:m.tipo||"Egreso",
            desc:m.desc||"", monto:red(+m.monto||0), cat:m.cat||"", pago:m.pago||"",
            nota:m.nota||"", motivo:"", fx:"", permId:null, origen:"semilla"};
  });
  S.ventanas=[{anio:anio, per:per}];
  S.perms[k]=permsSemilla;
  S.ui.anio=anio; S.ui.per=per; S.ui.tab="hoy";

  cargarNormaliza(); guardar(); cierraModal(); render();
  var t=totales(k);
  toast(S.movimientos.length+" movimientos &middot; "+permsK(k).length+" permanentes &middot; "+
        per+" "+anio+" queda "+fmt(t.queda,true), 6000);
}
function cargarNormaliza(){
  var vac=estadoVacio();
  for(var kk in vac) if(!(kk in S)) S[kk]=vac[kk];
  for(var u in vac.ui) if(!(u in S.ui)) S.ui[u]=vac.ui[u];
  S.ui.busca="";                               /* la búsqueda no sobrevive a la recarga */
  normalizaTarjetas();
  /* La descripción del banco se conserva intacta (de ella dependen la detección de
     repetidas y la sugerencia de categoría). "motivo" es el texto de Victor y "fx"
     el sello de conversión que pone la app. Migración de la vieja columna "nota". */
  S.movimientos.forEach(function(m){
    if("nota" in m){
      if(m.nota){
        if(/@/.test(m.nota) && /USD|CAD|EUR/i.test(m.nota)) m.fx=m.fx||m.nota;
        else m.motivo=m.motivo||m.nota;
      }
      delete m.nota;                           /* el campo viejo desaparece del todo */
    }
    if(m.motivo==null) m.motivo="";
    if(m.fx==null) m.fx="";
  });
  /* Vínculos de reembolso que apuntan a un movimiento borrado (revertir un
     bloque, borrar una ventana, respaldo editado a mano): se sueltan. */
  var vivos={};
  S.movimientos.forEach(function(m){ vivos[m.id]=1; });
  S.movimientos.forEach(function(m){ if(m.reembDe && !vivos[m.reembDe]) delete m.reembDe; });
  if(!S.catE.length) S.catE=CAT_E_BASE.slice();
  if(!S.catI.length) S.catI=CAT_I_BASE.slice();
  if(!Array.isArray(S.prestamos)) S.prestamos=[];
  if(!Array.isArray(S.bitacora)) S.bitacora=[];
  if(!S.prestamos.length && !S.prefs.sinPrestamoBase) S.prestamos=JSON.parse(JSON.stringify(PRESTAMO_BASE));
  /* Nunca dejar plata invisible: si un movimiento apunta a una ventana que no existe
     (respaldo editado a mano, archivo truncado), se crea la ventana para que aparezca. */
  var huerfanos={};
  S.movimientos.forEach(function(m){
    if(!m.k) return;
    if(!S.ventanas.some(function(v){ return K(v.anio,v.per)===m.k; })) huerfanos[m.k]=(huerfanos[m.k]||0)+1;
  });
  var nh=Object.keys(huerfanos);
  if(nh.length){
    nh.forEach(function(k){
      var p=k.split("|"), a=parseInt(p[0],10);
      S.ventanas.push({anio:isNaN(a)?0:a, per:p[1]||"?"});
    });
    setTimeout(function(){
      toast("Creé "+nh.length+" ventana(s) para movimientos huérfanos: "+nh.join(", "),8000);
    },400);
  }
  ordenaVentanas();
  if(!S.ventanas.length){ S.ui.anio=null; S.ui.per=null; return; }
  var hay=S.ventanas.some(function(v){ return K(v.anio,v.per)===kAct(); });
  if(!hay){ var v=S.ventanas[S.ventanas.length-1]; S.ui.anio=v.anio; S.ui.per=v.per; }
  /* Migración desde la versión de lista global: se muda a la ventana activa. */
  if(Array.isArray(S.permanentes) && S.permanentes.length){
    var kk=kAct();
    if(kk && !(S.perms[kk]&&S.perms[kk].length)) S.perms[kk]=S.permanentes;
    S.permanentes=[];
  }
  Object.keys(S.perms).forEach(function(kk){
    S.perms[kk].forEach(function(f,i){
      if(!f.id) f.id="p"+i+"_"+Math.random().toString(36).slice(2,7);
      if(Array.isArray(f.alias)&&f.alias.length){    /* alias viejos → mapa global */
        S.alias[f.id]=Array.from(new Set(aliasDe(f.id).concat(f.alias)));
        delete f.alias;
      }
    });
  });
}
function exportar(){
  var txt=JSON.stringify(S,null,1);
  var nom="respaldo_finanzas_"+hoyISO()+".json";
  try{
    var b=new Blob([txt],{type:"application/json"}), u=URL.createObjectURL(b);
    var a=document.createElement("a"); a.href=u; a.download=nom;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
    toast("Respaldo descargado");
  }catch(e){ verJSON(); }
}

    esc(JSON.stringify(S))+'</textarea></div>'+

function pedirArchivo(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){ importarJSON(String(fr.result)); };
    fr.onerror=function(){ toast("No pude leer el archivo."); };
    fr.readAsText(f);
  };
  inp.click();
}

/* Anotar un gasto en el momento — típicamente efectivo. Un renglón fijo arriba
   de la tabla: descripción, monto, Enter, y sigue listo para el siguiente. */
function anotarRapido(){
  var q=S.prefs.qa||(S.prefs.qa={});
  var fe=$("#qaFecha").value, de=String($("#qaDesc").value||"").trim();
  q.tipo=$("#qaTipo").value; q.fecha=fe; q.cat=$("#qaCat").value; q.pago=$("#qaPago").value;
  q.mon=($("#qaMon")||{value:"Lps"}).value||"Lps";
  var cv=montoLps($("#qaMonto").value+" "+(q.mon==="Lps"?"":q.mon));
  var falta=[];
  if(!fe) falta.push("la fecha");
  if(!de) falta.push("la descripción");
  if(!cts(cv.lps)) falta.push("el monto");
  if(falta.length){ guardar(); toast("Falta "+falta.join(" y ")); return; }
  if(cv.mon!=="Lps"&&!cv.tasa){ toast("Sin tasa para "+cv.mon+" · cargarla en el tipo de cambio",5000); return; }
  /* Mismo aviso que en el pegado, ahora también en el alta de a uno: si ya hay
     un movimiento igual a pocos días, se pregunta antes de crear el segundo. */
  var gem=bRepetida({fecha:fe, desc:de, monto:String(cv.lps)});
  if(gem && !confirm("Posible duplicado.\n\nYa hay un movimiento «"+(gem.mov.desc||"")+"» por "+
      fmt(gem.mov.monto)+" del "+fmtF(gem.mov.fecha)+
      (gem.otra?" en "+nomVentana(gem.k):" en esta ventana")+
      (gem.dias?" ("+gem.dias+" día"+(gem.dias===1?"":"s")+" de diferencia)":"")+".\n\n"+
      "¿Registrar este de todas formas?")) return;
  var mvR={id:id(), k:kAct(), fecha:fe, tipo:q.tipo, desc:de, monto:cv.lps,
    cat:q.cat||"", pago:q.pago||"", motivo:"", fx:notaFX(cv), permId:null, origen:"manual"};
  S.movimientos.push(mvR);
  anota("individual","Alta rápida · "+de, [mvR], []);
  guardar(); render();
  toast("Registrado &middot; "+fmt(cv.lps)+(cv.mon!=="Lps"?" ("+notaFX(cv)+")":""));
  var d=$("#qaDesc"); if(d) d.focus();
}
function borrarMovimiento(mid){

  S.movimientos=S.movimientos.filter(function(x){return x.id!==mid;});
  reembOlvida(mid);                      /* no dejar vínculos colgando */
  guardar(); render();
}
/* =============================================================================
   BITÁCORA
   Cada guardado deja una fila. Sirve para una cosa concreta: si un bloque entero
   entró en la ventana equivocada, revertirlo de un golpe en vez de borrar fila
   por fila. Se anota qué movimientos creó y qué permanentes dio de alta, que es
   lo único que hay que deshacer.
============================================================================= */
function anota(tipo,detalle,movs,permsNuevos){
  var m=(movs||[]).filter(Boolean);
  var tot=0; m.forEach(function(x){ tot+=cts(x.monto); });
  S.bitacora.unshift({id:"b"+id(), ts:new Date().toISOString(), k:kAct(),
    tipo:tipo, detalle:detalle||"", n:m.length, monto:tot/100,
    movs:m.map(function(x){ return x.id; }),
    permsNuevos:(permsNuevos||[]).slice(), revertido:false});
  if(S.bitacora.length>300) S.bitacora.length=300;
}
function bitVivos(e){
  var vivos=[];
  (e.movs||[]).forEach(function(mid){
    var m=S.movimientos.filter(function(x){ return x.id===mid; })[0];
    if(m) vivos.push(m);
  });
  return vivos;
}
function revertirBit(bid){
  var e=S.bitacora.filter(function(x){ return x.id===bid; })[0];
  if(!e || e.revertido) return;
  var vivos=bitVivos(e), faltan=(e.movs||[]).length-vivos.length, tot=0;
  vivos.forEach(function(m){ tot+=cts(m.monto); });
  var pn=(e.permsNuevos||[]).filter(function(pid){
    return permsK(e.k).some(function(p){ return p.id===pid; });
  });
  if(!vivos.length && !pn.length){
    e.revertido=true; guardar(); render();
    toast("No quedaba nada que revertir: esos movimientos ya no existen"); return;
  }
  if(!confirm("Revertir «"+(e.detalle||e.tipo)+"» de "+nomVentana(e.k)+"?\n\n"+
      "Se eliminan "+vivos.length+" movimiento(s) por "+fmt(tot/100)+
      (pn.length?"\nY se quitan "+pn.length+" permanente(s) que ese guardado dio de alta.":"")+
      (faltan?"\n\n"+faltan+" ya no existían: se borraron o se editaron aparte.":"")+
      "\n\nEsto no se puede deshacer.")) return;
  var ids={}; vivos.forEach(function(m){ ids[m.id]=1; });
  S.movimientos=S.movimientos.filter(function(m){ return !ids[m.id]; });
  pn.forEach(function(pid){
    if(movDePerm(e.k,pid)) return;                 /* quedó ligado a otro cobro: se respeta */
    S.perms[e.k]=permsK(e.k).filter(function(p){ return p.id!==pid; });
  });
  e.revertido=true; e.revertidoTs=new Date().toISOString();
  guardar(); render(); abreAjustes("bitacora");
  toast("Revertido &middot; "+vivos.length+" movimiento(s) eliminados por "+fmt(tot/100),6000);
}

/* --- REGLA 2: esto ocurre SOLO cuando Victor toca la casilla --- */
function marcarPermanente(pid,on){
  var k=kAct(), f=permsK(k).filter(function(x){return x.id===pid;})[0];
  if(!f) return;
  var mv=movDePerm(k,pid);
  if(on){
    if(mv) return;
    /* Si en esta ventana ya hay plata registrada en ese rubro sin ligar a nadie,
       marcar la casilla la cuenta OTRA VEZ. En un préstamo eso además hace
       avanzar el plan de pagos una cuota de más. Se pregunta; no se decide. */
    var gemelos=sueltoIgual(k,f);
    if(gemelos.length && !confirm(
        "Posible doble conteo.\n\nEn "+S.ui.per+" "+S.ui.anio+" ya hay "+gemelos.length+
        " movimiento(s) del mismo rubro y con un importe que calza, sin ligar a ningún permanente:\n\n"+
        gemelos.slice(0,4).map(function(m){
          return "  · "+(m.desc||"(sin descripción)")+" · "+fmt(m.monto)+" · "+fmtF(m.fecha);
        }).join("\n")+(gemelos.length>4?"\n  · …":"")+"\n\n"+
        "Marcar esta casilla registra "+fmt(f.monto)+" ADEMÁS de eso. Si es el mismo cobro, "+
        "quedaría contado dos veces.\n\n"+
        "Si ese cargo ya entró, en vez de marcar conviene ligarlo desde su fila en Movimientos.\n\n"+
        "¿Marcar igual?")){
      var cb0=document.querySelector('.perm-fila[data-pid="'+pid+'"] input[data-c="marca"]');
      if(cb0) cb0.checked=false;
      return;
    }
    var mvP={id:id(), k:k, fecha:hoyISO(), tipo:f.tipo||"Egreso",
      desc:f.desc||f.cat||"", monto:red(+f.monto||0), cat:f.cat||"", pago:f.pago||"",
      motivo:f.motivo||"", fx:"", permId:pid, origen:"perm"};
    S.movimientos.push(mvP);
    anota("permanente","Permanente marcado · "+(f.desc||f.cat||""), [mvP], []);
    toast("Movimiento registrado &middot; "+fmt(f.monto));
    guardar(); render();
    pideCuotas(pid);                      /* si es financiamiento sin cuotas, las pide */
    return;
  } else {
    if(!mv) return;
    if(mv.origen==="perm"){
      /* Si lo editaste, ya no es la plantilla: es tu dato. No lo borro sin preguntar. */
      if(mv.editado && !confirm("El movimiento «"+(mv.desc||"")+"» por "+fmt(mv.monto)+
          " fue editado a mano después de marcarlo.\n\nDesmarcar la casilla lo elimina. ¿Eliminarlo?")){
        var cb=document.querySelector('.perm-fila[data-pid="'+pid+'"] input[type=checkbox]');
        if(cb) cb.checked=true;
        return;
      }
      S.movimientos=S.movimientos.filter(function(x){return x.id!==mv.id;});
      toast("Movimiento borrado");
    } else {
      /* Vino del banco: se desliga, NO se borra la plata real. Hay que decirlo
         fuerte — si él creía que lo borraba y vuelve a marcar, el gasto queda
         contado dos veces (y en un préstamo, el plan avanza una cuota de más). */
      mv.permId=null;
      toast("Desvinculado &middot; el movimiento de "+fmt(mv.monto)+" SIGUE REGISTRADO en gastos, "+
            "porque vino del banco &middot; para eliminarlo, borrar su fila en Movimientos", 8000);
    }
  }
  guardar(); render();
}
/* Alta de un permanente NUEVO a partir de un gasto que ya se registró.
   Sirve cuando aparece un cobro que se va a repetir y todavía no está en la lista.
   Da de alta en ESTA ventana; las anteriores no se tocan. */
function permDesdeMov(k,src){
  var p={id:"p"+id(), tipo:src.tipo||"Egreso", desc:String(src.desc||"").trim(),
         motivo:String(src.motivo||"").trim(),
         monto:red(+src.monto||0), cat:src.cat||"", pago:src.pago||"", activo:true, ultimaCuota:""};
  permsK(k).push(p);
  return p;
}
function altaPermDesdeMov(mid){
  var m=S.movimientos.filter(function(x){return x.id===mid;})[0]; if(!m) return;
  if(m.permId){
    var yp=permsK(m.k).filter(function(x){return x.id===m.permId;})[0];
    if(!confirm("Este movimiento está ligado al permanente «"+(yp?(yp.desc||yp.cat):"?")+"».\n\n"+
                "Quitar el vínculo? El movimiento queda registrado igual; el permanente vuelve a contar como pendiente.")) return;
    m.permId=null; guardar(); render(); toast("Desvinculado &middot; el movimiento permanece registrado");
    return;
  }
  if(!String(m.desc||"").trim() && !cts(m.monto)){ toast("Falta descripción o monto para darlo de alta."); return; }
  var p=permDesdeMov(m.k,{tipo:m.tipo, desc:m.desc, monto:m.monto, cat:m.cat, pago:m.pago, motivo:m.motivo});
  m.permId=p.id; aprendeDePago(p,m);
  guardar(); render();
  toast("«"+(p.desc||p.cat)+"» dado de alta como permanente &middot; ya cuenta como pagado en esta ventana",5500);
  pideCuotas(p.id, String(m.fecha||"").slice(0,7));
}
function nuevoPermanente(tipo){
  var nid="p"+id();
  permsK(kAct()).push({id:nid, tipo:(tipo==="Ingreso"?"Ingreso":"Egreso"),
    desc:"", motivo:"", monto:0, cat:"", pago:"", activo:true, ultimaCuota:""});
  guardar(); render();
  /* Buscar por id, NUNCA por posición: la tabla va ordenada y el nuevo no
     queda al final — enfocar la última fila escribía sobre otro permanente. */
  var fila=document.querySelector('.perm-fila[data-pid="'+nid+'"]');
  if(fila){ fila.scrollIntoView({block:"center"}); var i=fila.querySelector('[data-c="desc"]'); if(i) i.focus(); }
}
function borrarPermanente(pid){
  var k=kAct(), f=permsK(k).filter(function(x){return x.id===pid;})[0]; if(!f) return;
  var mv=movDePerm(k,pid);
  if(!confirm("Quitar «"+(f.desc||f.cat)+"» de los permanentes de "+S.ui.per+" "+S.ui.anio+"?"+
      "\n\nSolo lo quita de esta ventana; las anteriores no se modifican."+
      (mv?"\nEl movimiento ya registrado NO se elimina: permanece en la ventana.":""))) return;
  if(mv) mv.permId=null;
  S.perms[k]=permsK(k).filter(function(x){return x.id!==pid;});
  guardar(); render();
}
/* Sembrar el presupuesto de una ventana con el piso de sus permanentes: lo que
   ya se sabe que hay que pagar queda presupuestado desde el arranque, en vez de
   empezar de cero cada período. No pisa nada: solo escribe donde no había
   presupuesto. Y no es dinero — el saldo real sigue saliendo solo de
   totales(); esto es la previsión, que es otra cosa. */
function sembrarPresupuesto(k){
  var p=presuDe(k), n=0, tot=0;
  rubrosDe(k).forEach(function(r){
    if(!(r.perm>0) || p[r.cat]!=null) return;
    p[r.cat]=r.perm; n++; tot+=cts(r.perm);
  });
  return {n:n, monto:red(tot/100)};
}
function nuevaVentana(){
  var n=siguienteVentana();
  S.ventanas.push(n); ordenaVentanas();
  var kN=K(n.anio,n.per);
  var r=heredarPermanentes(kN);          /* la lista de permanentes se hereda; el dinero NO */
  var sp=sembrarPresupuesto(kN);         /* y el presupuesto arranca en el piso de esos permanentes */
  S.ui.anio=n.anio; S.ui.per=n.per; S.ui.tab="hoy";
  guardar(); render();
  var m=n.per+" "+n.anio+" &middot; sin movimientos";
  if(r.n) m+=" &middot; heredados "+r.nI+" ingreso"+(r.nI===1?"":"s")+" y "+
             r.nE+" egreso"+(r.nE===1?"":"s")+" permanentes, ninguno marcado";
  if(sp.n) m+=" &middot; presupuesto sembrado en "+sp.n+" rubro"+(sp.n===1?"":"s")+
              " por "+fmt(sp.monto)+" (el piso de los permanentes)";
  if(r.vencidos.length) m+=" &middot; "+r.vencidos.length+" con última cuota vencida";
  toast(m, 9000);
}
function heredarAhora(tipo){
  var k=kAct(), r=heredarPermanentes(k,tipo);
  var q=tipo==="Ingreso"?"ingresos permanentes":(tipo?"egresos permanentes":"permanentes");
  if(!r.origen){ toast("No hay una ventana anterior de la cual heredar."); return; }
  if(!r.n){ toast("Nada nuevo que heredar en "+q+": ya están todos."); return; }
  guardar(); render();
  var m=r.n+" "+q+" heredados de "+r.origen.split("|")[1]+" "+r.origen.split("|")[0]+" &middot; ninguno marcado";
  if(r.vencidos.length) m+=" &middot; "+r.vencidos.length+" con última cuota vencida";
  toast(m, r.vencidos.length?8000:5000);
}

  if(acc==="lista-nuevo"){
    var campo=b.getAttribute("data-lista"); S[campo].push(""); guardar(); abreAjustes("listas");
    var cont=document.querySelector('[data-lista="'+campo+'"]');

  if(acc==="lista-abc"){

    S[cpa]=La.slice().sort(function(x,y){
      return String(x).localeCompare(String(y),"es",{sensitivity:"base"});

    if(S[cpa].join("")===prev){ toast("Ya estaba en orden alfabético."); return; }
    guardar(); render(); reListas(); toast("Lista ordenada A → Z");

  if(acc==="lista-borrar"){

        (uso?("\n\nEn uso por "+uso+" movimiento(s). No se modifican: conservan ese nombre; solo deja de ofrecerse en los desplegables."):"")))
      return;
    S[cp].splice(ix,1); guardar(); abreAjustes("listas"); return;
  }
  if(acc==="pegar-bloque"){ abrirPegado(); return; }

  /* --- grilla de pegado --- */
  if(!B) return;
  if(acc==="b-guardar"){ bGuardar(); return; }
  if(acc==="b-borrar"){
    var trb=b.closest("tr[data-b]");

    });
    B.fuera=[];
    B.filas=B.filas.filter(function(f){ return !bVacia(f); }).concat(traer);

  if(acc==="b-perm-monto" || acc==="b-perm-pago"){

    }

    return;

/* --- ediciones en su lugar --- */
document.addEventListener("input", function(ev){
  var t=ev.target;
  if(t.id==="buscaMov"){ S.ui.busca=t.value; guardar(); repintaTabla(); return; }
  /* la última cuota se recalcula mientras se escribe, no al salir de la celda */
  if(t.id==="cuAct"||t.id==="cuTot"||t.id==="cuMes"){ pintaCuotas(); return; }
  if(t.id==="avN"){ avDesdeCobros(); return; }
  if(t.id==="avCada"||t.id==="avMes"||t.id==="avDia"||t.id==="avDias"||t.id==="avBase"){ pintaAviso(); return; }
  /* el simulador de préstamos también responde mientras se escribe */
  var sm=t.getAttribute&&t.getAttribute("data-sim");
  if(sm){ var sp=t.getAttribute("data-pid");
    prSimDe(sp)[sm]=t.value; guardar(); repintaPrestamo(sp); return; }

  /* libreta de tarjetas: se guarda al escribir, sin redibujar (no hay número que
     dependa de esto, así que no hace falta re-render y no se pierde el foco) */
  var tc=t.getAttribute&&t.getAttribute("data-tc");
  if(tc){
    var trt=t.closest("tr[data-tj]"); if(!trt) return;
    var tjx=tarjetaDe(trt.getAttribute("data-tj")); if(!tjx) return;
    if(tc==="nombre"){
      var antTj=tjx.nombre;
      tjx.nombre=t.value;
      /* la marca de pago y la preferencia guardan el NOMBRE: si cambia, se sigue */
      if(antTj && antTj!==t.value){
        for(var kp in S.tjPago) if(S.tjPago[kp][antTj]){ S.tjPago[kp][t.value]=true; delete S.tjPago[kp][antTj]; }
        var P2=tjPref(); for(var rp in P2) if(P2[rp]===antTj) P2[rp]=t.value;
      }
    }
    else if(tc==="limite") tjx.limite=red(+String(t.value||"").replace(/[^\d.]/g,"")||0);
    else if(tc==="limMon") tjx.limMon=(FX_MONEDAS.indexOf(t.value)>=0)?t.value:"Lps";
    else if(tc==="tope") tjx.tope=red(+String(t.value||"").replace(/[^\d.]/g,"")||0);
    else{
      var vtj=String(t.value||"").replace(/[^\d]/g,"");
      if(vtj===""){ tjx[tc]=null; if(t.value!=="") t.value=""; }
      else{ var ntj=Math.max(1,Math.min(31,parseInt(vtj,10)||1)); tjx[tc]=ntj;
            if(String(ntj)!==t.value) t.value=String(ntj); }
    }
    guardar(); return;
  }
  var tbn=t.getAttribute&&t.getAttribute("data-tb");
  if(tbn){
    var trb2=t.closest("tr[data-tj]"), bd2=t.closest(".tj-b");
    if(!trb2||!bd2) return;
    var tjy=tarjetaDe(trb2.getAttribute("data-tj")); if(!tjy) return;
    var be=tjy.benes[+bd2.getAttribute("data-bj")]; if(!be) return;
    if(tbn==="que") be.que=t.value;
    else be[tbn]=red(+String(t.value||"").replace(/[^\d.]/g,"")||0);
    guardar(); return;
  }

  var bc=t.getAttribute&&t.getAttribute("data-bc");
  if(bc && B){                                  /* grilla de pegado: no se guarda nada todavía */
    var trb=t.closest("tr[data-b]"); if(!trb) return;
    var fb=B.filas[+trb.getAttribute("data-b")]; if(!fb||bc==="marcar") return;
    if(bc==="cat"){ fb.cat=t.value; fb.catManual=true; fb.catAuto=null;
      t.classList.remove("auto"); t.title=""; }
    else fb[bc]=t.value;
    if(bc==="fecha"){ bRecalcula(fb); bRepeEnBloque(); }  /* la fecha decide si ya está registrada */
    bResumen();
    if(bc==="fecha"||bc==="pago"){ bRepintaFila(+trb.getAttribute("data-b")); bRepintaEstados(); }
    return;

    if(!conv) return;
    var trm=t.closest("tr[data-id]"), prm=t.closest(".perm-fila"), trb=t.closest("tr[data-b]");
    if(trm){
      var mm2=S.movimientos.filter(function(x){return x.id===trm.getAttribute("data-id");})[0];

      var pf3=permsK(kAct()).filter(function(x){return x.id===prm.getAttribute("data-pid");})[0];
      if(!pf3) return;
      pf3.monto=conv.lps; pf3.moneda=conv.mon; pf3.montoOrig=conv.orig; pf3.fx=notaFX(conv);
    } else if(trb && B){
      var fb2=B.filas[+trb.getAttribute("data-b")];

      fb2.monto=String(conv.lps); fb2.moneda="Lps";
      fb2.origMon=conv.mon; fb2.origVal=conv.orig; fb2.tasa=conv.tasa;

  }
  var pf=t.closest(".perm-fila");

    if(!f||c==="marca"||c==="activo") return;
    f[c]= c==="monto" ? parseMonto(t.value) : t.value;

    if(c==="cat" && esFinanciamiento(f) && movDePerm(kAct(),f.id) && faltaCuotas(f)){
      render(); pideCuotas(f.id); return;

    if(v>0){ S.fx[mm]=v; S.fx.src="manual"; S.fx.fecha=hoyISO(); S.fx.ts=new Date().toISOString();
      guardar(); pintaFX();
      var eq=trf.children[2]; if(eq) eq.textContent="1 "+mm+" = "+fmt(v); }

    if(!li||!cont) return;
    S[cont.getAttribute("data-lista")][+li.getAttribute("data-i")]=t.value;
    guardar(); return;

  /* El año y el período NO se tocan en cada tecla: se aplican al salir de la celda
     (ver el handler de "change"). Si no, "2027" pasaría por 2, 20 y 202 remapeando
     los movimientos tres veces y dejando basura grabada en disco. */
});
