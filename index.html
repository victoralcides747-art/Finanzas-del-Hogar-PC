/* =============================================================================
   PRÉSTAMOS · control propio, aparte del estado de cuenta
   No toca el dinero de ninguna ventana: es información de referencia.
   El gasto mensual se registra completo en movimientos; acá solo entra la parte
   que va a la cuota del préstamo.

   Todo arranca de un ANCLA verificable: el saldo del último estado de cuenta y
   su fecha. De ahí en adelante se amortiza mes a mes:
       interés del mes = saldo × (tasa anual / 12)
       capital del mes = cuota − interés
   Los abonos a capital NO se inventan: salen de los movimientos registrados con
   el rubro que tenga configurado el préstamo, y solo los posteriores al ancla
   (los anteriores ya están dentro del saldo de referencia).
============================================================================= */
function prTasaMes(p){ return (+p.tasaAnual||0)/100/12; }
function mesDe(f){ return String(f||"").slice(0,7); }
function mesesEntre(a,b){                       /* b − a, en meses */
  var x=String(a||"").split("-"), y=String(b||"").split("-");
  var xa=parseInt(x[0],10), xm=parseInt(x[1],10), ya=parseInt(y[0],10), ym=parseInt(y[1],10);
  if(isNaN(xa)||isNaN(xm)||isNaN(ya)||isNaN(ym)) return null;
  return (ya*12+ym)-(xa*12+xm);
}
/* Pagos REALES posteriores al ancla: movimientos registrados, nada más.
   Una cuota es un movimiento con el rubro de la cuota; un abono, uno con el
   rubro de abonos. Ordenados por fecha, que es el orden en que ocurrieron. */
function prEventos(p){
  var cq=String(p.catCuota||"").trim(), ca=String(p.catAbono||"").trim();
  var corte=String(p.fechaRef||""), ev=[];
  if(!cq&&!ca) return ev;
  S.movimientos.forEach(function(m){
    if((m.tipo||"Egreso")==="Ingreso") return;
    var f=String(m.fecha||""); if(!f || (corte && f<=corte)) return;
    var c=String(m.cat||"").trim();
    if(cq && c===cq)      ev.push({t:"cuota", fecha:f, monto:cts(m.monto), id:m.id, k:m.k, desc:m.desc||""});
    else if(ca && c===ca) ev.push({t:"abono", fecha:f, monto:cts(m.monto), id:m.id, k:m.k, desc:m.desc||""});
  });
  ev.sort(function(a,b){ return a.fecha<b.fecha?-1:(a.fecha>b.fecha?1:0); });
  return ev;
}
/* Plan de pagos en dos tramos:
     1 · REGISTRADO — un paso por cada pago que existe como movimiento. Ningún
         pago se da por hecho: si el mes no se registró, la cuenta no avanza.
     2 · PROYECTADO — de ahí en adelante, un mes por cuota. Es pronóstico y se
         muestra como tal; nunca se suma a lo pagado.
   ex = escenario del simulador: {unico:{mes,monto}, mensual, cuota}          */
function prPlan(p,ex){
  ex=ex||{};
  var i=prTasaMes(p), sal=cts(p.saldoRef), cuo=cts(p.cuota);
  var cuoP=cts(ex.cuota!=null&&ex.cuota!==""?ex.cuota:p.cuota);
  var filas=[], intReg=0, abReg=0, nCuo=0;
  if(!(sal>0)) return {filas:[], nReg:0, nCuotasReg:0, saldoHoy:red(sal/100), intReg:0, abonosReg:0,
                       n:0, interes:0, abonos:0, ultima:"", saldo:red(sal/100), corta:false};
  if(cuo>0) prEventos(p).forEach(function(e){
    if(sal<=0) return;
    if(e.t==="abono"){
      var ab=Math.min(e.monto,sal); if(ab<=0) return;
      sal-=ab; abReg+=ab;
      filas.push({mes:mesDe(e.fecha), fecha:e.fecha, reg:true, tipo:"abono",
                  mid:e.id, mk:e.k, mdesc:e.desc,
                  interes:0, capital:0, abono:ab/100, saldo:sal/100});
      return;
    }
    var it=Math.round(sal*i), cap=cuo-it;
    if(cap<0) cap=0; if(cap>sal) cap=sal;
    sal-=cap; intReg+=it; nCuo++;
    filas.push({mes:mesDe(e.fecha), fecha:e.fecha, reg:true, tipo:"cuota",
                mid:e.id, mk:e.k, mdesc:e.desc,
                interes:it/100, capital:cap/100, abono:0, saldo:sal/100});
  });
  var nReg=filas.length, saldoHoy=sal;
  /* de acá en adelante es pronóstico */
  var ultimo=filas.length? filas[filas.length-1].mes : mesDe(p.fechaRef);
  var mes=mesMas(ultimo,1), hoy=mesDe(hoyISO());
  if(mes<hoy) mes=hoy;                       /* el pronóstico no arranca en el pasado */
  var intP=0, abP=0, n=0, corta=false;
  if(cuoP>0 && mes) while(sal>0 && n<720){
    var itp=Math.round(sal*i);
    var extra=(ex.mensual?cts(ex.mensual):0)+((ex.unico&&ex.unico.mes===mes)?cts(ex.unico.monto):0);
    var cp=cuoP-itp;
    if(cp<0) cp=0;
    if(cp+extra<=0){ corta=true; break; }
    if(cp>sal){ cp=sal; extra=0; } else if(cp+extra>sal) extra=sal-cp;
    if(extra<0) extra=0;
    sal-=cp+extra; intP+=itp; abP+=extra;
    filas.push({mes:mes, reg:false, tipo:"cuota", interes:itp/100, capital:cp/100, abono:extra/100, saldo:sal/100});
    mes=mesMas(mes,1); n++;
  }
  else if(sal>0) corta=true;
  return {filas:filas, nReg:nReg, nCuotasReg:nCuo, saldoHoy:red(saldoHoy/100),
          intReg:red(intReg/100), abonosReg:red(abReg/100),
          n:n, interes:red(intP/100), abonos:red(abP/100),
          ultima:(!corta&&filas.length)? filas[filas.length-1].mes : "",
          saldo:red(sal/100), corta:corta};
}
/* Dónde está el préstamo: exactamente donde lo dejaron los pagos registrados. */
function prHoy(p,pl){
  pl=pl||prPlan(p,null);
  var saldo=pl.saldoHoy;
  return {saldo:saldo, pasadas:pl.nCuotasReg, pagadas:(+p.cuotasRef||0)+pl.nCuotasReg,
          restantes:pl.n, ultima:pl.ultima,
          capPagado:red((+p.monto||0)-saldo),
          intPagado:red((+p.intRef||0)+pl.intReg),
          intFalta:pl.interes,
          totalFalta:red(saldo+pl.interes),
          conRubro:!!String(p.catCuota||"").trim()};
}

/* ---------- ventanas ---------- */
var PERIODOS=["Ene-Feb","Feb-Mar","Mar-Abr","Abr-May","May-Jun","Jun-Jul","Jul-Ago","Ago-Sep","Sep-Oct","Oct-Nov","Nov-Dic","Dic-Ene"];
function ordenaVentanas(){
  S.ventanas.sort(function(a,b){
    if(a.anio!==b.anio) return a.anio-b.anio;
    return PERIODOS.indexOf(a.per)-PERIODOS.indexOf(b.per);
  });
}
function siguienteVentana(){
  ordenaVentanas();
  var u=S.ventanas[S.ventanas.length-1];
  if(!u) return {anio:new Date().getFullYear(),per:"Ene-Feb"};
  var i=PERIODOS.indexOf(u.per), anio=u.anio, per;
  if(i<0||i===PERIODOS.length-1){ per=PERIODOS[0]; anio=u.anio+1; } else per=PERIODOS[i+1];
  return {anio:anio,per:per};
}

/* ---------- categorías y presupuestos ---------- */
function catsDe(tipo){ return (tipo==="Ingreso"? S.catI : S.catE).slice(); }
function presuDe(k){ if(!S.presu[k]) S.presu[k]={}; return S.presu[k]; }
function rubrosDe(k){
  var p=presuDe(k), usadas={}, out=[];
  movsDe(k).forEach(function(m){ if(m.tipo!=="Ingreso") usadas[m.cat||"Sin categoría"]=1; });
  var nombres=S.catE.slice();
  Object.keys(usadas).forEach(function(c){ if(nombres.indexOf(c)<0) nombres.push(c); });
  Object.keys(p).forEach(function(c){ if(nombres.indexOf(c)<0) nombres.push(c); });
  permsActivos(k).forEach(function(f){ if((f.tipo||"Egreso")!=="Ingreso"){
    var c=f.cat||"Sin categoría"; if(nombres.indexOf(c)<0) nombres.push(c); } });
  nombres.forEach(function(c){
    var g=0, nm=0;
    movsDe(k).forEach(function(m){ if(m.tipo!=="Ingreso" && (m.cat||"Sin categoría")===c){ g+=cts(m.monto); nm++; } });
    /* Permanentes ACTIVOS del rubro: no son gasto todavía, pero son plata que ya
       tiene dueño. Se muestran aparte para poder presupuestar sobre ellos. */
    var pf=0, pp=0;
    permsDeRubro(k,c).forEach(function(f){
      pf+=cts(f.monto);
      if(!movDePerm(k,f.id)) pp+=cts(f.monto);
    });
    var tienePres = p[c]!=null && p[c]!=="";
    var pre = tienePres ? red(+p[c]||0) : null;
    /* Lo anotado en la app satélite que todavía no es movimiento. NO es dinero:
       no entra en totales() ni en compromiso(). Se guarda acá para que las dos
       tablas lo muestren igual y para poder presupuestarlo si él lo pide. */
    var ns=notasDeRubro(k,c), nt=ns.length? notasSuma(ns) : 0;
    out.push({cat:c, pres:pre, gastado:g/100, n:nm, perm:pf/100, permPend:pp/100,
              nNotas:ns.length, notas:nt,
              queda: pre==null?null:red(pre-g/100),
              quedaN: pre==null?null:red(pre-g/100-nt)});
  });
  return out;
}
/* ═════════════════ DINERO COMPROMETIDO — PRONÓSTICO, NUNCA UN GASTO ═════════
   Esto NO entra en totales(). Vive aparte y siempre rotulado como pronóstico.
   Por rubro, lo que falta por salir es lo MAYOR entre:
     · el presupuesto asignado que todavía no se gastó, y
     · los permanentes activos del rubro que todavía no se marcaron.
   Se toma el mayor, no la suma: el presupuesto de un rubro ya debería cubrir sus
   permanentes. Sumarlos sería contar el mismo dinero dos veces — que es
   exactamente como la app anterior llegó a los −35 mil.                        */
/* Ingreso que la ventana todavía espera: los ingresos permanentes activos que
   no se han marcado. Con el mismo cuidado que en los gastos — por categoría se
   descuenta lo que YA entró, porque si el ingreso se registró sin ligarlo a su
   permanente, sumarlo otra vez sería contar el mismo dinero dos veces.
   Nada de esto es dinero real: vive en la proyección. */
function ingresoPendiente(k){
  var porCat={}, det=[], tot=0;
  permsActivos(k).forEach(function(f){
    if((f.tipo||"Egreso")!=="Ingreso") return;
    if(movDePerm(k,f.id)) return;                       /* ya marcado: ya es real */
    /* La MISMA clave que los movimientos. Antes se caía al desc cuando el
       permanente no tenía rubro, y entonces la resta de abajo no calzaba nunca:
       el mismo sueldo quedaba contado como recibido Y como pendiente. */
    var c=f.cat||"Sin categoría";
    porCat[c]=(porCat[c]||0)+cts(f.monto);
  });
  var real={};
  movsDe(k).forEach(function(m){
    if((m.tipo||"Egreso")!=="Ingreso") return;
    /* Un ingreso ya ligado a un permanente no descuenta a los OTROS permanentes
       del mismo rubro: ese ya salió de porCat por su cuenta. Sin este filtro,
       dos sueldos en el mismo rubro con uno marcado escondían al otro. */
    if(m.permId) return;
    var c=m.cat||"Sin categoría"; real[c]=(real[c]||0)+cts(m.monto);
  });
  Object.keys(porCat).forEach(function(c){
    var v=porCat[c]-(real[c]||0);
    if(v>0){ tot+=v; det.push({cat:c, esperado:porCat[c]/100, recibido:(real[c]||0)/100, val:v/100}); }
  });
  det.sort(function(a,b){ return b.val-a.val; });
  return {pendiente:tot/100, det:det};
}
/* =============================================================================
   EL PISO DE PERMANENTES DEL PRESUPUESTO

   Un permanente activo es plata que ya se sabe que hay que pagar. No es un
   gasto —solo lo es cuando su casilla se marca—, pero sí es el mínimo sensato
   que ese rubro debería tener presupuestado.

   Por eso igualar el presupuesto al gasto real NUNCA baja de ahí: a mitad de
   ventana el gasto real de un rubro puede ser 0 y su permanente L 1,686, y
   dejar el presupuesto en 0 sería decir que ese rubro no cuesta nada.

   Ojo con lo que esto NO cambia: la proyección ya tomaba, rubro por rubro, el
   mayor entre presupuesto no gastado y permanentes sin marcar (ver
   compromiso()). Esto arregla la vista de Presupuesto contra real, no la
   plata — que sigue saliendo solo de totales().
============================================================================= */
function pisoPerm(k,cat){
  var c=0;
  permsDeRubro(k,cat).forEach(function(f){ c+=cts(f.monto); });
  return c/100;
}
/* ── LO QUE UN RUBRO VA A COSTAR EN LA VENTANA ────────────────────────────
   Antes se igualaba al MAYOR entre lo gastado y los permanentes del rubro. Eso
   falla justo donde más duele: Escuela tenía un permanente de L 15,111 sin
   pagar y L 4,968 de gastos de escuela que no eran ese permanente. El mayor de
   los dos es 15,111 — y el presupuesto ya estaba comido antes de pagar la
   matrícula.

   Los tres números no se pisan y por eso se SUMAN:
     · lo gastado, que ya salió;
     · los permanentes que todavía no se pagaron;
     · lo anotado en notas que todavía no se registró.
   Un permanente YA pagado no se suma: su importe ya está adentro de lo
   gastado, y contarlo otra vez es exactamente el error que hundió la versión
   anterior de esta app. Una nota, cuando se registra, deja de ser nota y pasa
   a lo gastado: tampoco se cuenta dos veces.

   La nota es una cifra EXTERNA. Se lee para armar este número y nada más: no
   se mezcla con los gastos, no toca el saldo real ni la proyección, y la
   columna que la muestra enseña el importe anotado tal cual — no un número
   derivado del presupuesto, que se movería cada vez que él edita una celda.

   Esto NO es plata. El saldo real sigue saliendo solo de totales(). */
function costoRubro(r){
  if(!r) return 0;
  return Math.max(0, red((+r.gastado||0)+(+r.permPend||0)+(+r.notas||0)));
}
function rubroDe(k,cat){
  return rubrosDe(k).filter(function(x){ return x.cat===cat; })[0] || null;
}
function compromiso(k){
  var pend=0, det=[];
  rubrosDe(k).forEach(function(r){
    /* Lo gastado no puede ser negativo para esto. Un rubro que solo recibe
       devoluciones (Descuentos/Reembolsos) tiene gasto real negativo, y restar
       un negativo inventaba un compromiso que no existe: con presupuesto 0 y
       −279 de reembolsos, la app creía que todavía quedaban 279 por gastar. */
    var gPos=Math.max(0, cts(r.gastado));
    var porPres=(r.pres==null)?0:Math.max(0, cts(r.pres)-gPos);
    /* Lo que TODAVÍA tiene que salir de este rubro: los permanentes sin pagar
       más lo anotado en notas, que es gasto ya hecho y sin copiar de la banca.
       Los dos son obligaciones y no se pisan, así que se suman entre sí — pero
       contra el presupuesto se sigue tomando el MAYOR, nunca la suma: si el
       presupuesto ya los cubre, sumarlo encima sería contar dos veces. */
    var porPerm=cts(r.permPend)+Math.max(0, cts(r.notas));
    var v=Math.max(porPres,porPerm);
    if(v>0){ pend+=v; det.push({cat:r.cat, porPres:porPres/100, porPerm:porPerm/100,
                                notas:Math.max(0,r.notas), val:v/100}); }
  });
  /* DURANTE la ventana el ahorro cuenta como un compromiso más: la plata que se
     va a apartar no está disponible para gastar. Solo AL CIERRE se lo trata como
     ahorro, sumado a lo que haya sobrado (ver vistaCierres). */
  det.sort(function(a,b){ return b.val-a.val; });
  var t=totales(k), ip=ingresoPendiente(k);
  var libre=red(t.queda+ip.pendiente-pend/100);
  return {pendiente:red(pend/100), det:det, ingPend:ip.pendiente, ingDet:ip.det, libre:libre};
}
/* ═══════════ CIERRE DE UNA VENTANA ═══════════════════════════════════
   El ahorro real solo se sabe cuando la ventana ya pasó y los gastos reales
   están todos adentro. Son dos partes, las dos de dinero que existió:
     · lo que se apartó al rubro de ahorro (gasto real de ese rubro)
     · lo que sobró de todo lo demás (saldo real de la ventana)
   No se guarda nada: se calcula de los movimientos cada vez que se mira.      */
function cierre(k){
  var t=totales(k), ap=totAhorro(k), pres=totPresupuestado(k);
  return {k:k, ing:t.ing, egr:t.egr, sobrante:t.queda,
          apartado:ap, ahorroReal:red(t.queda+ap),
          pres:pres, n:movsDe(k).length};
}
/* ═══════════ COTEJO: LO PLANEADO CONTRA LO REAL ═══════════════════════
   Dos mundos paralelos que nunca se mezclan.
     PLANEADO · lo que él pronostica: el presupuesto por rubro (egresos) y los
                permanentes de ingreso activos (ingresos). No es plata.
     REAL     · los movimientos que reportó. Esto sí es plata, y es lo único
                que entra en totales().
   La diferencia se calcula siempre como real − plan.                        */
function planIngresos(k){
  var c=0; permsActivos(k).forEach(function(p){ if((p.tipo||"Egreso")==="Ingreso") c+=cts(p.monto); });
  return c/100;
}
/* La diferencia se muestra SIEMPRE como "a favor": positivo es bueno en las tres
   filas. Por eso en gastos es plan − real (gastar menos suma a favor) y en las
   otras dos es real − plan. Así el signo y el color dicen lo mismo en todas. */
function cotejo(k){
  var t=totales(k), pi=planIngresos(k), pg=totPresupuestado(k), pr=red(pi-pg);
  return {
    ing:{plan:pi, real:t.ing,   dif:red(t.ing-pi)},
    egr:{plan:pg, real:t.egr,   dif:red(pg-t.egr)},
    res:{plan:pr, real:t.queda, dif:red(t.queda-pr)}
  };
}
function totPresupuestado(k){
  var c=0, p=presuDe(k);
  Object.keys(p).forEach(function(x){ if(p[x]!=null&&p[x]!=="") c+=cts(p[x]); });
  return c/100;
}

/* =============================================================================
   RENDER
============================================================================= */
function $(s,r){ return (r||document).querySelector(s); }
/* =============================================================================
   NO PERDER EL LUGAR

   Marcar una casilla, borrar una fila o cambiar un rubro obliga a redibujar, y
   redibujar destruye los nodos: el contenedor con desplazamiento vuelve a
   arriba y hay que bajar otra vez a buscar dónde se estaba. Acá se anota la
   altura de cada caja desplazable antes de redibujar y se restituye después.

   La clave de cada caja es el data-t de su tabla, que sobrevive al redibujado.
   Al cambiar de pestaña NO se restituye: ahí sí corresponde empezar arriba.
============================================================================= */
var SCROLL_TAB=null;
function claveScroll(el,i){
  var t=el.querySelector("table[data-t]");
  if(t) return t.getAttribute("data-t");
  var l=el.getAttribute("data-lista"); if(l) return "lista:"+l;
  return "n"+i;
}
function scrollsLee(){
  var m={}, i=0;
  document.querySelectorAll(".tabla-cont,.mb,.lista-cfg,.pron-lista").forEach(function(el){
    var k=claveScroll(el,i++);
    if(el.scrollTop>0) m[k]=el.scrollTop;
  });
  return {cajas:m, y:window.scrollY||0};
}
function scrollsPone(g){
  if(!g) return;
  var i=0;
  document.querySelectorAll(".tabla-cont,.mb,.lista-cfg,.pron-lista").forEach(function(el){
    var k=claveScroll(el,i++), v=g.cajas[k];
    if(v>0) el.scrollTop=v;
  });
  if(g.y>0) window.scrollTo(0,g.y);
}
/* ---------------------------------------------------------------------------
   EL ANCLA · que la fila que estoy tocando no se me mueva
   ---------------------------------------------------------------------------
   Conservar el desplazamiento en píxeles no alcanza. Las tablas están ordenadas
   por una columna, y al guardar un cambio esa fila se reacomoda: el mismo
   scrollTop pasa a mostrar otro contenido y se siente como un salto hacia
   arriba. Lo mismo pasa cuando el contenido se acorta y el navegador recorta el
   desplazamiento al nuevo máximo.

   Por eso, además del desplazamiento, se guarda QUÉ fila se tocó y a qué altura
   de la pantalla estaba. Después de redibujar se busca esa misma fila y se
   corrige la diferencia — primero moviendo su contenedor, y lo que sobre, la
   página. Si la fila desapareció (se borró), no se corrige nada y queda el
   desplazamiento de siempre.
--------------------------------------------------------------------------- */
/* ---------------------------------------------------------------------------
   ORDEN CONGELADO
   ---------------------------------------------------------------------------
   Una tabla se ordena cuando yo lo pido: al abrirla, al cambiar de ventana o al
   tocar un encabezado. NO cada vez que se guarda un cambio. Si el orden se
   recalculara con cada tecla, la fila que estoy editando se iría a otro lugar
   —igualar un presupuesto la manda al fondo— y se siente como que la pantalla
   salta sola.

   El orden vigente se guarda como una lista de claves. Mientras la firma no
   cambie (misma ventana, misma columna, mismo sentido), las filas se muestran
   en ese orden; lo que aparece nuevo se agrega al final y lo que desaparece se
   cae solo. No se guarda en S: es memoria de la sesión, no un dato.
--------------------------------------------------------------------------- */
var ORD_CONG={};
function ordenCongelado(clave, firma, arr, idDe){
  var c=ORD_CONG[clave];
  if(!c || c.firma!==firma){
    ORD_CONG[clave]={firma:firma, lista:arr.map(idDe)};
    return arr;
  }
  var pos={};
  c.lista.forEach(function(x,i){ pos[x]=i; });
  var out=arr.slice().sort(function(a,b){
    var pa=pos[idDe(a)], pb=pos[idDe(b)];
    if(pa==null && pb==null) return 0;
    if(pa==null) return 1;                 /* lo que es nuevo va al final */
    if(pb==null) return -1;
    return pa-pb;
  });
  c.lista=out.map(idDe);                   /* los nuevos ya quedan en el orden */
  return out;
}
function ordenOlvida(){ ORD_CONG={}; }     /* al cambiar de pestaña o de ventana */
/* Renombrar no es mover: el rubro tiene que quedarse donde estaba. */
function ordenRenombra(clave, viejo, nuevo){
  var c=ORD_CONG[clave]; if(!c) return;
  var i=c.lista.indexOf(viejo);
  if(i>=0) c.lista[i]=nuevo;
}

var ANCLA=null, ANCLA_TS=0;
var ANCLA_ATTRS=["data-id","data-cat","data-pid","data-tj","data-vk","data-bit",
                 "data-cr","data-pid2","data-b","data-lista","data-pr"];
function anclaEsc(v){ return String(v).replace(/\\/g,"\\\\").replace(/"/g,'\\"'); }
function anclaDe(el){
  if(!el||!el.closest) return null;
  for(var i=0;i<ANCLA_ATTRS.length;i++){
    var a=ANCLA_ATTRS[i], n=null;
    try{ n=el.closest("["+a+"]"); }catch(e){ n=null; }
    if(n){
      var v=n.getAttribute(a);
      if(v!=null&&v!=="") return {sel:"["+a+'="'+anclaEsc(v)+'"]', top:n.getBoundingClientRect().top};
    }
  }
  return null;
}
function anclaFija(a){
  if(!a) return;
  var n=null; try{ n=document.querySelector(a.sel); }catch(e){ return; }
  if(!n) return;
  var d=Math.round(n.getBoundingClientRect().top - a.top);
  if(!d) return;
  var cont=n.closest?n.closest(".tabla-cont,.mb,.lista-cfg,.pron-lista"):null;
  if(cont && cont.scrollHeight>cont.clientHeight+1){
    var antes=cont.scrollTop;
    cont.scrollTop=antes+d;
    d-=(cont.scrollTop-antes);              /* lo que el contenedor no pudo absorber */
  }
  if(d) window.scrollTo(0,Math.max(0,(window.scrollY||0)+d));
}
/* Se mide en fase de captura: corre antes que cualquier manejador, así que la
   altura que se guarda todavía es la de ANTES de redibujar. */
["click","change","input"].forEach(function(evName){
  document.addEventListener(evName, function(e){
    ANCLA=anclaDe(e.target); ANCLA_TS=Date.now();
  }, true);
});
function anclaVigente(){
  var a=(ANCLA && (Date.now()-ANCLA_TS)<1500)? ANCLA : null;
  ANCLA=null;
  return a;
}
function render(){

/* El recordatorio de las suscripciones con fecha de corte. Aparece solo cuando
   falta poco; si no hay nada que avisar, no ocupa espacio. Ningún número de
   este panel entra en la resta: es un aviso, no plata. */
/* ═══════════ NOTAS · SEGUNDO NÚMERO, NUNCA UN MOVIMIENTO ══════════════════
   Las notas se anotan en la app satélite, parado en la tienda, antes de que el
   cargo llegue al estado de cuenta. Sirven para UNA cosa: ensombrecer un
   margen —"cuánto me queda de este rubro"— mientras el dato real llega.

   NO SON DINERO. No entran en totales(), ni en el presupuesto, ni en la
   proyección, ni en los cierres. Si una nota se quedara sin borrar, el número
   con notas queda pesimista: muestra menos plata de la que hay, nunca más. Ese
   es el lado seguro del error, y es a propósito.

   Viven en su propia colección, un documento por nota, porque las escriben las
   dos apps: si vivieran dentro del documento de estado, dos escrituras a la vez
   se pisarían entera. Ojo con el segmento: el estado usa DOC_NUBE ("estado"
   para la casa original), las notas usan CUENTA ("victor"). No son el mismo.

   La forma la fijó el chat de la satélite y se lee tolerando que falte todo. */
var NOTAS=[], NOTAS_EST="", notasUnsub=null;
function notasRef(){
  if(!NUBE_OK || !nubeDB) return null;
  try{ return nubeDB.collection("notas").doc(CUENTA).collection("items"); }
  catch(e){ return null; }
}
function notaNorm(d,id){
  d=d||{};
  /* El monto puede llegar como número o como texto con comas: parseMonto lee
     los dos. Y SOLO cuenta si es positivo — una nota es un gasto anotado; un
     negativo subiría el disponible y borraría gasto real del presupuesto. */
  var n=parseMonto(d.monto);
  var c=d.cubierta;
  return {id:id,
    fecha:String(d.fecha||""), que:String(d.que||""),
    monto:(isFinite(n)&&n>0? red(n) : 0),
    pago:String(d.pago||""), cat:String(d.cat||""), k:String(d.k||""),
    /* la satélite puede escribir true, "true" o 1: los tres cierran la nota */
    cubierta:(c===true||c==="true"||c===1||c==="1"),
    cubiertaTs:(+d.cubiertaTs||0),
    autor:String(d.autor||""), ts:(+d.ts||0)};
}
/* Las que cuentan: de esta ventana y sin cubrir. Nada más. */
function notasVivas(k){
  return NOTAS.filter(function(n){ return !n.cubierta && n.k===k; });
}
/* Sin ventana estampada no pertenece a ningún corte: no se adivina cuál. Pero
   tampoco puede desaparecer de la vista, así que se lista con las sueltas. */
function notasSinCorte(){
  return NOTAS.filter(function(n){ return !n.cubierta && !n.k; });
}
/* Renombrar un rubro tiene que seguir a las notas, que viven en otra colección.
   Se actualizan en la nube y en memoria; si no hay nube, al menos en memoria,
   para que la pantalla no mienta hasta la próxima escucha. */
/* Notas que no caen en ninguna fila de rubro: sin rubro, con un rubro que ya no
   existe, o de otra ventana. Callarlas sería esconder plata anotada. Se cuentan
   aparte y se dice por qué no descuentan de ningún rubro. */
function notasSueltasHTML(k){
  var todas=rubrosDe(k).map(function(r){ return r.cat; });
  var sinRubro=notasVivas(k).filter(function(n){ return todas.indexOf(n.cat)<0; });
  var sinCorte=notasSinCorte();
  var otraVen=NOTAS.filter(function(n){ return !n.cubierta && n.k && n.k!==k; });
  var n=sinRubro.length+sinCorte.length+otraVen.length;
  if(!n) return "";
  var partes=[];
  if(sinRubro.length) partes.push(sinRubro.length+" sin un rubro de esta ventana");
  if(sinCorte.length) partes.push(sinCorte.length+" sin corte anotado");
  if(otraVen.length)  partes.push(otraVen.length+" de otra ventana");
  var monto=notasSuma(sinRubro.concat(sinCorte).concat(otraVen));
  return '<div class="sub" style="margin-top:8px;font-size:12.5px" data-t="notasSueltas" title="'+esc(
    "Notas de la app satélite que no caen en ninguna fila de esta pantalla: sin rubro elegido, con un "+
    "rubro que no existe acá, sin corte anotado, o anotadas contra otra ventana. No se pierden, pero "+
    "tampoco descuentan de ningún presupuesto de esta ventana. Se corrigen desde la satélite.")+'">'+
    '<b>'+n+'</b> nota'+(n===1?"":"s")+' fuera de las filas &middot; '+
    '<b style="font-variant-numeric:tabular-nums">'+fmt(monto)+'</b>'+
    ' &mdash; '+esc(partes.join(", "))+'; no descuentan de ningún rubro '+
    '<button class="ln" data-acc="ver-notas" style="font-size:12px">ver y corregir</button></div>';
}
/* ═══════════ LAS NOTAS DESDE LA MADRE ═════════════════════════════════════
   La satélite sigue siendo la dueña: las notas viven en su colección y con su
   contrato de diez campos. La madre ahora también puede verlas una por una,
   corregirlas, agregar y quitar — escribiendo EXACTAMENTE el mismo documento,
   para que la satélite no note la diferencia.

   Lo que no cambia: una nota nunca es dinero. No entra en totales(), ni en el
   cierre, ni en el cotejo. Solo descuenta del disponible que se muestra y entra
   en la proyección, que es lo que él pidió.                                  */
function notaVacia(){
  return {id:"n"+id(), fecha:hoyISO(), que:"", monto:0, pago:(S.prefs.pago||""),
          cat:"", k:kAct(), cubierta:false, cubiertaTs:0, autor:CUENTA, ts:Date.now()};
}
/* El documento tal cual lo espera la satélite: ni un campo de más. */
function notaDoc(n){
  return {fecha:String(n.fecha||""), que:String(n.que||""), monto:+n.monto||0,
          pago:String(n.pago||""), cat:String(n.cat||""), k:String(n.k||""),
          cubierta:!!n.cubierta, cubiertaTs:+n.cubiertaTs||0,
          autor:String(n.autor||""), ts:+n.ts||Date.now()};
}
function notaDe(id){ return NOTAS.filter(function(x){ return x.id===id; })[0]||null; }
/* Escribe una nota entera. Sin nube no se escribe nada y se dice: escribir solo
   en memoria se perdería al recargar y la satélite nunca se enteraría. */
function notaEscribir(n,fin){
  var ref=notasRef();
  if(!ref){ toast("Sin conexión a la nube: la nota no se pudo guardar",5000); return false; }
  try{
    ref.doc(n.id).set(notaDoc(n))
      .then(function(){ if(fin) fin(true); })
      ["catch"](function(){ toast("No se pudo guardar la nota",5000); if(fin) fin(false); });
  }catch(e){ toast("No se pudo guardar la nota",5000); return false; }
  return true;
}
function notaBorrar(idN){
  var n=notaDe(idN); if(!n) return;
  if(!confirm("¿Quitar la nota «"+(n.que||"sin texto")+"» por "+fmt(n.monto)+"?\n\n"+
              "Se borra también en el celular. No toca ningún movimiento.")) return;
  var ref=notasRef();
  if(!ref){ toast("Sin conexión a la nube: la nota no se pudo quitar",5000); return; }
  try{
    ref.doc(idN)["delete"]()
      .then(function(){ toast("Nota quitada"); })
      ["catch"](function(){ toast("No se pudo quitar la nota",5000); });
  }catch(e){ toast("No se pudo quitar la nota",5000); }
  NOTAS=NOTAS.filter(function(x){ return x.id!==idN; });    /* la pantalla no espera */
  render(); pintaNotas();
}

      '<label class="sub">Ver</label>'+

      '</select>'+

      '<select class="pill" data-nf="cat"><option value="">— todos —</option>'+

      '<span class="sub" data-t="notasSuma">'+todas.length+' nota'+(todas.length===1?"":"s")+
        ' &middot; sin cubrir '+fmt(suma)+'</span>'+

    '</div>'+
    '<div class="tabla-cont" style="max-height:52vh"><table data-t="tablaNotas"><thead><tr>'+

      'Sin conexión con las notas ('+esc(NOTAS_EST)+'): no se pueden guardar cambios.</p>' : '');
}
function filaNota(n){
  var otra=(n.k && n.k!==kAct());
  return '<tr data-nid="'+esc(n.id)+'"'+(n.cubierta?' style="opacity:.55"':'')+'>'+

/* Redibujar por una nota que llegó del celular no puede robarle el teclado: si

     (a.tagName==="INPUT"||a.tagName==="TEXTAREA")){

function notasEscuchar(){
  var ref=notasRef(); if(!ref) return;
  try{ if(notasUnsub) notasUnsub(); }catch(e){}
  notasUnsub=null;
  try{
    notasUnsub=ref.onSnapshot(function(snap){
      var arr=[];
      snap.forEach(function(doc){ arr.push(notaNorm(doc.data(), doc.id)); });
      NOTAS=arr; NOTAS_EST="ok";
      renderNotas();
    }, function(e){
      /* Si la escucha se cae, la pantalla no puede seguir descontando notas que
         la app ya soltó: se redibuja sin ellas y se reintenta más tarde. */
      NOTAS=[]; NOTAS_EST=(e&&e.code)||"mal";
      try{ renderNotas(); }catch(x){}
      setTimeout(notasEscuchar, 60000);
    });

/* ═══════════ LIMPIAR NOTAS DESPUÉS DE UN PEGADO ══════════════════════════
   Una nota no es una compra: es "esto todavía no está en la app". Cuando el
   estado de cuenta llega y se registra, esa deuda queda saldada — sin importar
   qué línea del banco corresponde a qué nota.

   Por eso NO se intenta emparejar automáticamente. Emparejar es imposible: el
   texto del banco nunca coincide con lo escrito en la caja, y el monto tampoco,
   porque por ley se cobra un poco menos al pagar con tarjeta. Lo que sí se
   puede es proponer y que él decida, que es la regla 2 de siempre.

   La única señal que vale es asimétrica y por eso sirve: lo anotado en la caja
   es igual o MAYOR que lo que cobra el banco, nunca menor. Se usa solo para
   mostrar al lado el movimiento que probablemente le corresponde. No decide. */
var CUB=null;                                  /* propuesta de cubrir, mientras el modal está abierto */

/* ¿Este movimiento podría ser esta nota? Solo para mostrarlo al lado. */
function notaCalza(n,m){
  /* pagoCoincide devuelve 1 (calza), -1 (no calza) o 0 (no se sabe). Solo el 1
     sirve: tomar -1 por verdadero cruzaría notas de una tarjeta con otra. */
  if(pagoCoincide({pago:n.pago},{pago:m.pago})!==1) return null;
  var vn=cts(n.monto), vm=cts(m.monto);
  if(vm<=0) return null;
  var dif=vn-vm;                               /* la nota debe quedar arriba, o casi */
  if(dif< -200) return null;                   /* más de L 2 por debajo: no es */
  if(dif> Math.max(Math.round(vm*0.20), 5000)) return null;   /* ni 20% ni L 50 por arriba */
  var d=(n.fecha&&m.fecha)? diasEntre(n.fecha,m.fecha) : 99;
  if(d>12) return null;
  return {dif:dif, dias:d, m:m};
}
function mejorCalce(n,movs){
  var mejor=null;
  movs.forEach(function(m){
    var c=notaCalza(n,m); if(!c) return;
    if(!mejor || Math.abs(c.dif)<Math.abs(mejor.dif) ||
       (Math.abs(c.dif)===Math.abs(mejor.dif) && c.dias<mejor.dias)) mejor=c;
  });
  return mejor;
}
/* Arma la propuesta: qué notas quedaron cubiertas por lo que se acaba de
   guardar. Una nota se propone tildada si su fecha ya está dentro de lo que
   cubre el pegado PARA SU FORMA DE PAGO. Nada se aplica solo. */
function cubrirPropuesta(k,nuevos){
  var vivas=notasVivas(k);
  if(!vivas.length) return null;
  var egresos=nuevos.filter(function(m){ return m.tipo!=="Ingreso"; });
  if(!egresos.length) return null;
  /* Hasta qué fecha llegó el pegado, forma de pago por forma de pago. */
  var hasta={};
  egresos.forEach(function(m){
    var f=m.pago||"";
    if(!hasta[f] || String(m.fecha||"")>hasta[f]) hasta[f]=String(m.fecha||"");
  });
  var out=[];
  vivas.forEach(function(n){
    var tope="", sinPago=!String(n.pago||"").trim();
    Object.keys(hasta).forEach(function(f){
      if(pagoCoincide({pago:n.pago},{pago:f})===1 && hasta[f]>tope) tope=hasta[f];
    });
    /* Una nota sin forma de pago anotada no calza con ninguna tarjeta, pero
       tampoco puede quedar invisible para siempre: se lista destildada, con el
       tope más alto del pegado, para que él decida. */
    if(!tope && sinPago) Object.keys(hasta).forEach(function(f){ if(hasta[f]>tope) tope=hasta[f]; });
    if(!tope) return;                          /* el pegado no tocó su tarjeta */
    var c=mejorCalce(n,egresos);
    /* Sin fecha no se puede afirmar que el pegado ya la cubrió: "" <= tope es
       verdadero en JavaScript y la dejaba tildada sola. */
    var cubre=(!!n.fecha && n.fecha<=tope && !sinPago);
    out.push({n:n, calce:c, cubre:cubre, tope:tope, sinPago:sinPago, tomar:cubre});
  });
  return out.length? {k:k, filas:out} : null;
}

/* ═══════════ HASTA CUÁNDO LLEGA EL DATO ═══════════════════════════════════
   Un saldo correcto puede engañar si le faltan las compras de anteayer. Este
   panel no calcula plata ni la corrige: dice, por forma de pago, hasta qué
   fecha está cargado y hace cuánto fue el último pegado, para saber cuánto
   confiar en los números que están arriba.

   Todo sale de lo que ya existe —la fecha de los movimientos y la bitácora—:
   no se guarda ningún dato nuevo. Y NINGUNA cifra de acá entra en totales(),
   en el presupuesto ni en la proyección. Es información sobre el dato, no
   dato. (Regla 3: las fechas sirven para identificar y avisar, nunca para dar
   por hecho un monto.) */
function frescuraDe(k){
  var movs=movsDe(k);
  /* Índice id→movimiento, para leer de qué forma de pago fue cada pegado sin
     recorrer todo por cada entrada de la bitácora. */
  var porId={};
  S.movimientos.forEach(function(m){ porId[m.id]=m; });

  /* Último pegado por forma de pago. Se deduce de los movimientos que ESE
     pegado dejó vivos: si se revirtió o se borraron, ese pegado no cuenta,
     que es lo correcto — sus datos ya no están. */
  var pegado={};
  (S.bitacora||[]).forEach(function(e){
    if(e.tipo!=="bloque" || e.revertido) return;
    (e.movs||[]).forEach(function(mid){
      var m=porId[mid]; if(!m || m.k!==k) return;
      var f=m.pago||"(sin forma)";
      if(!pegado[f] || String(e.ts)>String(pegado[f])) pegado[f]=e.ts;
    });
  });

  var hoy=hoyISO(), acum={};
  movs.forEach(function(m){
    var f=m.pago||"(sin forma)";
    if(!acum[f]) acum[f]={forma:f, ultima:"", n:0};
    acum[f].n++;
    if(String(m.fecha||"")>acum[f].ultima) acum[f].ultima=String(m.fecha||"");
  });

  /* Qué formas se listan: las que se usaron en esta ventana, y las que se
     usaron alguna vez aunque en esta no —"sin registros" en una tarjeta que sí
     usás es justo lo que hay que ver—. Una forma de pago que nunca se usó no
     aporta nada y solo empuja hacia abajo lo que importa. El orden de la lista
     es el de SUS formas de pago, no uno inventado. */
  var usadaAlguna={};
  S.movimientos.forEach(function(m){ if(m.pago) usadaAlguna[m.pago]=true; });

  var out=[];
  (S.formas||[]).forEach(function(f){
    if(!acum[f] && !usadaAlguna[f]) return;
    var a=acum[f]||{forma:f, ultima:"", n:0};
    out.push({forma:f, ultima:a.ultima, n:a.n,
              dias:a.ultima? diasEntre(a.ultima,hoy) : null,
              pegTs:pegado[f]||"",
              pegDias:pegado[f]? diasEntre(String(pegado[f]).slice(0,10),hoy) : null});
  });
  if(acum["(sin forma)"]) out.push({forma:"(sin forma)", ultima:acum["(sin forma)"].ultima,
    n:acum["(sin forma)"].n, dias:diasEntre(acum["(sin forma)"].ultima,hoy),
    pegTs:pegado["(sin forma)"]||"", pegDias:null});
  return out;
}
function haceTxt(d){
  if(d==null) return "—";
  if(d===0) return "hoy";
  if(d===1) return "ayer";
  return "hace "+d+" días";

/* Responde de un vistazo las dos preguntas del día a día: en qué rubro me estoy
   excediendo, y cuál tiene aire por si cae un gasto inesperado. Misma data que
   la pantalla Rubros, ordenada de más apretado a más holgado. */
/* ---------------- MOSAICO DE RUBROS ----------------
   El área de cada bloque es su parte del gasto real de la ventana. El color no
   dice nada nuevo: es la misma tonalidad, más oscura mientras más grande, para
   separar bloques vecinos sin convertir la pantalla en un arcoíris. Entre
   bloques queda un hueco de 2px, que es lo que de verdad los separa.
   Todo sale de los movimientos; no hay ningún dato guardado detrás. */
var MOS_TONOS=["#14447f","#1c5cab","#2a78d6","#5f99e1","#8ab6ec","#b3d0f3","#d3e4f9","#eaf2fc"];
var MOS_MAX=8;                                  /* del noveno en adelante, «Otros rubros» */
function mosaicoDatos(k){
  var m={}, ca=catAhorro();
  movsDe(k).forEach(function(x){
    if(x.tipo==="Ingreso") return;
    var c=x.cat||"Sin categoría";
    m[c]=(m[c]||0)+cts(x.monto);
  });
  var arr=[];
  Object.keys(m).forEach(function(c){ arr.push({cat:c, cts:m[c]}); });
  var favor=arr.filter(function(x){ return x.cts<0; });
  arr=arr.filter(function(x){ return x.cts>0; }).sort(function(a,b){ return b.cts-a.cts; });
  var vis=arr.slice(0,MOS_MAX), resto=arr.slice(MOS_MAX);
  if(resto.length){
    var s=0; resto.forEach(function(x){ s+=x.cts; });
    vis.push({cat:"Otros rubros", cts:s, grupo:resto.map(function(x){ return x.cat; })});
  }
  var tot=0; vis.forEach(function(x){ tot+=x.cts; });
  return {bloques:vis, total:tot, favor:favor, ahorro:ca};
}
/* Partición binaria por mitades: parte la lista donde la suma se acerca más a la
   mitad y corta el rectángulo por su lado largo. Da bloques de proporciones
   razonables sin necesidad de una librería. */
function mosaicoCorta(vals,x,y,w,h,out){
  if(!vals.length) return;
  if(vals.length===1){ out.push({i:vals[0].i,x:x,y:y,w:w,h:h}); return; }
  var total=0; vals.forEach(function(v){ total+=v.a; });
  if(total<=0) return;
  var acc=0, k=1, mejor=Infinity, mitad=total/2;
  for(var j=0;j<vals.length-1;j++){
    acc+=vals[j].a;
    var d=Math.abs(acc-mitad);
    if(d<mejor){ mejor=d; k=j+1; }
  }
  var sa=0; for(var m2=0;m2<k;m2++) sa+=vals[m2].a;
  var f=sa/total;
  if(w>=h){ mosaicoCorta(vals.slice(0,k),x,y,w*f,h,out);
            mosaicoCorta(vals.slice(k),x+w*f,y,w*(1-f),h,out); }
  else    { mosaicoCorta(vals.slice(0,k),x,y,w,h*f,out);
            mosaicoCorta(vals.slice(k),x,y+h*f,w,h*(1-f),out); }
}

  var d=mosaicoDatos(k);

      '<th class="der" style="width:16%" title="'+esc("Gasto real del rubro «"+ca+"»: plata que ya salió de la cuenta y quedó guardada.")+'">Apartado</th>'+
      '<th class="der" style="width:16%" title="'+esc("Lo apartado al rubro «"+ca+"» más lo que sobró de todo lo demás (ingresos − gastos reales). Es el ahorro de verdad de esa ventana, y solo se sabe cuando la ventana ya pasó.")+'">Ahorro real</th>'+

/* ---------------- PANTALLA 2 · MOVIMIENTOS ---------------- */
function movsOrdenados(){
  var k=kAct(), o=S.ui.ordMov, q=(S.ui.busca||"").toLowerCase().trim();
  var ft=S.ui.fTipo||"todo";
  var arr=movsDe(k);
  /* El filtro es de VISTA: esconde filas, no cambia ni un total. */
  if(ft==="Ingreso"||ft==="Egreso") arr=arr.filter(function(m){
    return (m.tipo==="Ingreso") === (ft==="Ingreso");
  });
  if(q) arr=arr.filter(function(m){
    return (String(m.desc||"")+" "+String(m.cat||"")+" "+String(m.pago||"")+" "+String(m.motivo||"")).toLowerCase().indexOf(q)>=0;
  });
  arr=arr.slice().sort(function(a,b){
    var x,y;
    if(o.k==="monto"){ x=cts(a.monto); y=cts(b.monto); }
    else { x=String(a[o.k]||"").toLowerCase(); y=String(b[o.k]||"").toLowerCase(); }
    if(x<y) return -1*o.dir; if(x>y) return 1*o.dir;
    /* Segundo orden SIEMPRE por fecha, de la más nueva a la más vieja: al
       ordenar por tarjeta o por rubro, cada grupo queda cronológico por dentro
       en vez de en un orden arbitrario. */
    if(o.k!=="fecha"){
      var fa=String(a.fecha||""), fb=String(b.fecha||"");
      if(fa!==fb) return fa<fb? 1 : -1;
    }
    return String(a.id)<String(b.id)?-1:1;
  });
  return ordenCongelado("mov", k+"|"+o.k+"|"+o.dir+"|"+q, arr, function(m){ return m.id; });
}
function thOrd(campo,txt,extra){
  var o=S.ui.ordMov, act=o.k===campo;

}

}

/* =============================================================================
   DUPLICADOS YA REGISTRADOS
   La grilla de pegado avisa antes de guardar, pero un duplicado también nace de
   otras formas: marcar un permanente cuyo cargo ya vino del banco, desmarcarlo
   creyendo que se borra y volver a marcarlo, o anotar dos veces a mano. Ahí
   nadie avisaba, y el movimiento repetido se llevaba por delante los gastos y
   —si el rubro es el de un préstamo— hacía avanzar el plan de pagos una cuota
   de más.
   Mismo criterio que en el pegado, sin inventar nada nuevo: MISMO IMPORTE al
   centavo, MISMA descripción de banco y pocos días de diferencia. La app marca
   los dos y no borra ninguno: cuál sobra lo sabe él.
============================================================================= */
/* Si él ya dijo que un movimiento NO es duplicado, deja de compararse contra
   todo: la sugerencia no vuelve. Es una marca suya, no una deducción. */
function movDupes(k){
  var arr=movsDe(k).filter(function(m){ return m.fecha && cts(m.monto) && qDescCore(m.desc) && !m.noDup; });
  var out={};
  for(var i=0;i<arr.length;i++){
    for(var j=i+1;j<arr.length;j++){
      var r=repeCompara(arr[i],arr[j]);
      if(!r) continue;
      if(!out[arr[i].id]) out[arr[i].id]={n:1, otro:arr[j], tipo:r.tipo};
      out[arr[i].id].n++;
      if(!out[arr[j].id]) out[arr[j].id]={n:1, otro:arr[i], tipo:r.tipo};
      out[arr[j].id].n++;
      if(r.tipo==="exacta"){ out[arr[i].id].tipo="exacta"; out[arr[j].id].tipo="exacta"; }
    }
  }
  return out;
}

/* =============================================================================
   REEMBOLSABLES · plata propia que alguien más tiene que devolver.

   NO ES UNA CATEGORÍA DE DINERO APARTE. El gasto ya está contado en gastos
   desde que se registró, y el cobro, cuando llega, ya está contado en
   ingresos. Lo único que se agrega acá es el VÍNCULO entre los dos, para no
   perder de vista lo que falta cobrar. totales() no mira ni un campo de esta
   sección: el saldo real es el mismo con el vínculo puesto o sin él.

   Reembolsable es todo rubro que empiece con "Reembols" — Reembolsable,
   Reembolso Abuelos, Reembolsables. "Descuentos/Reembolsos" queda afuera a
   propósito: eso no es plata que alguien deba.
============================================================================= */
function esReemb(m){ return /^\s*reembols/i.test(String((m&&m.cat)||"")); }
function reembGasto(m){ return !!m && m.tipo!=="Ingreso" && esReemb(m); }
function reembCobro(m){ return !!m && m.tipo==="Ingreso" && esReemb(m); }
function cobroDe(mid){
  var r=null;
  S.movimientos.forEach(function(x){ if(x.reembDe===mid && reembCobro(x) && !r) r=x; });
  return r;
}
function gastoDe(cobro){
  if(!cobro||!cobro.reembDe) return null;
  var g=S.movimientos.filter(function(x){ return x.id===cobro.reembDe; })[0];
  return reembGasto(g)? g : null;
}
/* Cobrado = hay un ingreso ligado, o él lo dio por cobrado a mano.
   La marca a mano existe porque a veces el reintegro llega en efectivo y no
   se registra como movimiento; entonces no hay ingreso que ligar. */
function reembCobrado(m){ return reembGasto(m) && (m.reembOk===true || !!cobroDe(m.id)); }
/* Esta ventana y la anterior: el cobro casi nunca cae en el mismo corte que
   el gasto. Nada de esto cruza plata entre ventanas — es solo un puntero. */
function reembVentanas(){
  var k=kAct(), p=ventanaPrevia(k);
  return p? [k,p] : [k];
}
function reembPendientes(){
  var ks=reembVentanas();
  return S.movimientos.filter(function(m){
    return ks.indexOf(m.k)>=0 && reembGasto(m) && !reembCobrado(m);
  });
}
/* Candidatos vistos desde un ingreso: todo gasto reembolsable que todavía no
   tenga un COBRO REAL ligado. Los dados por cobrado a mano siguen en la lista
   —la marca a mano es un recordatorio, no un movimiento— y se muestran con su
   aclaración; ligarles el ingreso real borra la marca. */
function reembLigables(){
  var ks=reembVentanas();
  return S.movimientos.filter(function(m){
    return ks.indexOf(m.k)>=0 && reembGasto(m) && !cobroDe(m.id);
  });
}
function reembCobrosLibres(){
  var ks=reembVentanas();
  return S.movimientos.filter(function(m){
    return ks.indexOf(m.k)>=0 && reembCobro(m) && !gastoDe(m);
  });
}
function reembResumen(k){
  var n=0, tot=0;
  S.movimientos.forEach(function(m){
    if(m.k!==k || !reembGasto(m) || reembCobrado(m)) return;
    n++; tot+=cts(m.monto);
  });
  return {n:n, monto:red(tot/100)};
}
function nombreK(k){ var p=String(k||"").split("|"); return (p[1]||"")+" "+(p[0]||""); }
/* Al borrar un movimiento se cortan los vínculos que lo apuntaban, para que no
   queden gastos "cobrados" por un ingreso que ya no existe. */
function reembOlvida(mid){
  S.movimientos.forEach(function(x){ if(x.reembDe===mid) delete x.reembDe; });
}
function reembLiga(cobroId,gastoId){
  var c=S.movimientos.filter(function(x){return x.id===cobroId;})[0];
  var g=S.movimientos.filter(function(x){return x.id===gastoId;})[0];
  if(!c||!g) return false;
  /* un cobro liga a un solo gasto y un gasto recibe un solo cobro */
  S.movimientos.forEach(function(x){ if(x.reembDe===gastoId && x.id!==cobroId) delete x.reembDe; });
  c.reembDe=gastoId;
  delete g.reembOk;              /* el ingreso real manda sobre la marca a mano */
  guardar(); render();
  return true;
}
function reembCorta(mid){
  var m=S.movimientos.filter(function(x){return x.id===mid;})[0];
  if(!m) return;
  if(reembCobro(m)) delete m.reembDe;
  else { delete m.reembOk; reembOlvida(mid); }
  guardar(); render();
}
function reembMarca(gastoId,on){
  var g=S.movimientos.filter(function(x){return x.id===gastoId;})[0];
  if(!g) return;
  if(on) g.reembOk=true; else delete g.reembOk;
  guardar(); render();
}

function abreReemb(mid){
  var m=S.movimientos.filter(function(x){return x.id===mid;})[0];
  if(!m) return;
  var esG=reembGasto(m), esC=reembCobro(m);
  if(!esG&&!esC) return;
  function ficha(x,acc){
    return '<div class="rb-it">'+
      '<div class="rb-d"><b>'+esc(x.desc||"(sin descripción)")+'</b>'+
        (x.motivo?' <span class="sub">· '+esc(x.motivo)+'</span>':'')+
        '<div class="sub">'+esc(x.fecha? fmtF(x.fecha) : "sin fecha")+' &middot; '+esc(x.cat||"sin rubro")+
        (x.pago?' &middot; '+esc(x.pago):'')+
        (x.k!==kAct()?' &middot; <b>'+esc(nombreK(x.k))+'</b>':'')+
        (x.reembOk===true?' &middot; <b>dado por cobrado a mano</b>':'')+'</div></div>'+
      '<div class="rb-m">'+fmt(x.monto)+'</div>'+(acc||"")+'</div>';
  }
  var ligado = esG? cobroDe(m.id) : gastoDe(m);
  var cands  = esG? reembCobrosLibres() : reembLigables();
  cands=cands.filter(function(x){ return x.id!==m.id; });

  var h='<div class="mh"><h3>'+(esG?"Cobro de un gasto reembolsable":"¿A qué gasto corresponde este cobro?")+'</h3>'+
    '<div class="sp"></div><button class="icb" data-acc="cerrar">×</button></div>'+
    '<div class="mb">'+
    '<p class="sub" style="margin:0 0 10px">Ligar un cobro a su gasto <b>no mueve ningún número</b>. '+
    'El gasto ya está en gastos y el cobro ya está en ingresos desde que se registraron; '+
    'esto solo deja de mostrarlo como pendiente.</p>'+
    '<div class="secc"><h4>'+(esG?"Gasto":"Cobro")+'</h4>'+ficha(m)+'</div>';

  if(ligado){
    h+='<div class="secc"><h4>'+(esG?"Cobrado con este ingreso":"Cubre este gasto")+'</h4>'+
      ficha(ligado,'<button class="btn gh peq" data-acc="reemb-cortar" data-rid="'+esc(m.id)+'">Desligar</button>')+
      '</div>';
  } else if(esG && m.reembOk){
    h+='<div class="secc"><h4>Estado</h4><div class="rb-it"><div class="rb-d">'+
      'Marcado como cobrado a mano, sin ingreso ligado.</div>'+
      '<button class="btn gh peq" data-acc="reemb-desmarcar" data-rid="'+esc(m.id)+'">Quitar la marca</button></div></div>';
  } else {
    h+='<div class="secc"><h4>'+(esG?"Ingresos reembolsables sin gasto ligado":"Gastos reembolsables sin cobrar")+
      ' <span class="sub" style="text-transform:none;letter-spacing:0">· esta ventana y la anterior</span></h4>'+
      (cands.length? cands.map(function(x){
        return ficha(x,'<button class="btn peq" data-acc="reemb-ligar" data-rid="'+esc(m.id)+'" data-oid="'+esc(x.id)+'">Ligar</button>');
      }).join("") : '<div class="vacio" style="padding:18px">No hay '+(esG?"ingresos":"gastos")+
        ' reembolsables libres. '+(esG?"Cuando entre el reintegro, registralo con un rubro que empiece con «Reembols» y volvé acá.":"")+'</div>')+
      '</div>';
    if(esG) h+='<div class="secc"><h4>Sin ingreso registrado</h4><div class="rb-it">'+
      '<div class="rb-d">Si el reintegro llegó en efectivo y no se registró como movimiento, '+
      'se puede dar por cobrado a mano.<div class="sub">No crea ningún ingreso: los gastos e ingresos reales no cambian.</div></div>'+
      '<button class="btn gh peq" data-acc="reemb-marcar" data-rid="'+esc(m.id)+'">Dar por cobrado</button></div></div>';
  }
  h+='</div><div class="mf"><button class="btn gh" data-acc="cerrar">Cerrar</button></div>';
  abreModal(h);
}
/* Refresca el total activo de la cabecera sin reconstruir la tabla (no se
   pierde el foco mientras se escribe en otra celda). */
function repintaTotalPerm(tipo){
  var ing=(tipo==="Ingreso"), k=kAct(), tot=0, act=0;
  permsK(k).forEach(function(f){
    if(((f.tipo||"Egreso")==="Ingreso")!==ing) return;
    if(!permActivo(f)) return;
    tot+=cts(f.monto); act++;
  });
  var el=$('[data-t="permTotal'+(ing?"I":"")+'"]');
  if(el) el.textContent=fmt(tot/100)+" activo"+(act===1?"":"s");
}
function permsOrdenados(tipo){
  var ing=(tipo==="Ingreso");
  var o=(ing? S.ui.ordPermI : S.ui.ordPerm)||{k:"desc",dir:1}, k=kAct();
  var base=permsK(k);
  if(tipo) base=base.filter(function(f){ return ((f.tipo||"Egreso")==="Ingreso")===ing; });
  var arr=base.slice().sort(function(a,b){
    var x,y;
    if(o.k==="monto"){ x=cts(a.monto); y=cts(b.monto); }
    else if(o.k==="activo"){ x=permActivo(a)?1:0; y=permActivo(b)?1:0; }
    else if(o.k==="marca"){ x=movDePerm(k,a.id)?1:0; y=movDePerm(k,b.id)?1:0; }
    else if(o.k==="desc"){ x=String(a.desc||a.cat||"").toLowerCase(); y=String(b.desc||b.cat||"").toLowerCase(); }
    else { x=String(a[o.k]||"").toLowerCase(); y=String(b[o.k]||"").toLowerCase(); }
    if(x<y) return -o.dir; if(x>y) return o.dir;
    return String(a.desc||"").localeCompare(String(b.desc||""));
  });
  return ordenCongelado("perm"+(ing?"I":"E"), k+"|"+o.k+"|"+o.dir, arr, function(f){ return f.id; });
}
/* Dos tablas, misma mecánica: los ingresos que se repiten mes a mes y los gastos
   que se repiten mes a mes. Las dos son de la ventana, se heredan de la anterior
   al crearla y desde ahí son independientes: editar acá no reescribe el pasado y
   lo editado es lo que hereda la ventana siguiente. */

        return '<button class="ft'+(f===x?" on":"")+'" data-fperm="'+x+'">'+et+'</button>';
      }).join("")+
    '</div>'+
    '<span class="sub">Un permanente es una plantilla: no es dinero hasta marcar su casilla.</span>'+

  return barra+
    (f!=="Egreso"? tablaPerms("Ingreso") : "")+

function tablaPerms(tipo){

  var lista=permsOrdenados(tipo);
  var act=lista.filter(permActivo).length;
  var marcados=lista.filter(function(f){ return !!movDePerm(k,f.id); }).length;
  var vencidos=lista.filter(function(f){ return permActivo(f)&&cuotaVencida(f,k); });
  var prev=ventanaPrevia(k), sufijo=ing?"I":"";
  var o=(ing? S.ui.ordPermI : S.ui.ordPerm)||{k:"desc",dir:1};
  var total=0; lista.forEach(function(f){ if(permActivo(f)) total+=cts(f.monto); });
  function th(campo,txt,extra){

/* Ingreso del rubro ya registrado en la ventana SIN ligar a un permanente.
   Si eso ya cubre lo que este permanente espera, marcarlo lo contaría dos veces. */
/* Plata que YA está registrada en ese rubro de esta ventana y no está ligada a
   ningún permanente. Si él marca la casilla encima, el mismo dinero queda
   contado dos veces — y en un préstamo eso hace avanzar el plan de pagos una
   cuota de más. La app no lo impide: lo pone a la vista antes de marcar. */
function sueltoEnRubro(k,cat,tipo){
  var c=0, esIng=(tipo==="Ingreso");
  movsDe(k).forEach(function(m){
    if(((m.tipo||"Egreso")==="Ingreso")!==esIng || m.permId) return;
    if((m.cat||"Sin categoría")!==cat) return;
    c+=cts(m.monto);
  });
  return c/100;
}
function ingresoSuelto(k,cat){ return sueltoEnRubro(k,cat,"Ingreso"); }
/* Movimientos de esta ventana que PODRÍAN SER ESTE MISMO COBRO ya registrado:
   mismo rubro, sin ligar a ningún permanente, y con el importe dentro del
   margen del rubro. Compartir rubro no basta —en Suscripciones hay diez cobros
   distintos—; lo que delata el doble conteo es que además el importe calce. */
function sueltoIgual(k,f){
  var out=[], esIng=((f.tipo||"Egreso")==="Ingreso"), cat=f.cat||"Sin categoría";
  movsDe(k).forEach(function(m){
    if(((m.tipo||"Egreso")==="Ingreso")!==esIng || m.permId) return;
    if((m.cat||"Sin categoría")!==cat) return;
    if(!dentroTol(f,Math.abs(+m.monto||0))) return;
    out.push(m);
  });
  return out;
}

  var yaEntro=0;

/* Los financiamientos son solo lectura: se arman con los permanentes del rubro
   Financiamiento de la ventana activa. Los préstamos se cargan y se editan acá. */
function finRows(){
  var hoy=mesDe(hoyISO());
  return permsK(kAct()).filter(esFinanciamiento).map(function(f){
    var ult=f.ultimaCuota||f.hasta||"";
    var c=finCuotas(f), cuo=red(+f.monto||0);
    var difCal=ult? mesesEntre(hoy,ult) : null;             /* solo para contrastar */
    var restCal=(difCal==null)? null : Math.max(0,difCal+1);
    var prim=(c.total!=null&&ult)? mesMas(ult,-(c.total-1)) : "";
    /* Terminado se decide por cuotas pagadas; si no hay con qué contarlas,
       queda la fecha de la última cuota como único indicio. */
    var term=(c.restantes!=null)? (c.restantes===0) : (difCal!=null&&difCal<0);
    return {f:f, desc:f.desc||f.cat, cuota:cuo, ultima:ult, primera:prim,
            total:c.total, pagadas:c.pagadas, restantes:c.restantes,
            registradas:c.registradas, ancla:c.ancla, deTexto:c.deTexto,
            restCal:restCal, terminado:term,
            desfase:(c.restantes!=null&&restCal!=null&&Math.abs(c.restantes-restCal)>1),
            falta:c.restantes!=null? red(cuo*c.restantes):null,
            pagado:c.pagadas!=null? red(cuo*c.pagadas):null,
            monto:c.total!=null? red(cuo*c.total):null,
            activo:permActivo(f)};
  }).sort(function(a,b){
    if(a.terminado!==b.terminado) return a.terminado?1:-1;
    return String(a.ultima||"9999").localeCompare(String(b.ultima||"9999"));
  });
}

function prSimDe(id){
  S.ui.prSim=S.ui.prSim||{};
  if(!S.ui.prSim[id]) S.ui.prSim[id]={unicoMonto:"",unicoMes:"",mensual:"",cuota:""};
  return S.ui.prSim[id];
}
function prEscenario(sim){
  var ex={};
  if(parseMonto(sim.unicoMonto)>0 && sim.unicoMes) ex.unico={mes:sim.unicoMes, monto:parseMonto(sim.unicoMonto)};
  if(parseMonto(sim.mensual)>0) ex.mensual=parseMonto(sim.mensual);
  if(parseMonto(sim.cuota)>0) ex.cuota=parseMonto(sim.cuota);
  return ex;
}
/* La comparación base contra escenario. Vive en su propio contenedor para poder
   repintarse mientras se escribe sin reconstruir los campos (no se pierde el foco). */
function prCompHTML(p){
  var ex=prEscenario(prSimDe(p.id));
  if(!(ex.unico||ex.mensual||ex.cuota))
    return '<div class="sub" style="margin-top:9px">Sin datos cargados no hay escenario que comparar. Cualquier campo de arriba arma la comparación.</div>';

  return '<div class="tabla-cont" style="margin-top:10px"><table data-t="prComp-'+esc(p.id)+'"><thead><tr>'+
    '<th></th><th class="der" style="width:150px">Al ritmo actual</th>'+
    '<th class="der col-plan" style="width:150px">Con el abono</th>'+
    '<th class="der" style="width:170px">Diferencia</th></tr></thead><tbody>'+
    '<tr><td>Cuotas restantes</td><td class="num">'+h.restantes+'</td>'+

        (ahoMes>0?("−"+ahoMes+" mes"+(ahoMes===1?"":"es")):"0")+'</td></tr>'+
    '<tr><td>Última cuota</td><td class="num">'+(h.ultima||"—")+'</td>'+

      '<td class="num sub">'+(ahoMes>0?("se adelanta "+ahoMes+" mes"+(ahoMes===1?"":"es")):"igual")+'</td></tr>'+

/* La tabla de rubros: presupuesto, permanentes, real, disponible y notas, con
   todo editable en su celda. Vive en la pantalla de Hoy — antes había DOS
   tablas casi iguales, una acá y otra en una pestaña aparte, y no se sabía cuál
   mirar. Ahora es una sola, y esta función es su único dueño.
   La altura se pasa por parámetro porque en Hoy conviene verla entera. */
function panelRubros(k,altura){
  var filas=rubrosDe(k), o=S.ui.ordRub;
  if(o.k==="queda") o.k="quedaN";              /* la columna cambió de fórmula */
  /* rubrosDe ya trae las notas de cada rubro. Acá solo se pregunta si hay
     alguna, para no mostrar una columna vacía. */
  var hayNotas=filas.some(function(r){ return r.nNotas>0; });
  filas.sort(function(a,b){
    var x,y;
    if(o.k==="cat"){ x=a.cat.toLowerCase(); y=b.cat.toLowerCase(); if(x<y)return -o.dir; if(x>y)return o.dir; return 0; }
    if(o.k==="queda"||o.k==="quedaN"){ x=a[o.k]; y=b[o.k];
      if(x==null&&y==null) return a.cat.localeCompare(b.cat);

    else { x=a[o.k]==null?-Infinity:a[o.k]; y=b[o.k]==null?-Infinity:b[o.k]; }
    if(x!==y) return (x-y)*o.dir;                      /* dir −1 = de mayor a menor */
    return a.cat.localeCompare(b.cat);
  });
  filas=ordenCongelado("rub", k+"|"+o.k+"|"+o.dir, filas, function(r){ return r.cat; });

     solo donde hay uno asignado, que es lo que ese número significa. */
  var tp=0,tg=0,tperm=0,tnotas=0,conPres=0;

  });

      '<div class="barra-h" style="margin-bottom:8px">'+

          pasados+' excedido'+(pasados===1?"":"s")+'</span>':'')+
        '<div class="sp"></div>'+
        
        '<button class="btn gh peq" data-acc="rubros-igualar-todos" data-t="btnIgualarTodos" '+
          'title="'+esc("Pone el presupuesto de cada rubro en lo que ese rubro va a costar en la ventana: Real + permanentes por pagar + lo anotado en notas. Iguala, así que sube el que se quedó corto y BAJA el que estaba de más. Pregunta antes. No toca los movimientos ni el saldo real.")+'">= Igualar presupuesto</button>'+
        '<button class="btn gh peq" data-acc="ver-notas" data-t="btnVerNotasRub" title="'+esc(
          "Ver, corregir, agregar y quitar las notas anotadas desde el celular.")+'">Notas'+
          (notasVivas(k).length? " ("+notasVivas(k).length+")" : "")+'</button>'+
        '<button class="btn gh peq" data-acc="rubro-nuevo">+ Rubro</button></div>'+
      '<div class="tabla-cont"'+(altura==="none"?'':' style="max-height:'+(altura||"66vh")+'"')+'><table data-t="tablaRub"'+(hayNotas?' data-notas="1"':'')+'><thead><tr>'+
        '<th style="width:26%"><button data-ordr="cat">Rubro'+(o.k==="cat"?(o.dir>0?" ↑":" ↓"):"")+'</button></th>'+
        th2("permPend","Permanentes","12%","Los permanentes del rubro que TODAVÍA NO se pagaron. El que ya se marcó desaparece de acá porque su importe pasó a Real: dejarlo en las dos columnas contaría el mismo dinero dos veces. Real + esta columna + Notas es lo que el rubro va a costar en la ventana.")+
        th2("pres","Presupuesto","12%","Importe asignado al rubro en esta ventana. Editable en la celda. No afecta el saldo real.","col-plan")+
        th2("gastado","Real","12%","Suma de los movimientos de la ventana en ese rubro.")+
        th2("quedaN","Disponible","13%","Presupuesto − real − notas sin registrar. Una nota es un gasto que todavía no se copió de la banca en línea: eventualmente se registra y deja de ser nota, así que NO es dinero disponible — es dinero gastado. Negativo = rubro excedido.")+
        (hayNotas? th2("notas","Notas","13%","Lo anotado en la app satélite para este rubro que todavía no está registrado como movimiento. No se mueve cuando editás el presupuesto, no entra en el saldo real ni en la proyección. Ya viene descontado de Disponible: es un gasto que falta copiar de la banca. Cuando se registra, pasa a Real y desaparece de acá.") : '')+
        '<th class="plano" style="width:'+(hayNotas?"12%":"18%")+'" title="Porcentaje del presupuesto ya ejecutado.">% ejecutado</th>'+
        '<th class="plano" style="width:7%"></th>'+
      '</tr></thead><tbody>'+
      filas.map(function(r){
        var pctR=(r.pres!=null&&r.pres>0)? Math.max(0,(r.gastado+r.notas)/r.pres*100) : 0;
        var pct=Math.min(100,pctR);
        var pasado=(r.quedaN!=null&&r.quedaN<0);
        var vacio=(r.pres==null && r.n===0 && !r.perm);
        var costo=costoRubro(r);
        var corto=(r.pres!=null && cts(costo)>cts(r.pres));
        return '<tr data-cat="'+esc(r.cat)+'"'+(vacio?' style="opacity:.5"':'')+'>'+
          '<td><input class="cel" data-c="rubroNom" value="'+esc(r.cat)+'" title="Renombrar aquí propaga el cambio a los movimientos y permanentes que usan ese rubro."></td>'+
          '<td class="num"'+(corto?' style="color:var(--avi-tx)" title="'+esc(
            "El presupuesto de este rubro está por debajo de lo que va a costar ("+fmt(costo)+" = "+
            fmt(r.gastado)+" real"+(r.permPend?" + "+fmt(r.permPend)+" por pagar":"")+
            (r.notas?" + "+fmt(r.notas)+" en notas":"")+
            "). Cuando se registre lo que falta, el rubro queda excedido.")+'"':'')+'>'+
            (r.permPend?'<button class="cel" style="text-align:right;width:100%;cursor:pointer;font-variant-numeric:tabular-nums;color:inherit" data-desg="rubroFull" title="'+esc(
              "Permanentes de este rubro sin pagar todavía. Clic para ver el detalle completo del rubro.")+'">'+fmt(r.permPend)+'</button>'+
              (r.perm>r.permPend?'<div class="sub" style="font-size:10px;padding:0 8px 4px 0" title="'+esc(

             :'<span class="sub">—</span>')+'</td>'+
          '<td class="num col-plan"><input class="cel" data-c="pres" inputmode="decimal" placeholder="—" value="'+(r.pres==null?"":esc(r.pres))+'"></td>'+
          '<td class="num"><button class="cel" style="text-align:right;width:100%;cursor:pointer;font-variant-numeric:tabular-nums" '+
            'title="'+r.n+' movimiento'+(r.n===1?"":"s")+' en este rubro &middot; clic para ver el detalle completo" data-desg="rubroFull">'+fmt(r.gastado)+'</button></td>'+
          '<td class="num" style="padding:6px 8px'+(pasado?";color:var(--mal-tx);font-weight:640":(r.quedaN!=null?";color:var(--ok-tx)":""))+'"'+
            (r.notas&&r.quedaN!=null?' title="'+esc(fmt(r.queda)+" de presupuesto sin gastar, menos "+fmt(r.notas)+
              " en "+r.nNotas+" nota"+(r.nNotas===1?"":"s")+" que todavía no se copió de la banca.")+'"':'')+'>'+
            (r.quedaN==null?'<span class="sub">—</span>':fmt(r.quedaN,r.quedaN>0))+'</td>'+
          (hayNotas? '<td class="num" style="padding:6px 8px">'+
            (r.notas? '<button class="rub-lnk der" data-acc="ver-notas" data-cat="'+esc(r.cat)+'" title="'+esc(
                r.nNotas+" nota"+(r.nNotas===1?"":"s")+" sin registrar en este rubro. No es un movimiento: "+
                "no toca el saldo real. Ya viene descontada de Disponible. Clic para verlas y corregirlas.")+
                '" style="font-weight:600">'+fmt(r.notas)+
                '<div class="sub" style="font-size:10.5px;font-weight:400">'+r.nNotas+' nota'+(r.nNotas===1?"":"s")+'</div></button>'
              : '<span class="sub">—</span>')+'</td>' : '')+
          '<td style="padding:6px 8px">'+(r.pres!=null&&r.pres>0?
            '<div class="barra'+(pasado?" x":"")+'" title="'+esc(pctR.toFixed(0)+"% del presupuesto ejecutado"+
              (r.notas?" (real + notas)":""))+'"><i style="width:'+pct.toFixed(1)+'%"></i></div>':
            '<span class="sub">'+(r.pres==null?"sin presupuesto":"presupuesto en cero")+'</span>')+'</td>'+
          '<td style="white-space:nowrap"><button class="borrar" data-acc="rubro-igualar" title="'+esc("Poner el presupuesto de este rubro en lo que va a costar: Real + permanentes por pagar + lo anotado en notas.")+'">=</button>'+
            '<button class="borrar" data-acc="rubro-borrar" title="Quitar el rubro de la lista.">×</button></td>'+
        '</tr>';
      }).join("")+
      '</tbody><tfoot>'+pieRubros(conPres,tp,tg,tperm,hayNotas?tnotas:null)+'</tfoot></table></div>'+
      notasSueltasHTML(k)+
    '</div>';
  return h;

function abreModal(html,ancho){
  var cls=(ancho===true?" ancho":(ancho?" "+ancho:""));
  $("#modales").innerHTML='<div class="velo" data-velo><div class="modal'+cls+'">'+html+'</div></div>';
}
function cierraModal(){
  $("#modales").innerHTML=""; B=null;
  /* Si mientras estaba abierto el pegado llegaron datos de otro aparato, ahora
     sí se pueden adoptar sin llevarse por delante lo que estaba a medio pegar. */
  if(nubePend){ nubePend=false; setTimeout(sincronizarDesdeNube,60); }
}
function cierraTodo(){ colaCuotas=[]; cierraModal(); }
/* No tirar a la basura un lote pegado por un clic al lado del modal. */
function puedeCerrar(){
  if(!B||!B.filas.some(function(f){ return !bVacia(f); })) return true;
  return confirm("Hay filas pegadas sin guardar. Al cerrar se pierden. ¿Cerrar?");
}
function toast(msg,ms){
  document.querySelectorAll(".toast").forEach(function(x){ x.remove(); });   /* uno a la vez */
  var t=document.createElement("div"); t.className="toast"; t.setAttribute("data-t","toast");
  t.textContent=String(msg).replace(/&middot;/g,"·").replace(/&nbsp;/g," ");
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, ms||3600);
}

/* ---------------- desglose: de qué está hecho un número ---------------- */
function desglose(cual,extra){
  var k=kAct(), t=totales(k), lista=[], lineas=null, titulo="", total=0, formula="";
  if(cual==="ing"){ titulo="Ingresos reales &middot; "+S.ui.per+" "+S.ui.anio;
    lista=movsDe(k).filter(function(m){return m.tipo==="Ingreso";}); total=t.ing;
    formula="Suma de los "+lista.length+" movimientos de tipo <b>Ingreso</b> de la ventana."; }
  else if(cual==="egr"){ titulo="Gastos reales &middot; "+S.ui.per+" "+S.ui.anio;
    lista=movsDe(k).filter(function(m){return m.tipo!=="Ingreso";}); total=t.egr;
    formula="Suma de los "+lista.length+" movimientos de tipo <b>Egreso</b> de la ventana. "+
      "Los montos negativos (devoluciones y descuentos) restan."; }
  else if(cual==="queda"){ titulo="Saldo real &middot; "+S.ui.per+" "+S.ui.anio;
    lista=movsDe(k); total=t.queda;
    formula="<code>saldo real = ingresos reales − gastos reales</code><br>"+
      "<code>"+fmt(t.ing)+" − "+fmt(t.egr)+" = "+fmt(t.queda,true)+"</code><br>"+
      "Solo los "+lista.length+" movimientos de la ventana entran en esta resta. "+
      "El presupuesto, los permanentes sin marcar y el saldo manual <b>no</b> entran."; }
  else if(cual==="ahorro"){ titulo=esc(catAhorro())+" apartado &middot; "+S.ui.per+" "+S.ui.anio;
    lista=movsAhorro(k); total=totAhorro(k);
    formula="Movimientos de la ventana en el rubro <b>"+esc(catAhorro())+"</b>: plata que ya salió de la cuenta "+
      "y quedó guardada. Lo que todavía falta por ahorrar vive en la proyección, dentro del "+
      "<b>saldo libre proyectado</b>."; }
  else if(cual==="comprometido"){ titulo="Compromisos pendientes &middot; "+S.ui.per+" "+S.ui.anio;
    var c=compromiso(k); total=c.pendiente;
    lineas=c.det.map(function(d){ return {t:d.cat, v:d.val,
      n:"presupuesto no gastado "+fmt(d.porPres)+" &middot; permanentes sin marcar"+
        (d.notas?" + notas":"")+" "+fmt(d.porPerm)+" → se toma el mayor"}; });
    formula="Plata que la ventana todavía tiene que pagar: lo que falta ejecutar del presupuesto, los "+
      "permanentes activos que aún no se marcaron, y lo anotado en notas que todavía no se copió de la banca.<br>"+
      "Por rubro se toma el <b>mayor</b> entre el presupuesto no gastado y la suma de obligaciones "+
      "(permanentes por pagar + notas), nunca la suma de los dos lados: el presupuesto de un rubro ya "+
      "debería cubrir sus permanentes, y sumarlos encima sería contar el mismo importe dos veces. Un gasto "+
      "suelto en un rubro <b>no</b> descuenta el compromiso de sus permanentes: cada permanente se descuenta "+
      "al marcar su casilla, no antes.<br>"+
      "El rubro <b>"+esc(catAhorro())+"</b> cuenta como cualquier otro: durante la ventana esa plata está "+
      "comprometida. Solo al cerrar se la trata como ahorro (ver la pestaña <b>Cierres</b>).<br>"+
      "<b>No entra en los gastos reales.</b> Es una proyección."; }
  else if(cual==="ingpend"){ titulo="Ingreso permanente por entrar &middot; "+S.ui.per+" "+S.ui.anio;
    var ci=compromiso(k); total=ci.ingPend;
    lineas=ci.ingDet.map(function(d){ return {t:d.cat, v:d.val,
      n:"esperado "+fmt(d.esperado)+" &middot; ya recibido "+fmt(d.recibido)+" → falta la diferencia"}; });
    formula="Ingresos permanentes <b>activos y sin marcar</b> de la ventana.<br>"+
      "Por rubro se descuenta lo que ya entró: si el ingreso se registró sin ligarlo a su permanente, "+
      "sumarlo otra vez sería contar el mismo dinero dos veces.<br>"+
      "<b>No entra en los ingresos reales.</b> Es una proyección: se vuelve real al marcar el permanente "+
      "o al registrar el movimiento."; }
  else if(cual==="libre"){ titulo="Saldo libre proyectado &middot; "+S.ui.per+" "+S.ui.anio;
    var c2=compromiso(k); total=c2.libre; lineas=[];
    formula="<code>saldo real"+(c2.ingPend>0?" + ingreso permanente por entrar":"")+" − compromisos pendientes</code><br><code>"+
      fmt(t.queda,true)+(c2.ingPend>0?" + "+fmt(c2.ingPend):"")+" − "+fmt(c2.pendiente)+" = "+fmt(c2.libre,true)+"</code><br>"+
      "El saldo real por sí solo puede inducir a error: parte de ese importe ya está comprometido por el "+
      "presupuesto. Esta cifra es el remanente después de ejecutarlo.<br>"+
      "Es una proyección: solo cambia al modificar el presupuesto, los permanentes o los movimientos."; }
  else if(cual==="rubroFull"){
    /* La ficha entera de un rubro: qué se presupuestó, qué se gastó, qué
       permanentes tiene y qué movimientos lo componen. Todo sale de lo que ya
       existe — presupuesto, permanentes y movimientos —; acá solo se junta. */
    var rF=rubrosDe(k).filter(function(x){ return x.cat===extra; })[0];
    if(!rF) return;
    var pmF=permsK(k).filter(function(p){
      return (p.tipo||"Egreso")!=="Ingreso" && (p.cat||"Sin categoría")===extra; });
    var mvF=movsDe(k).filter(function(m){
      return m.tipo!=="Ingreso" && (m.cat||"Sin categoría")===extra; });
    var pctF=rF.pres>0? ((rF.gastado+rF.notas)/rF.pres*100) : null;
    var cab='<div class="ct-fila" style="margin-bottom:10px">'+
      '<div class="ct"><div class="ct-et">Presupuesto</div><div class="ct-g">'+
        '<span class="ct-l">asignado</span><span class="ct-v c-plan">'+(rF.pres==null?"—":fmt(rF.pres))+'</span>'+
        '<span class="ct-l">va a costar</span><span class="ct-v"'+(rF.pres!=null&&cts(costoRubro(rF))>cts(rF.pres)?' style="color:var(--avi-tx)"':'')+
          ' title="'+esc("Real + permanentes por pagar + notas sin registrar: lo que este rubro va a costar en la ventana.")+'">'+fmt(costoRubro(rF))+'</span>'+
        '<span class="ct-l">% ejec.</span><span class="ct-v">'+(pctF==null?"—":pctF.toFixed(0)+"%")+'</span>'+
      '</div></div>'+
      '<div class="ct"><div class="ct-et">Real</div><div class="ct-g">'+
        '<span class="ct-l">gastado</span><span class="ct-v">'+fmt(rF.gastado)+'</span>'+
        '<span class="ct-l">movs.</span><span class="ct-v">'+rF.n+'</span>'+
        '<span class="ct-l">perm. sin marcar</span><span class="ct-v">'+fmt(rF.permPend)+'</span>'+
      '</div></div>'+
      '<div class="ct"><div class="ct-et">Disponible</div><div class="ct-g">'+
        '<span class="ct-l">'+(rF.notas?"− real − notas":"presup. − real")+'</span><span class="ct-v" style="color:'+
          (rF.quedaN!=null&&rF.quedaN<0?"var(--mal-tx)":"var(--ok-tx)")+';font-weight:650" title="'+esc(
          rF.notas? ("Presupuesto "+(rF.pres==null?"—":fmt(rF.pres))+" − real "+fmt(rF.gastado)+
                     " − "+fmt(rF.notas)+" en notas sin registrar.")
                  : "Presupuesto menos real.")+'">'+
          (rF.quedaN==null?"—":fmt(rF.quedaN,rF.quedaN>0))+'</span>'+
        '<span class="ct-l">compromiso</span><span class="ct-v" title="'+esc(
          "Lo que todavía puede salir de este rubro: el mayor entre el presupuesto sin gastar y "+
          "los permanentes por pagar más las notas sin registrar. El mismo criterio que la proyección de Hoy.")+
          '">'+fmt(Math.max(
            rF.pres==null? 0 : Math.max(0, red(rF.pres-Math.max(0,rF.gastado))),
            red(rF.permPend+Math.max(0,rF.notas))))+'</span>'+
        '<span class="ct-l">&nbsp;</span><span class="ct-v">&nbsp;</span>'+
      '</div></div></div>';
    var perF=pmF.length? '<div class="secc"><h4>Permanentes de este rubro ('+pmF.length+')</h4>'+
      '<div class="tabla-cont"><table><thead><tr>'+
        '<th class="plano">Comercio</th><th class="plano">Ritmo</th>'+
        '<th class="plano">Estado</th><th class="plano der">Monto</th></tr></thead><tbody>'+
      pmF.map(function(pp){
        var on=!!movDePerm(k,pp.id), act=permActivo(pp), toca=permToca(pp);
        var px=proximoCobro(pp), fe=avisoFecha(pp);
        var est=!act? '<span class="chip mal">pausado</span>'
              : on? '<span class="chip ok">pagado</span>'
              : toca? '<span class="chip avi">sin marcar</span>'
                    : '<span class="chip">no toca este mes</span>';
        return '<tr><td style="padding:5px 8px">'+esc(pp.desc||pp.cat)+
            (pp.motivo?' <span class="sub">· '+esc(pp.motivo)+'</span>':'')+'</td>'+
          '<td style="padding:5px 8px" class="sub">'+esc(cadaTxt(cadaDe(pp)))+
            (cadaDe(pp)>1&&px.mes?' · próximo '+esc(fe?fmtFecha(fe):px.mes):'')+'</td>'+
          '<td style="padding:5px 8px">'+est+'</td>'+
          '<td style="padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums">'+fmt(pp.monto)+'</td></tr>';
      }).join("")+'</tbody></table></div></div>' : '';
    var movF=mvF.length? '<div class="secc"><h4>Movimientos de este rubro ('+mvF.length+')</h4>'+
      '<div class="tabla-cont"><table><thead><tr>'+
        '<th class="plano">Fecha</th><th class="plano">Comercio</th>'+
        '<th class="plano">Forma de pago</th><th class="plano der">Monto</th></tr></thead><tbody>'+
      mvF.slice().sort(function(a2,b2){ return String(a2.fecha)<String(b2.fecha)?-1:1; }).map(function(m){

      '<div class="mb" data-t="modalDesglose">'+cab+
        '<p class="sub" style="margin:0 0 12px">Presupuesto y permanentes son previsión; solo los '+

      '<div class="mf"><button class="btn gh" data-acc="cerrar">Cerrar</button></div>', true);
